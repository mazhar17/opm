.deptVision',c.deptVision)+\n      taFld('Department / school mission (1.1)','crit1.deptMission',c.deptMission)+\n    '<\u002Fdiv>'+\n    taFld('How the institutional and departmental missions are aligned (1.1)','crit1.alignment',c.alignment)+\n    taFld('Process of establishing the PEOs, and the stakeholders consulted \\u2014 industry included (1.2)','crit1.peoProcess',c.peoProcess)+\n    taFld('How the PEOs are published and disseminated to each stakeholder group (1.2)','crit1.dissemination',c.dissemination)+\n    taFld('Why the PEOs are realistic within available resources (1.2)','crit1.resourceRealism',c.resourceRealism)+\n    taFld('Process for tracking graduates and employers (1.4)','crit1.trackingProcess',c.trackingProcess)+\n    '<\u002Fdiv>';\n\n  h+='<div class=\"card\"><h2>Stakeholders (1.2)<\u002Fh2><p class=\"hint\">Who was consulted, in what capacity, and when. The industrial advisory panel and alumni association belong here.<\u002Fp>';\n  if(!state.stakeholders.length) h+='<div class=\"empty\">No stakeholders recorded.<\u002Fdiv>';\n  else{\n    h+='<div class=\"tbl-wrap\"><table class=\"tbl\"><thead><tr><th>Group<\u002Fth><th>Name / body<\u002Fth><th>Role in PEO or curriculum review<\u002Fth><th>Last consulted<\u002Fth><th style=\"width:60px\"><\u002Fth><\u002Ftr><\u002Fthead><tbody>';\n    state.stakeholders.forEach(function(s,i){\n      h+='<tr><td><span class=\"chip\">'+esc(s.group||'\\u2014')+'<\u002Fspan><\u002Ftd><td>'+esc(s.name||'')+'<\u002Ftd><td>'+esc(s.role||'')+'<\u002Ftd><td>'+esc(s.last||'\\u2014')+'<\u002Ftd>'+\n        '<td><button class=\"btn small secondary\" onclick=\"editStakeholder('+i+')\">Edit<\u002Fbutton><\u002Ftd><\u002Ftr>';\n    });\n    h+='<\u002Ftbody><\u002Ftable><\u002Fdiv>';\n  }\n  h+='<div class=\"btn-row\"><button class=\"btn secondary\" onclick=\"editStakeholder(-1)\">+ Add stakeholder<\u002Fbutton><\u002Fdiv><\u002Fdiv>';\n\n  h+='<div class=\"card\"><h2>PEO measurement process (1.4)<\u002Fh2><p class=\"hint\">Per PEO: how attainment is measured and against what criterion. Figures themselves live on the PEO Attainment tab.<\u002Fp>';\n  if(!state.peos.length) h+='<div class=\"empty\">No PEOs defined yet.<\u002Fdiv>';\n  else{\n    h+='<div class=\"tbl-wrap\"><table class=\"tbl\"><thead><tr><th style=\"width:64px\">PEO<\u002Fth><th>Assessment method<\u002Fth><th>Tool<\u002Fth><th>Attainment criterion<\u002Fth><th style=\"width:90px\">Mission link<\u002Fth><th style=\"width:60px\"><\u002Fth><\u002Ftr><\u002Fthead><tbody>';\n    state.peos.forEach(function(p,i){\n      var miss=(p.missionLink||'').trim();\n      h+='<tr><td><b>'+esc(p.code)+'<\u002Fb><\u002Ftd>'+\n        '<td>'+(p.method? esc(p.method):'<span class=\"pill p-bad\">missing<\u002Fspan>')+'<\u002Ftd>'+\n        '<td>'+(p.tool? esc(p.tool):'<span class=\"pill p-bad\">missing<\u002Fspan>')+'<\u002Ftd>'+\n        '<td>'+(p.criteria? esc(p.criteria):'<span class=\"pill p-bad\">missing<\u002Fspan>')+'<\u002Ftd>'+\n        '<td>'+(miss? '<span class=\"pill p-ok\">stated<\u002Fspan>':'<span class=\"pill p-bad\">missing<\u002Fspan>')+'<\u002Ftd>'+\n        '<td><button class=\"btn small secondary\" onclick=\"editPeoProcess('+i+')\">Edit<\u002Fbutton><\u002Ftd><\u002Ftr>';\n    });\n    h+='<\u002Ftbody><\u002Ftable><\u002Fdiv>';\n  }\n  h+='<\u002Fdiv>';\n\n  if(state.peos.length){\n    h+='<div class=\"card\"><h2>PEO \\u2194 mission consistency (1.3)<\u002Fh2><p class=\"hint\">Each PEO needs a stated line to the mission it serves. This table is what clause 1.3 asks for.<\u002Fp><div class=\"tbl-wrap\"><table class=\"tbl\"><thead><tr><th style=\"width:64px\">PEO<\u002Fth><th>Statement<\u002Fth><th style=\"width:40%\">Consistency with the mission<\u002Fth><\u002Ftr><\u002Fthead><tbody>';\n    state.peos.forEach(function(p,i){\n      h+='<tr><td><b>'+esc(p.code)+'<\u002Fb><\u002Ftd><td style=\"font-size:12.5px\">'+esc(p.statement||'')+'<\u002Ftd>'+\n        '<td>'+(p.missionLink? esc(p.missionLink):'<span class=\"pill p-bad\">not stated<\u002Fspan>')+'<\u002Ftd><\u002Ftr>';\n    });\n    h+='<\u002Ftbody><\u002Ftable><\u002Fdiv><\u002Fdiv>';\n  }\n  $('tab-crit1').innerHTML=h;\n  bindFields();\n}\nfunction taFld(label,path,val){\n  return '<label class=\"fld\" style=\"margin-top:10px\">'+esc(label)+'<textarea data-path=\"'+path+'\" rows=\"3\" style=\"font:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;resize:vertical\">'+esc(val||'')+'<\u002Ftextarea><\u002Flabel>';\n}\nfunction editStakeholder(i){\n  var row= i>-1? state.stakeholders[i]:null;\n  modal(row?'Edit stakeholder':'Add stakeholder',[\n    {key:'group',label:'Group',type:'select',options:['Industry / IAP','Alumni','Employers','Faculty members','Students','Professional body','Regulator','Other'],value:row?row.group:'Industry / IAP'},\n    {key:'name',label:'Name / body',value:row?row.name:'',placeholder:'e.g. Industrial Advisory Panel, Dept. of TE'},\n    {key:'role',label:'Role in PEO or curriculum review',type:'textarea',value:row?row.role:''},\n    {key:'last',label:'Last consulted',value:row?row.last:'',placeholder:'e.g. March 2026'}\n  ],{\n    onSave:function(v){\n      if(!v.name){ toast('Enter a name','err'); return; }\n      if(row) Object.assign(row,v); else state.stakeholders.push(Object.assign({id:uid('sh')},v));\n      save(); closeModal(); refresh();\n    },\n    onDelete: row? function(){ if(!confirm('Remove this stakeholder?')) return; state.stakeholders.splice(i,1); save(); closeModal(); refresh(); }:null\n  });\n}\nfunction editPeoProcess(i){\n  var p=state.peos[i]; if(!p) return;\n  modal('Measurement process \\u2014 '+p.code,[\n    {key:'method',label:'Assessment method',value:p.method||'',placeholder:'e.g. Alumni survey 3\\u20135 years after graduation, triangulated with employer survey'},\n    {key:'tool',label:'Instrument / tool',value:p.tool||'',placeholder:'e.g. AUST alumni questionnaire (5-point Likert), employer feedback form'},\n    {key:'criteria',label:'Attainment criterion',value:p.criteria||'',placeholder:'e.g. \\u2265 70% of respondents agree or strongly agree'},\n    {key:'tracking',label:'How graduates and employers are tracked',type:'textarea',value:p.tracking||''},\n    {key:'missionLink',label:'Consistency with the mission (1.3)',type:'textarea',value:p.missionLink||''},\n    {key:'annexure',label:'Annexure',type:'select',options:ANNEX_CODES,value:p.annexure||'C'}\n  ],{\n    onSave:function(v){ Object.assign(p,v); save(); closeModal(); refresh(); toast('Saved for '+p.code); }\n  });\n}\n\n/* ---------------- Stakeholder feedback (5.3.1\\u20135.3.4) ---------------- */\n/* Reusable stakeholder-feedback card, embedded in the attainment tabs.\n   SAR 5.3.1\\u20135.3.4: Students \\u2192 PLO Attainment, Faculty \\u2192 CO Attainments,\n   Alumni + Employers \\u2192 PEO Attainment. The 4-channel coverage check lives\n   in the SAR Builder readiness panel. */\nfunction feedbackCard(chs, suffix, clause, hint){\n  var h2='<div class=\"card\"><h2>Stakeholder feedback \\u2014 '+esc(chs.join(' & '))+subTag(clause.replace('SAR ',''))+'<\u002Fh2>'+\n    '<p class=\"hint\">'+esc(clause)+': a described collection process and a demonstrated use in improvement. '+esc(hint)+'<\u002Fp>'+\n    '<div class=\"grid c2\">'+chs.map(function(c){\n      var rows=state.feedback.filter(function(f){return f.channel===c;});\n      var used=rows.filter(function(f){return f.usedIn;}).length;\n      return '<div class=\"kpi '+(rows.length? (used? 'ok':'warn'):'bad')+'\"><div class=\"cap\">'+esc(c)+'<\u002Fdiv><div class=\"val\">'+rows.length+'<\u002Fdiv><div class=\"sub\">'+(rows.length? used+' linked to a CQI action':'nothing recorded \\u2014 required by the SAR')+'<\u002Fdiv><\u002Fdiv>';\n    }).join('')+'<\u002Fdiv>';\n  var rows=state.feedback.filter(function(f){ return chs.indexOf(f.channel)>-1; })\n    .sort(function(a,b){ return semRank(b.cycle)-semRank(a.cycle)||String(b.cycle||'').localeCompare(String(a.cycle||'')); });\n  var fbKey='fb-rows-'+suffix;\n  if(rows.length) h2+='<h3 style=\"cursor:pointer;font-size:13px;margin:12px 0 6px\" onclick=\"toggleColl(\\''+fbKey+'\\')\">'+(collOpen(fbKey,rows.length<=4)?'\\u25be ':'\\u25b8 ')+'Rounds logged ('+rows.length+')<\u002Fh3>';\n  if(rows.length && collOpen(fbKey,rows.length<=4)){\n    h2+='<div class=\"tbl-wrap\"><table class=\"tbl\"><thead><tr>'+(chs.length>1?'<th>Channel<\u002Fth>':'')+'<th>Instrument<\u002Fth><th>Cycle<\u002Fth><th>Respondents<\u002Fth><th>Rate %<\u002Fth><th>Key findings<\u002Fth><th>Used in<\u002Fth><th style=\"width:60px\"><\u002Fth><\u002Ftr><\u002Fthead><tbody>';\n    rows.forEach(function(f){\n      var i=state.feedback.indexOf(f);\n      h2+='<tr>'+(chs.length>1?'<td><span class=\"chip\">'+esc(f.channel||'')+'<\u002Fspan><\u002Ftd>':'')+'<td>'+esc(f.instrument||'')+'<\u002Ftd><td style=\"white-space:nowrap\">'+esc(f.cycle||'\\u2014')+'<\u002Ftd>'+\n        '<td>'+esc(f.respondents||'\\u2014')+'<\u002Ftd><td>'+esc(f.rate||'\\u2014')+'<\u002Ftd>'+\n        '<td style=\"max-width:300px;font-size:12.5px\">'+esc(f.findings||'\\u2014')+'<\u002Ftd>'+\n        '<td>'+(f.usedIn? '<span class=\"pill p-ok\">'+esc(f.usedIn)+'<\u002Fspan>':'<span class=\"pill p-warn\">not linked<\u002Fspan>')+'<\u002Ftd>'+\n        '<td><button class=\"btn small secondary\" onclick=\"editFeedback('+i+')\">Edit<\u002Fbutton><\u002Ftd><\u002Ftr>';\n    });\n    h2+='<\u002Ftbody><\u002Ftable><\u002Fdiv>';\n  }\n  h2+='<div class=\"btn-row\" style=\"margin-top:6px\"><button class=\"btn secondary\" onclick=\"newFeedback(\\''+esc(chs[0])+'\\')\">+ Log '+esc(chs[0].toLowerCase())+' round<\u002Fbutton>'+\n    (chs[1]? '<button class=\"btn secondary\" onclick=\"newFeedback(\\''+esc(chs[1])+'\\')\">+ Log '+esc(chs[1].toLowerCase())+' round<\u002Fbutton>':'')+\n    '<button class=\"btn secondary\" onclick=\"fbTemplate()\">Template (CSV)<\u002Fbutton>'+\n    '<button class=\"btn secondary\" onclick=\"$(\\'fbImp-'+suffix+'\\').click()\">Import CSV / JSON<\u002Fbutton>'+\n    '<button class=\"btn secondary\" onclick=\"fbExport(\\'csv\\')\">Export all (CSV)<\u002Fbutton>'+\n    '<input type=\"file\" id=\"fbImp-'+suffix+'\" accept=\".csv,.json,text/csv,application/json\" style=\"display:none\"><\u002Fdiv>'+\n    (rows.some(function(f){return !f.usedIn;})? '<div class=\"note\">&ldquo;Used in&rdquo; is what turns feedback into evidence: name the CQI action, committee decision or curriculum change the round produced. A round with no consequence is a finding against the program.<\u002Fdiv>':'')+\n    '<\u002Fdiv>';\n  return h2;\n}\nfunction wireFeedbackCard(suffix){\n  var fi=$('fbImp-'+suffix);\n  if(fi) fi.onchange=function(e){ var f=e.target.files&&e.target.files[0]; if(f) importRows('feedback',f); e.target.value=''; };\n}\nvar FB_PRESET='';\nfunction newFeedback(ch){ FB_PRESET=ch||''; editFeedback(-1); }\nfunction editFeedback(i){\n  var row= i>-1? state.feedback[i]:null;\n  var cy=curCycle();\n  modal(row?'Edit feedback round':'Log feedback round',[\n    {key:'channel',label:'Channel',type:'select',options:CHANNELS,value:row?row.channel:(FB_PRESET||'Students')},\n    {key:'instrument',label:'Instrument',value:row?row.instrument:'',placeholder:'e.g. Student exit survey, faculty course-review form'},\n    {key:'cycle',label:'Cycle / year',value:row?row.cycle:(cy?cy.semester:''),placeholder:'e.g. Spring 2026'},\n    {key:'respondents',label:'Respondents',type:'number',value:row?row.respondents:''},\n    {key:'rate',label:'Response rate %',type:'number',value:row?row.rate:''},\n    {key:'findings',label:'Key findings',type:'textarea',value:row?row.findings:''},\n    {key:'usedIn',label:'Used in \\u2014 CQI action or committee decision',value:row?row.usedIn:'',placeholder:'e.g. CQI PO11 Spring 2026; ACM minute 12/2026'},\n    {key:'annexure',label:'Annexure',type:'select',options:ANNEX_CODES,value:row?(row.annexure||'H'):'H'}\n  ],{\n    onSave:function(v){\n      if(!v.instrument){ toast('Name the instrument','err'); retur urses||[]).reduce(function(a,c){ return a+(c.poAttain[num(plo.code)]!=null?(c.credit||1):0); },0)||1;\n    s+=Number(v)*cr; w+=cr;\n  });\n  return w? r1(s/w):null;\n}\nfunction renderGradPanel(){\n  var list=cohortsList();\n  if(!list.length) return '';\n  var sel=view.gradCohort||list[list.length-1];\n  if(list.indexOf(sel)===-1) sel=list[list.length-1];\n  view.gradCohort=sel;\n  var marked=gradCyclesOf(sel);\n  var h='<div class=\"card\"><h2>Attainment at graduation'+subTag('2.7')+'<\u002Fh2>'+\n    '<p class=\"hint\">BAETE asks for the attainment of the <b>most recent graduating cohort<\u002Fb>, which is not any single semester. Tick the cycles that make up a cohort\\u2019s final year; the roll-up below is credit-weighted across them.<\u002Fp>'+\n    '<div class=\"btn-row\" style=\"margin-top:0\"><label class=\"fld\" style=\"max-width:220px\">Cohort<select id=\"gradSel\">'+\n    list.map(function(c){ return '<option'+(c===sel?' selected':'')+'>'+esc(c)+'<\u002Foption>'; }).join('')+'<\u002Fselect><\u002Flabel><\u002Fdiv>'+\n    '<div class=\"tbl-wrap\" style=\"margin-top:10px\"><table class=\"tbl\"><thead><tr><th>Cycle<\u002Fth><th style=\"width:170px\">Counts toward graduation<\u002Fth><\u002Ftr><\u002Fthead><tbody>'+\n    state.cycles.filter(function(c){ return (c.cohort||'')===sel; }).sort(function(a,b){return semRank(a.semester)-semRank(b.semester);}).map(function(c){\n      return '<tr><td>'+esc(c.semester)+'<\u002Ftd><td><label style=\"display:flex;gap:8px;align-items:center;font-size:12.5px;cursor:pointer\"><input type=\"checkbox\" data-grad=\"'+esc(c.id)+'\"'+(c.gradCohort?' checked':'')+'> final-year cycle<\u002Flabel><\u002Ftd><\u002Ftr>';\n    }).join('')+'<\u002Ftbody><\u002Ftable><\u002Fdiv>';\n  if(!marked.length){\n    h+='<div class=\"note\">No cycle is marked yet for '+esc(sel)+', so no graduation figure can be published.<\u002Fdiv><\u002Fdiv>';\n    return h;\n  }\n  h+='<div class=\"tbl-wrap\" style=\"margin-top:14px\"><table class=\"tbl matrix\"><thead><tr><th>PO<\u002Fth><th>Target %<\u002Fth><th>At graduation %<\u002Fth><th>Transfer students %<\u002Fth><th>Result<\u002Fth><\u002Ftr><\u002Fthead><tbody>';\n  plosSorted().forEach(function(pl){\n    var v=gradRollup(sel,pl,false), tv=gradRollup(sel,pl,true), t=targetFor(marked[0],pl);\n    h+='<tr><td>'+esc(poLabel(pl.code))+'<\u002Ftd><td>'+t+'<\u002Ftd>'+\n      '<td>'+(v==null?'<span style=\"color:var(--muted)\">\\u2014<\u002Fspan>':'<span class=\"'+(v>=t?'cell-ok':'cell-bad')+'\">'+v+'<\u002Fspan>')+'<\u002Ftd>'+\n      '<td>'+(tv==null?'<span style=\"color:var(--muted)\">not applicable<\u002Fspan>':'<span class=\"'+(tv>=t?'cell-ok':'cell-bad')+'\">'+tv+'<\u002Fspan>')+'<\u002Ftd>'+\n      '<td>'+(v==null?'\\u2014':(v>=t?'<span class=\"pill p-ok\">attained<\u002Fspan>':'<span class=\"pill p-bad\">below target<\u002Fspan>'))+'<\u002Ftd><\u002Ftr>';\n  });\n  h+='<\u002Ftbody><\u002Ftable><\u002Fdiv>'+\n    '<div class=\"btn-row\"><button class=\"btn secondary\" onclick=\"editTransfer()\">Enter transfer-student figures<\u002Fbutton><\u002Fdiv>'+\n    '<div class=\"note\">Transfer students must be demonstrated <b>separately<\u002Fb> where the program admits them (SAR 2.7). Leave the column empty if there are none \\u2014 the SAR pack then states that explicitly.<\u002Fdiv><\u002Fdiv>';\n  return h;\n}\nfunction wireGradPanel(){\n  var g=$('gradSel');\n  if(g) g.onchange=function(){ view.gradCohort=g.value; refresh(); };\n  document.querySelectorAll('[data-grad]').forEach(function(cb){\n    cb.onchange=function(){ var cy=cycleById(cb.dataset.grad); if(cy){ cy.gradCohort=cb.checked; save(); refresh(); } };\n  });\n}\nfunction editTransfer(){\n  var sel=view.gradCohort, marked=gradCyclesOf(sel);\n  if(!marked.length){ toast('Mark the final-year cycles first','err'); return; }\n  var cy=marked[0];\n  modal('Transfer-student attainment \\u2014 '+esc(sel),[],{\n    wide:true,\n    build:function(body){\n      var box=document.createElement('div');\n      box -size:12.5px\">'+esc(d.remedial||'')+'<\u002Ftd>'+\n        '<td>'+esc(d.annexure||'B')+'<\u002Ftd><td>'+(d.status==='Closed'?'<span class=\"pill p-ok\">closed<\u002Fspan>':'<span class=\"pill p-warn\">'+esc(d.status||'Open')+'<\u002Fspan>')+'<\u002Ftd>'+\n        '<td><button class=\"btn small secondary\" onclick=\"editDwc('+i+')\">Edit<\u002Fbutton><\u002Ftd><\u002Ftr>';\n    });\n    h+='<\u002Ftbody><\u002Ftable><\u002Fdiv>';\n  }\n  h+='<div class=\"btn-row\"><button class=\"btn secondary\" onclick=\"editDwc(-1)\">+ Add item<\u002Fbutton><\u002Fdiv><\u002Fdiv>';\n\n  h+='<div class=\"card\"><h2>Culminating / capstone projects (SAR 2.7)<\u002Fh2>'+\n    '<p class=\"hint\">Titles, supervisors and group sizes are required alongside PO attainment \\u2014 and capstones are usually where the WP and EA attributes are genuinely evidenced.<\u002Fp>';\n  if(!state.capstones.length) h+='<div class=\"empty\">No projects recorded.<\u002Fdiv>';\n  else{\n    h+='<div class=\"tbl-wrap\"><table class=\"tbl\"><thead><tr><th>Title<\u002Fth><th style=\"width:150px\">Supervisor<\u002Fth><th style=\"width:60px\">Group<\u002Fth><th style=\"width:110px\">Cycle<\u002Fth><th>POs / WP / EA<\u002Fth><th style=\"width:60px\"><\u002Fth><\u002Ftr><\u002Fthead><tbody>';\n    state.capstones.forEach(function(c,i){\n      h+='<tr><td style=\"font-size:12.5px\">'+esc(c.title||'')+'<\u002Ftd><td>'+esc(c.supervisor||'')+'<\u002Ftd><td>'+esc(c.groupSize||'\\u2014')+'<\u002Ftd><td>'+esc(c.cycle||'\\u2014')+'<\u002Ftd>'+\n        '<td>'+[c.pos,c.wp,c.ea].filter(Boolean).map(function(x){return '<span class=\"chip\">'+esc(x)+'<\u002Fspan>';}).join('')+'<\u002Ftd>'+\n        '<td><button class=\"btn small secondary\" onclick=\"editCapstone('+i+')\">Edit<\u002Fbutton><\u002Ftd><\u002Ftr>';\n    });\n    h+='<\u002Ftbody><\u002Ftable><\u002Fdiv>';\n  }\n  h+='<div class=\"btn-row\"><button class=\"btn secondary\" onclick=\"editCapstone(-1)\">+ Add project<\u002Fbutton><\u002Fdiv><\u002Fdiv>';\n\n  h+='<d d.className='note'; d.style.margin='0';\n      d.innerHTML='<b>Criterion '+esc(it[1])+':<\u002Fb> '+esc(it[2]);\n      body.insertBefore(d, body.firstChild);\n    },\n    onSave:function(v){ state.audit[code]=v; save(); closeModal(); refresh(); }\n  });\n}\nfunction editDwc(i){\n  var row= i>-1? state.dwc[i]:null;\n  modal(row?'Edit item':'Add deficiency / weakness / concern',[\n    {key:'type',label:'Type',type:'select',options:['Deficiency','Weakness','Concern'],value:row?row.type:'Weakness'},\n    {key:'criterion',label:'Criterion',type:'select',options:['1','2','3','4','5','6','7','8','9'],value:row?row.criterion:'2'},\n    {key:'statement',label:'Statement, as raised by the evaluation team',type:'textarea',value:row?row.statement:''},\n    {key:'remedial',label:'Remedial action taken',type:'textarea',value:row?row.remedial:''},\n    {key:'annexure',label:'Reference to evidence in Annexure',type:'select',options:ANNEX_CODES,value:row?(row.annexure||'B'):'B'},\n    {key:'status',label:'Status',type:'select',options:['Open','In progress','Closed'],value:row?row.status:'Open'}\n  ],{\n    onSave:function(v){\n      if(!v.statement){ toast('Enter the statement','err'); return; }\n      if(row) Object.assign(row,v); else state.dwc.push(Object.assign({id:uid('dwc')},v));\n      save(); closeModal(); refresh();\n    },\n    onDelete: row? function(){ if(!confirm('Delete this item?')) return; state.dwc.splice(i,1); save(); closeModal(); refresh(); }:null\n  });\n}\nfunction editCapstone(i){\n  var row= i>-1? state.capstones[i]:null, cy=curCycle();\n  modal(row?'Edit project':'Add culminating project',[\n    {key:'title',label:'Project title',type:'textarea',value:row?row.title:''},\n    {key:'supervisor',label:'Supervisor(s)',value:row?row.supervisor:''},\n    {key:'groupSize',label:'Group size',type:'number',value:row?row.groupSize:''},\n    {key:'cycle',label:'Cycle',value:row?row.cycle:(cy?cy.semester:''),placeholder:'e.g. Spring 2026'},\n    {key:'pos',label:'POs evidenced',value:row?row.pos:'',placeholder:'e.g. PO3, PO4, PO9'},\n    {key:'wp',label:'WP attributes',value:row?row.wp:'',placeholder:'e.g. WP1, WP2, WP7'},\n    {key:'ea',label:'EA attributes',value:row?row.ea:'',placeholder:'e.g. EA1, EA3'}\n  ],{\n    onSave:function(v){\n      if(!v.title){ toast('Enter the title','err'); return; }\n      if(row) Object.assign(row,v); else state.capstones.push(Object.assign({id:uid('cap')},v));\n      save(); closeModal(); refresh();\n    },\n    onDelete: row? function(){ if(!confirm('Delete this project?')) return; state.capstones.splice(i,1); save(); closeModal(); refresh(); }:null\n  });\n}\n\n\n/* ---------------- SAR pack (Criteria 1, 2, 5) ---------------- */\nfunction sarStyle(){\n  return 'body{font-family:\"Times New Roman\",Times,serif;font-size:12pt;color:#000;margin:0;line-height:1.45}'+\n    '.wrap{max-width:7in;margin:0 auto;padding:0.6in 0.4in 1in}'+\n    'h1{font-size:16pt;margin:0 0 3px;text-align:center}h2{font-size:13.5pt;margin:24px 0 6px;border-bottom:1.2pt solid #000;padding-bottom:3px}'+\n    'h3{font-size:12pt;margin:16px 0 4px}h4{font-size:11.5pt;margin:13px 0 3px;font-style:italic}'+\n    'p{margin:0 0 8px;text-align:justify}.sub{text-align:center;font-size:11pt;margin:0 0 4px}'+\n    'table{width:100%;border-collapse:collapse;margin:7px 0 12px;font-size:10.5pt}'+\n    'th,td{border:0.75pt solid #000;padding:4px 6px;text-align:left;vertical-align:top}'+\n    'th{background:#e8e8e8;font-weight:bold}.c{text-align:center}'+\n    '.todo{color:#a11;font-style:italic}.muted{color:#555;font-size:10pt}'+\n    '.bar{background:#f2f2f2;border:0.75pt solid #999;padding:6px 9px;margin:8px 0;font-size:10.5pt}'+\n    '.noprint{margin:12px 0 20px;text-align:center}@media print{.noprint{display:none}h2{page-break-after:avoid}table{page-break-inside:auto}tr{page-break-inside:avoid}}';\n}\nfunction tv(s,label){ s=String(s==null?'':s).trim(); return s? esc(s).replace(/\\n/g,'<br>') : '<span class=\"todo\">[to be written: '+esc(label||'')+']<\u002Fspan>'; }\nfunction buildSarHtml(){\n  var p=state.program, c=state.crit1, cy=curCycle();\n  var gradCohort=view.gradCohort||(cohortsList().slice(-1)[0]||'');\n  var gcs=gradCohort? gradCyclesOf(gradCohort):[];\n  var H='';\n  H+='<h1>Self-assessment Report \\u2014 extract<\u002Fh1>'+\n     '<div class=\"sub\"><b>'+esc(p.name||p.code||'Program')+'<\u002Fb>'+(p.code?' ('+esc(p.code)+')':'')+'<\u002Fdiv>'+\n     '<div class=\"sub\">'+esc(p.dept||'')+(p.faculty?' \\u00b7 '+esc(p.faculty):'')+'<\u002Fdiv>'+\n     '<div class=\"sub muted\">Criteria 1, 2 and 5 \\u00b7 '+esc(p.frameworkVersion||'BAETE V3.0')+' \\u00b7 generated '+new Date().toLocaleDateString()+' by the OBE Program Manager<\u002Fdiv>'+\n     '<div class=\"bar\">This extract is generated from the program\\u2019s recorded data. Red italic markers show what the coordinator still has to write. Criteria 3, 4 and 6\\u20139 are institutional and are prepared separately. The completed SAR is submitted through BAETE\\u2019s Online Accreditation Management System and must not exceed 150 pages excluding annexures.<\u002Fdiv>';\n\n  /* ---- Criterion 1 ---- */\n  H+='<h2>Criterion 1: Program Educational Objectives<\u002Fh2>';\n  H+='<h3>1.1 Mission and Vision Statement<\u002Fh3>'+ensureSeed('1.1').html;\n  H+='<h3>1.2 Program Educational Objectives<\u002Fh3>'+ensureSeed('1.2').html;\n  H+='<h3>1.3 Consistency of the PEOs with the Mission<\u002Fh3>'+ensureSeed('1.3').html;\n  H+='<h3>1.4 Process for measurement of attainment of the PEOs<\u002Fh3>'+ensureSeed('1.4').html;\n  H+='<p class=\"muted\">Supporting documentation for Criterion 1 is provided in Annexure C.<\u002Fp>';\n  /* ---- Criterion 2 ---- */\n  H+='<h2>Criterion 2: Program Outcomes and Assessment<\u002Fh2>';\n  H+='<h3>2.1 Program Outcomes<\u002Fh3>'+ensureSeed('2.1').html;\n  H+='<h3>2.2 Equivalence of the Program Outcomes<\u002Fh3>';\n  var eq=(sarRec('2.2').html||'').replace(/<[^>]*>/g,'').trim();\n  H+= eq? sarRec('2.2').html\n    : '<p>The program adopts the twelve Program Outcomes of BAETE ACC-MAN-02 '+esc((p.frameworkVersion||'V3.0').replace('BAETE ',''))+' verbatim; the outcomes are therefore identical to, rather than merely equivalent to, the BAETE graduate attributes. The Knowledge-Profile attributes carried by each outcome are listed in section 2.7 below.<\u002Fp>';\n  ['2.3','2.4','2.5','2.6'].forEach(function(k){\n    var itx=SAR_STRUCT[1].items.filter(function(x){return x.id===k;})[0];\n    var rx=sarRec(k), tx=(rx.html||'').replace(/<[^>]*>/g,'').trim();\n    if(tx){ H+='<h3>'+esc(k)+' '+esc(itx.t)+'<\u002Fh3>'+rx.html; }\n  });\n  H+='<h3>Note on clauses 2.3\\u20132.6<\u002Fh3>'+\n    '<p class=\"muted\">Course outcomes with their teaching-learning and assessment methods (2.3), the assessment of CO attainment including rubrics, criteria and scale (2.4), the documentation of lecture plans, course content, grading policy, assessment tools and samples of student work (2.5), and the continuous monitoring of students\\u2019 academic performance (2.6) are maintained at department level by the course teachers and the Program Self-Assessment Committee, and are reproduced in Annexure D. This extract reports outcomes at program level only; the corresponding self-audit items are C2-ii, C2-iii and C2-iv.<\u002Fp>';\n  H+='<h3>2.7 Attainment of Program Outcomes<\u002Fh3>'+ensureSeed('2.7').html;\n  if(state.capstones.length){\n    H+='<h4>Culminating / capstone projects<\u002Fh4><table><thead><tr><th>Title<\u002Fth><th style=\"width:22%\">Supervisor<\u002Fth><th class=\"c\" style=\"width:60px\">Group<\u002Fth><th class=\"c\" style=\"width:80px\">Cycle<\u002Fth><th style=\"width:20%\">POs / WP / EA<\u002Fth><\u002Ftr><\u002Fthead><tbody>'+\n      state.capstones.map(function(x){ return '<tr><td>'+esc(x.title||'')+'<\u002Ftd><td>'+esc(x.supervisor||'')+'<\u002Ftd><td class=\"c\">'+esc(x.groupSize||'')+'<\u002Ftd><td class=\"c\">'+esc(x.cycle||'')+'<\u002Ftd><td>'+esc([x.pos,x.wp,x.ea].filter(Boolean).join(' \\u00b7 '))+'<\u002Ftd><\u002Ftr>'; }).join('')+'<\u002Ftbody><\u002Ftable>';\n  } else H+='<h4>Culminating / capstone projects<\u002Fh4><p class=\"todo\">[project titles, supervisors and group sizes are required by clause 2.7 \\u2014 record them on the SAR &amp; Evidence tab]<\u002Fp>';\n\n  plosSorted().forEach(function(pl,ix){\n    var n=num(pl.code);\n    H+='<h4>2.7.'+(ix+1)+' Attainment of '+esc(poLabel(pl.code))+' \\u2014 '+esc(pl.label||'')+'<\u002Fh4>';\n    if(pl.notAssessed){\n      H+='<p><b>Status.<\u002Fb> This outcome is not yet assessed by the program. '+esc(poLabel(pl.code))+' is new in BAETE ACC-MAN-02 V3.0 and no assessment instrument existed under the superseded outcome set. A standing improvement action is recorded in Criterion 5 and reported here in the interest of a complete and unambiguous self-assessment.<\u002Fp>';\n    }\n    H+='<p><b>Assessment methods and tools.<\u002Fb> '+tv(pl.method,'assessment methods and tools for '+poLabel(pl.code))+'<\u002Fp>';\n    H+='<p><b>Attainment criteria and scale.<\u002Fb> '+tv(pl.criteria,'criteria and scale for '+poLabel(pl.code))+'<\u002Fp>';\n    H+='<p><b>Expected level of attainment.<\u002Fb> '+tv(pl.expected,'expected level of attainment for '+poLabel(pl.code))+'<\u002Fp>';\n    H+='<p><b>Knowledge Profile.<\u002Fb> '+((pl.wk||[]).length? esc((pl.wk||[]).join(', '))+' are incorporated in this outcome, as reflected in the outcome statement and in the contributing courses.' : '<span class=\"muted\">No Knowledge-Profile attribute is attached to this outcome in the BAETE statement.<\u002Fspan>')+'<\u002Fp>';\n    if(wpRequired(n)){\n      H+='<p><b>Range of Complex Engineering Problems.<\u002Fb> '+((pl.wp||[]).length? esc((pl.wp||[]).join(', '))+' are addressed through this outcome; the supporting evidence is listed in Annexure '+esc(pl.annexure||'D')+'.' : '<span class=\"todo\">[required for '+esc(poLabel(pl.code))+' \\u2014 tick the WP attributes in the PO Dossier]<\u002Fspan>')+'<\u002Fp>';\n    }\n    if(eaRequired(n)){\n      H+='<p><b>Range of Complex Engineering Activities.<\u002Fb> '+((pl.ea||[]).length? esc((pl.ea||[]).join(', '))+' are addressed through this outcome.' : '<span class=\"todo\">[required for PO9 \\u2014 tick the EA attributes in the PO Dossier]<\u002Fspan>')+'<\u002Fp>';\n    }\n    if((pl.sdg||[]).length) H+='<p><b>UN Sustainable Development Goals.<\u002Fb> '+esc((pl.sdg||[]).join('; '))+'.<\u002Fp>';\n    else if(sdgRequired(n)) H+='<p><b>UN Sustainable Development Goals.<\u002Fb> <span class=\"todo\">[required for PO2, per clause 2.7.2 \\u2014 tick the SDGs in the PO Dossier]<\u002Fspan><\u002Fp>';\n    var res=[];\n    cycles().slice(0,3).forEach(function(q){ var cb=combinedOf(q,pl); if(cb!=null) res.push(q.semester+(q.cohort?' ('+q.cohort+')':'')+': '+cb+'% against a target of '+targetFor(q,pl)+'%'); });\n    H+='<p><b>Results.<\u002Fb> '+(res.length? esc(res.join('; '))+'.' : (pl.notAssessed?'<span class=\"muted\">Not applicable \\u2014 see status above.<\u002Fspan>':'<span class=\"todo\">[no attainment data recorded]<\u002Fspan>'))+'<\u002Fp>';\n    if(pl.prose) H+='<p>'+esc(pl.prose).replace(/\\n/g,'<\u002Fp><p>')+'<\u002Fp>';\n  });\n  H+='<p class=\"muted\">Supporting documentation for Criterion 2 is provided in Annexure D.<\u002Fp>';\n\n  /* ---- Criterion 5 ---- */\n  H+='<h2>Criterion 5: Continuous Quality Improvement<\u002Fh2>';\n  H+='<h3>5.1 Quality Assurance System<\u002Fh3><p>'+tv(state.crit5.qaSystem,'the quality assurance system \\u2014 organogram, positions, terms of reference, budget, activities (SAR 5.1)')+'<\u002Fp>';\n  H+='<h3>5.2 Feedback on Student\\u2019s Academic Performance<\u002Fh3><p>'+tv(state.crit5.studentFeedback,'continuous feedback to students and measures for academically weaker students (SAR 5.2)')+'<\u002Fp>';\n  H+='<h3>5.3 Stakeholders\\u2019 feedback<\u002Fh3>';\n  ['5.3.1 Feedback from Students','5.3.2 Feedback from Faculty Members','5.3.3 Feedback from Alumni','5.3.4 Feedback from Employers'].forEach(function(title,ci){\n    var cid='5.3.'+(ci+1);\n    H+='<h4>'+esc(title)+'<\u002Fh4>'+ensureSeed(cid).html;\n  });\n  H+='<h3>5.4 CQI loops<\u002Fh3>';\n  [['5.4.1','5.4.1 CQI Loop for PEO'],['5.4.2','5.4.2 CQI Loop for PO'],['5.4.3','5.4.3 CQI Loop for Courses and Curriculum']].forEach(function(pair){\n    H+='<h4>'+esc(pair[1])+'<\u002Fh4>'+ensureSeed(pair[0]).html;\n  });\n  if(state.dwc.length){\n    H+='<h3>Deficiencies, weaknesses and concerns from the most recent evaluation<\u002Fh3>'+\n      '<table><thead><tr><th style=\"width:96px\">Type<\u002Fth><th class=\"c\" style=\"width:70px\">Criterion<\u002Fth><th>Statement<\u002Fth><th>Remedial action taken<\u002Fth><th class=\"c\" style=\"width:80px\">Annexure<\u002Fth><\u002Ftr><\u002Fthead><tbody>'+\n      state.dwc.map(function(d){ return '<tr><td>'+esc(d.type||'')+'<\u002Ftd><td class=\"c\">'+esc(d.criterion||'')+'<\u002Ftd><td>'+esc(d.statement||'')+'<\u002Ftd><td>'+(d.remedial? esc(d.remedial):'<span class=\"todo\">[remedial action]<\u002Fspan>')+'<\u002Ftd><td class=\"c\">'+esc(d.annexure||'B')+'<\u002Ftd><\u002Ftr>'; }).join('')+\n      '<\u002Ftbody><\u002Ftable>';\n  }\n  H+='<p class=\"muted\">Supporting documentation for Criterion 5 is provided in Annexure H.<\u002Fp>';\n\n  /* ---- self-audit + annexures ---- */\n  H+='<h2>Self-audit against the SAR\\u2019s three questions<\u002Fh2>'+\n    '<p class=\"muted\">Internal working table \\u2014 not part of the submitted SAR. The template asks of every criterion: is a policy or process in place, is it in practice, and does an improvement mechanism exist.<\u002Fp>'+\n    '<table><thead><tr><th class=\"c\" style=\"width:64px\">Ref<\u002Fth><th>Sub-criterion<\u002Fth><th class=\"c\" style=\"width:60px\">Policy<\u002Fth><th class=\"c\" style=\"width:74px\">Practice<\u002Fth><th class=\"c\" style=\"width:86px\">Improvement<\u002Fth><th style=\"width:22%\">Declared deviation<\u002Fth><\u002Ftr><\u002Fthead><tbody>'+\n    AUDIT_ITEMS.map(function(it){ var a=auditState(it[0]);\n      return '<tr><td class=\"c\"><b>'+esc(it[0])+'<\u002Fb><\u002Ftd><td>'+esc(it[2])+'<\u002Ftd><td class=\"c\">'+esc(a.policy||'\\u2014')+'<\u002Ftd><td class=\"c\">'+esc(a.practice||'\\u2014')+'<\u002Ftd><td class=\"c\">'+esc(a.improve||'\\u2014')+'<\u002Ftd><td>'+esc(a.deviation||'')+'<\u002Ftd><\u002Ftr>';\n    }).join('')+'<\u002Ftbody><\u002Ftable>';\n  [3,4,6,7,8,9].forEach(function(n){\n    var c=SAR_STRUCT.filter(function(x){return x.n===n;})[0]; if(!c) return;\n    H+='<h2>Criterion '+n+': '+esc(c.title)+'<\u002Fh2>';\n    c.items.forEach(function(it){\n      var r=sarRec(it.id);\n      H+='<h3>'+esc(it.id)+' '+esc(it.t)+'<\u002Fh3>';\n      var txt=(r.html||'').replace(/<[^>]*>/g,'').trim();\n      if(txt) H+=r.html;\n      else H+='<p class=\"todo\">[to be written: '+esc(it.p)+' \\u2014 source: '+esc((it.o||[]).join('; '))+']<\u002Fp>';\n      if(r.annexure) H+='<p class=\"muted\">Evidence: Annexure '+esc(r.annexure)+'.<\u002Fp>';\n    });\n  });\n  H+=annexTableHtml();\n  return H;\n}\nfunction annexTableHtml(){\n  var rows=ANNEX.map(function(a){\n    var refs=[];\n    if(state.peos.some(function(x){return (x.annexure||'C')===a[0];})) refs.push('PEO measurement records');\n    if(state.plos.some(function(x){return (x.annexure||'D')===a[0];})) refs.push('PO assessment evidence');\n    if(state.cqi.some(function(x){return (x.annexure||'H')===a[0];})) refs.push('CQI actions and minutes');\n    if(state.feedback.some(function(x){return (x.annexure||'H')===a[0];})) refs.push('Stakeholder feedback instruments and analyses');\n    if(state.dwc.some(function(x){return (x.annexure||'B')===a[0];})) refs.push('Remedial actions from the last evaluation');\n    return '<tr><td class=\"c\"><b>'+esc(a[0])+'<\u002Fb><\u002Ftd><td>'+esc(a[1])+'<\u002Ftd><td>'+(refs.length? esc(refs.join('; ')):'<span class=\"muted\">\\u2014<\u002Fspan>')+'<\u002Ftd><\u002Ftr>';\n  }).join('');\n  return '<h2>Table of Annexures<\u002Fh2><table><thead><tr><th class=\"c\" style=\"width:80px\">Annexure<\u002Fth><th style=\"width:40%\">Contents<\u002Fth><th>Records cross-referenced from this extract<\u002Fth><\u002Ftr><\u002Fthead><tbody>'+rows+'<\u002Ftbody><\u002Ftable>';\n}\nfunction exportSarPack(){\n  if(!state.plos.length){ toast('Load the PO set first','err'); return; }\n  var w=window.open('','_blank');\n  if(!w){ toast('Allow popups to open the SAR pack','err'); return; }\n  w.document.write('<!DOCTYPE html><html><head><meta charset=\"utf-8\"><title>SAR extract \\u2014 '+esc(state.program.code||'program')+'<\u002Ftitle><style>'+sarStyle()+'<\u002Fstyle><\u002Fhead><body><div class=\"wrap\">'+\n    '<div class=\"noprint\"><button onclick=\"window.print()\" style=\"padding:8px 18px;font-size:13px;cursor:pointer\">Print / save as PDF<\u002Fbutton><\u002Fdiv>'+\n    buildSarHtml()+'<\u002Fdiv><\u002Fbody><\u002Fhtml>');\n  w.document.close();\n}\nfunction downloadSarWord(){\n  if(!state.plos.length){ toast('Load the PO set first','err'); return; }\n  var doc='<!DOCTYPE html><html xmlns:o=\"urn:schemas-microsoft-com:office:office\" xmlns:w=\"urn:schemas-microsoft-com:office:word\"><head><meta charset=\"utf-8\">'+\n    '<title>SAR extract<\u002Ftitle><!--[if gte mso 9]><xml><w:WordDocument><w:View>Print<\u002Fw:View><\u002Fw:WordDocument><\u002Fxml><![endif]-->'+\n    '<style>@page{size:A4;margin:2cm}'+sarStyle()+'<\u002Fstyle><\u002Fhead><body>'+buildSarHtml()+'<\u002Fbody><\u002Fhtml>';\n  downloadText((state.program.code||'program')+'_SAR-extract_Criteria-1-2-5.doc', doc, 'application/msword');\n  toast('Word file downloaded \\u2014 open it, then Save As .docx');\n}\nfunction exportAnnexTable(){\n  var w=window.open('','_blank');\n  if(!w){ toast('Allow popups','err'); return; }\n  w.document.write('<!DOCTYPE html><html><head><meta charset=\"utf-8\"><title>Table of Annexures<\u002Ftitle><style>'+sarStyle()+'<\u002Fstyle><\u002Fhead><body><div class=\"wrap\">'+\n    '<div class=\"noprint\"><button onclick=\"window.print()\" style=\"padding:8px 18px;font-size:13px;cursor:pointer\">Print / save as PDF<\u002Fbutton><\u002Fdiv>'+\n    '<h1>Table of Annexures<\u002Fh1><div class=\"sub\">'+esc(state.program.name||state.program.code||'')+'<\u002Fdiv>'+annexTableHtml()+'<\u002Fdiv><\u002Fbody><\u002Fhtml>');\n  w.document.close();\n}\n\n\n/* ---------------- grand-sample content for the new SAR sections ---------------- */\nfunction seedSarSample(){\n  var p=state.program;\n  state.crit1={\n    instVision:'To be a centre of excellence in engineering and technology education that serves the nation through knowledge, innovation and ethical professional practice.',\n    instMission:'To produce competent, creative and socially responsible graduates; to advance knowledge through research and scholarship; and to serve industry and community through partnership and continuing education.',\n    deptVision:'To be recognised nationally and regionally for mechanical engineering education that couples strong fundamentals with sustainable, industry-relevant practice.',\n    deptMission:'To equip students with the disciplinary depth, design capability, digital tools and professional judgement required for mechanical engineering practice; to pursue applied research addressing national energy, manufacturing and sustainability needs; and to maintain an active partnership with industry.',\n    alignment:'The departmental mission is a discipline-specific reading of the institutional mission: the institution\\u2019s three commitments \\u2014 competent and responsible graduates, advancement of knowledge, and service to industry and community \\u2014 map one-to-one onto the department\\u2019s three commitments of disciplinary depth and professional judgement, applied research on national priorities, and active industry partnership. The alignment is reviewed by the Academic Committee whenever either statement is revised.',\n    peoProcess:'The PEOs were framed by the Program Self-Assessment Committee from the departmental mission, then developed through three consultations: a workshop with the Industrial Advisory Panel (eleven members drawn from power generation, manufacturing, RMG machinery and consultancy), an alumni round-table with graduates five to ten years out, and a faculty retreat at which each draft objective was tested against the curriculum and available resources. Employer feedback collected through the annual employer survey was tabled at the same meetings. The revised PEOs were approved by the Academic Committee and ratified by the Academic Council. The cycle repeats every three years, or sooner if the Industrial Advisory Panel recommends it.',\n    dissemination:'The PEOs are published in the departmental section of the university website, printed in the programme prospectus and the student handbook, displayed in the departmental notice area and the two design studios, restated in the first lecture of every first-year and final-year course, and circulated to the Industrial Advisory Panel and the alumni association at each consultation. New faculty members receive them in the departmental induction pack.',\n    resourceRealism:'Each objective was tested against the resources actually available: the existing faculty complement and its specialisations, the laboratory and computing facilities, the library and database subscriptions, the departmental budget line for industry visits and guest practitioners, and the alumni network through which graduate tracking is carried out. No objective depends on a facility or appointment that is not either in place or in the approved development plan; the objective concerning continuing professional development was reworded to reflect what the alumni association can realistically sustain.',\n    trackingProcess:'Graduates are tracked through the departmental alumni register maintained with the alumni association, refreshed at convocation and through an annual mailing. Cohorts three to five years past graduation are surveyed with the alumni questionnaire; their employers are approached separately with a short employer instrument, with consent. Response rates, not merely counts, are recorded so that the representativeness of each round can be judged. The register and the survey analyses are held by the Program OBE Coordinator and reported to the Academic Committee each year.'\n  };\n  var mm=[\n    'Serves the institutional and departmental commitment to competent graduates in professional practice: the objective is the direct career expression of the disciplinary depth both missions place first.',\n    'Serves the commitment to creativity and to partnership with industry: multidisciplinary teamwork and modern tools are what the departmental mission means by industry-relevant practice.',\n    'Serves the commitment to socially responsible graduates and to national sustainability needs named in both missions.',\n    'Serves the commitment to advancing knowledge and to continuing education, which both missions carry explicitly.'\n  ];\n  state.peos.forEach(function(pe,i){\n    pe.method='Alumni survey of the cohort three to five years after graduation, triangulated with an employer survey of their supervisors.';\n    pe.tool='AUST alumni questionnaire (five-point Likert, mapped item-by-item to the PEOs) and the employer feedback form.';\n    pe.criteria='Attained when at least '+ (Number(state.cfg.peoTarget)||70) +'% of respondents agree or strongly agree, with an alumni response rate of at least 30% for the round to be considered representative.';\n    pe.tracking='Alumni register maintained with the alumni association; convocation and annual mailing refresh; employers approached with the graduate\\u2019s consent.';\n    pe.missionLink=mm[i]||'';\n    pe.annexure='C';\n  });\n  state.stakeholders=[\n    {id:uid('sh'),group:'Industry / IAP',name:'Industrial Advisory Panel, Dept. of MPE (11 members: power generation, manufacturing, RMG machinery, consultancy)',role:'Reviews and endorses the PEOs; advises on curriculum currency, emerging technologies and graduate capability gaps; hosts internships and industry-linked projects.',last:'March 2026'},\n    {id:uid('sh'),group:'Alumni',name:'MPE Alumni Association',role:'Alumni round-table on the PEOs; annual alumni survey respondents; contributes to graduate tracking and professional-development sessions.',last:'February 2026'},\n    {id:uid('sh'),group:'Employers',name:'Employers of graduates (annual employer survey panel)',role:'Rates graduate performance against the PEOs; identifies capability gaps observed in the workplace.',last:'January 2026'},\n    {id:uid('sh'),group:'Faculty members',name:'Faculty of the Dept. of MPE',role:'Frames and revises COs, PO mapping and assessment design; tests each PEO against curriculum and resources at the annual retreat.',last:'April 2026'},\n    {id:uid('sh'),group:'Students',name:'Enrolled students and final-year cohort',role:'Course feedback each semester; exit survey at graduation; student representation at the Academic Committee.',last:'May 2026'},\n    {id:uid('sh'),group:'Professional body',name:'The Institution of Engineers, Bangladesh (IEB) \\u2014 local chapter',role:'Professional-practice seminars and student chapter activity; guidance on registration pathways.',last:'November 2025'}\n  ];\n  /* PO dossier content */\n  var DOS={\n    1:['Direct: end-semester examination questions and class tests mapped to the outcome in the four fundamentals courses and two specialisation courses that carry it; questions are moderated before use so that they test application rather than recall. Indirect: exit-survey items on preparedness in fundamentals.','A student attains the outcome when the weighted marks on the mapped items reach the course KPI threshold of 50%. Attainment is reported as the percentage of students reaching that threshold, credit-weighted across contributing courses.','At least 50% of the cohort reaching the 50% threshold on the mapped items, with no single contributing course below 40%.'],\n    2:['Direct: analytical problem sets and open-ended analysis questions in the thermal and mechanics sequence, assessed with a four-level analysis rubric; the capstone project\\u2019s problem-formulation stage. Indirect: exit-survey items on problem-solving confidence.','Four-level rubric (1 inadequate to 4 proficient); attainment at level 3 or above. Reported as the percentage of students at level 3 or above, credit-weighted.','At least 50% of the cohort at rubric level 3 or above, and the sustainable-development consideration explicitly evidenced in at least one assessed task per year.'],\n    3:['Direct: design tasks in the design sequence and the capstone project, assessed with a design rubric that scores functional adequacy, safety and health considerations, whole-life cost, and net zero carbon and resource considerations as separate criteria. Indirect: employer-survey items on design capability.','Design rubric across four criteria, each scored 1 to 4; attainment requires level 3 or above on the functional criterion and at least level 2 on every other criterion, so that a strong design cannot mask a neglected sustainability dimension.','At least 50% of the cohort meeting the compound criterion, with the whole-life-cost and net-zero-carbon criteria assessed in the capstone from Spring 2026 onwards.'],\n    4:['Direct: laboratory investigations with design-of-experiments components in the two senior laboratory courses, and the capstone investigation stage; assessed with an investigation rubric covering experiment design, data analysis, interpretation and synthesis. Indirect: exit-survey items on research skills.','Investigation rubric, four criteria scored 1 to 4; attainment at an average of level 3 or above with no criterion below 2.','At least 50% of the cohort at average level 3 or above; experiment design assessed independently rather than inferred from report quality.'],\n    5:['Direct: simulation and modelling assignments in the CAD, thermal-simulation and instrumentation courses, assessed on tool selection, correct use, and \\u2014 weighted equally \\u2014 interpretation of output and statement of the model\\u2019s limitations. Indirect: employer-survey items on software readiness.','Tool-use rubric with an explicit limitations criterion; attainment requires level 3 or above overall and at least level 2 on the limitations criterion.','At least 50% of the cohort meeting the compound criterion. The limitations criterion was introduced in Fall 2025 following the V3.0 wording.'],\n    6:['Direct: sustainability-impact assessment tasks in the energy and design courses and a structured impact section in the capstone report, assessed against a rubric covering societal, economic, sustainability, health and safety, legal and environmental dimensions. Indirect: employer- and alumni-survey items on professional judgement.','Impact rubric with six named dimensions; attainment requires level 3 or above on at least four dimensions including sustainability and health and safety.','At least 50% of the cohort meeting the criterion. This outcome merges the coverage previously reported under PO6 and PO7, so the series begins in Fall 2025.'],\n    7:['Direct: an assessed ethics case study in the professional-practice course, marked against a rubric covering ethical reasoning, awareness of national and international law, and diversity and inclusion; plagiarism and academic-integrity records are used as corroborating evidence. Indirect: employer-survey items on professional conduct.','Ethics rubric, three criteria scored 1 to 4; attainment at level 3 or above on ethical reasoning and at least level 2 on the other two.','At least 50% of the cohort meeting the criterion; the diversity and inclusion criterion was added in Fall 2025 to match the V3.0 wording.'],\n    8:['Direct: peer- and supervisor-assessed team performance in the design project and capstone, using a teamwork rubric that scores individual contribution, collaboration in diverse teams and effectiveness in remote or distributed working. Indirect: employer-survey items on teamwork.','Teamwork rubric with individual and team components; attainment requires level 3 or above on the individual-contribution criterion, so that a strong team cannot carry a passive member.','At least 50% of the cohort at level 3 or above on individual contribution, with the remote-working criterion assessed in at least one project stage.'],\n    9:['Direct: written technical reports and design documentation, and oral defence of the capstone before a panel, assessed with a communication rubric covering written clarity, documentation quality, oral delivery and responsiveness to a mixed audience. Indirect: employer-survey items on communication.','Communication rubric, four criteria scored 1 to 4; attainment at average level 3 or above.','At least 50% of the cohort at average level 3 or above, with the capstone defence marked by at least two assessors.'],\n    10:['Direct: project planning, scheduling and budgeting deliverables in the industrial-management course and the capstone management plan, assessed on economic reasoning and project control. Indirect: employer-survey items on management readiness.','Management rubric covering costing, scheduling and economic decision-making; attainment at level 3 or above on costing and scheduling.','At least 50% of the cohort at level 3 or above. An individual budgeting assignment is being introduced so that individual attainment can be demonstrated.'],\n    11:['Direct: a self-directed learning task in the capstone requiring the student to acquire and apply a technology not taught in the curriculum, assessed on independence of learning, adaptability to the new technology and critical evaluation of sources. Indirect: exit- and alumni-survey items on preparedness for continuing learning.','Self-directed learning rubric with three criteria; attainment at level 3 or above on independence and at least level 2 on adaptability and critical evaluation.','At least 50% of the cohort meeting the criterion; adaptability and critical thinking assessed explicitly following the V3.0 wording.'],\n    12:['','','']\n  };\n  state.plos.forEach(function(pl){\n    var n=num(pl.code), d=DOS[n]||['','',''];\n    pl.method=d[0]; pl.criteria=d[1]; pl.expected=d[2]; pl.annexure='D';\n    if(n>=1&&n<=6) pl.wp = ({1:['WP1'],2:['WP1','WP2','WP3'],3:['WP1','WP2','WP3','WP5','WP7'],4:['WP1','WP3','WP4'],5:['WP1','WP3'],6:['WP2','WP4','WP6','WP7']})[n]||[];\n    if(n===9) pl.ea=['EA1','EA2','EA3','EA5'];\n    if(n===2) pl.sdg=['SDG9 Industry, innovation and infrastructure','SDG12 Responsible consumption and production'];\n    if(n===3) pl.sdg=['SDG7 Affordable and clean energy','SDG9 Industry, innovation and infrastructure','SDG13 Climate action'];\n    if(n===6) pl.sdg=['SDG7 Affordable and clean energy','SDG11 Sustainable cities and communities','SDG12 Responsible consumption and production','SDG13 Climate action'];\n    if(n===7) pl.sdg=['SDG5 Gender equality','SDG10 Reduced inequalities','SDG16 Peace, justice and strong institutions'];\n    pl.notAssessed=(n===12);\n    if(n===12){\n      pl.method='Not yet assessed. No course in the current curriculum carries an assessed entrepreneurship component.';\n      pl.criteria=''; pl.expected='';\n    }\n  });\n  ensurePo12Action();\n  /* graduating cohort: mark the newest cycle */\n  var cs=cycles();\n  if(cs.length){ cs[0].gradCohort=true; if(cs[1]&&cs[1].cohort===cs[0].cohort) cs[1].gradCohort=true; view.gradCohort=cs[0].cohort||''; }\n  /* stakeholder feedback across all four channels */\n  var latest=cs[0]? cs[0].semester:'Spring 2026', prev=cs[1]? cs[1].semester:'Fall 2025';\n  state.feedback=[\n    {id:uid('fb'),channel:'Students',instrument:'Student exit survey (PO-mapped, five-point Likert)',cycle:latest,respondents:118,rate:61,findings:'Lowest-rated outcomes were PO10 (project management and finance) and PO11 (life-long learning); students asked for earlier exposure to costing and for structured guidance on self-directed learning.',usedIn:'CQI PO10 '+latest+'; CQI PO11 '+latest,annexure:'H'},\n    {id:uid('fb'),channel:'Students',instrument:'Semester course feedback (all sections)',cycle:prev,respondents:402,rate:74,findings:'Simulation courses rated highly on tool training but weakly on interpretation of results, which corroborated the PO5 finding.',usedIn:'CQI PO5 '+prev,annexure:'H'},\n    {id:uid('fb'),channel:'Faculty members',instrument:'Faculty course-review form and end-of-semester review meeting',cycle:latest,respondents:19,rate:95,findings:'Faculty reported that the investigation rubric was applied inconsistently between the two senior laboratories, and that design-of-experiments coverage arrives too late in the programme.',usedIn:'CQI PO4 '+latest+'; Academic Committee minute 12/2026 item 4',annexure:'H'},\n    {id:uid('fb'),channel:'Faculty members',instrument:'Annual curriculum retreat \\u2014 structured feedback on PO mapping',cycle:prev,respondents:21,rate:100,findings:'Faculty judged PO6 under-served by a single contributing course after the V3.0 merge, and recommended mapping it to the capstone.',usedIn:'CQI PO6 '+prev+' (closed); curriculum map revision',annexure:'H'},\n    {id:uid('fb'),channel:'Alumni',instrument:'Alumni survey, cohorts three to five years after graduation',cycle:'2026',respondents:57,rate:46,findings:'Alumni rated career progression and teamwork strongly but reported few structured continuing-professional-development opportunities, which is the PEO4 shortfall.',usedIn:'CQI PEO4 2026',annexure:'H'},\n    {id:uid('fb'),channel:'Employers',instrument:'Employer survey of graduates\\u2019 supervisors',cycle:'2026',respondents:21,rate:38,findings:'Employers were satisfied with fundamentals and teamwork; they asked for stronger costing, scheduling and data-driven decision-making, consistent with the PO10 finding.',usedIn:'CQI PO10 '+latest,annexure:'H'}\n  ];\n  /* capstones */\n  state.capstones=[\n    {id:uid('cap'),title:'Design and performance evaluation of a hybrid solar\\u2013biomass dryer for post-harvest processing',supervisor:'Dr. A. Rahman',groupSize:4,cycle:latest,pos:'PO3, PO4, PO6, PO9',wp:'WP1, WP2, WP7',ea:'EA1, EA3, EA4'},\n    {id:uid('cap'),title:'Retrofit of a textile-mill compressed-air network for energy recovery and net-zero-carbon contribution',supervisor:'Dr. S. Karim',groupSize:4,cycle:latest,pos:'PO3, PO5, PO6, PO10',wp:'WP1, WP2, WP5, WP7',ea:'EA1, EA2, EA4'},\n    {id:uid('cap'),title:'Condition monitoring of rotating machinery using low-cost vibration sensing and machine learning',supervisor:'Dr. M. Hasan',groupSize:3,cycle:latest,pos:'PO4, PO5, PO9',wp:'WP1, WP3, WP4',ea:'EA1, EA3, EA5'},\n    {id:uid('cap'),title:'Design of a manually operated agricultural implement for smallholder farms, with whole-life cost analysis',supervisor:'Dr. N. Akter',groupSize:4,cycle:prev,pos:'PO3, PO6, PO10',wp:'WP1, WP2, WP6',ea:'EA1, EA4'}\n  ];\n  /* deficiencies / weaknesses / concerns from the previous accreditation */\n  state.dwc=[\n    {id:uid('dwc'),type:'Weakness',criterion:'2',statement:'PO attainment was reported for a single semester rather than for a graduating cohort, so attainment by graduation was not demonstrated.',remedial:'Cycles are now marked as final-year cycles and a credit-weighted cohort-at-graduation roll-up is published for every PO; transfer students are reported separately.',annexure:'B',status:'Closed'},\n    {id:uid('dwc'),type:'Concern',criterion:'5',statement:'The improvement loop for courses and curriculum was described but not evidenced with committee decisions.',remedial:'Every CQI action now records the deciding body, the minute reference and the meeting date; the courses and curriculum loop is maintained as a distinct loop.',annexure:'B',status:'Closed'},\n    {id:uid('dwc'),type:'Concern',criterion:'1',statement:'Employer feedback on PEO attainment was thin, with a low response rate and no record of representativeness.',remedial:'The employer instrument was shortened and is now administered with graduate consent through the alumni register; response rates are recorded and reported. The rate has risen from 22% to 38% but remains a watch item.',annexure:'B',status:'In progress'}\n  ];\n  /* self-audit */\n  var A={};\n  function set(ref,po,pr,im,dev){ A[ref]={policy:po,practice:pr,improve:im,evidence:'',deviation:dev||''}; }\n  set('C1-i','Yes','Yes','Yes');\n  set('C1-ii','Yes','Yes','Yes');\n  set('C1-iii','Yes','Yes','Partly','Employer response rate (38%) is below the 50% the department set itself; representativeness is reported with every round rather than being claimed.');\n  set('C2-i','Yes','Yes','Yes');\n  set('C2-ii','Yes','Yes','Yes');\n  set('C2-iii','Yes','Yes','Yes');\n  set('C2-iv','Yes','Yes','Partly');\n  set('C2-v','Yes','Partly','Yes','PO12 (entrepreneurship), new in BAETE V3.0, is not yet assessed. Declared openly; a standing improvement action is recorded in the PO loop.');\n  set('C5-i','Yes','Yes','Yes');\n  set('C5-ii','Yes','Yes','Yes');\n  set('C5-iii','Yes','Yes','Partly');\n  set('C5-iv','Yes','Yes','Yes');\n  set('C5-v','Yes','Yes','Yes');\n  set('C5-vi','Yes','Yes','Yes');\n  state.audit=A;\n  /* enrich the CQI register with loop types and the decision trail */\n  state.crit5={\n    qaSystem:'Quality assurance operates under the AUST IQAC. At program level the Program Self-Assessment Committee (chaired by the Head of Department, with the Program OBE Coordinator as member-secretary and five faculty members) owns outcome assessment and course files; the Faculty Quality Assurance Committee reviews across departments; the IQAC sets procedure, runs the surveys, maintains the portal and reports to the Quality Assurance Committee. Terms of reference for each body are in the departmental QA file; the departmental QA budget line covers surveys, workshops and accreditation visits. The system\\u2019s outputs \\u2014 attainment reviews, CQI actions and their committee decisions \\u2014 are recorded in this workbench and evidenced in Annexure H.',\n    studentFeedback:'Students receive marked class tests and assignments back within two weeks with model solutions discussed in class; mid-semester results are reviewed with the course teacher and the adviser. Each student has a faculty adviser who monitors semester results; students whose CGPA falls below 2.5, or who fail a core course, are called to a structured advising meeting and offered remedial tutorials run by the department. Attendance and continuous-assessment records are reviewed at the mid-semester academic meeting so weaker students are identified before the final examination.'\n  };\n  var bodies=['Academic Committee, Dept. of MPE','Program Self-Assessment Committee (PSAC)','Board of Undergraduate Studies'];\n  state.cqi.forEach(function(a,i){\n    if(!a.loop) a.loop = a.src==='PEO'? 'PEO':'PO';\n    if(!a.committee) a.committee=bodies[i%bodies.length];\n    if(!a.meetingRef) a.meetingRef='Minute '+(10+i)+'/2026, item '+(2+(i%5));\n    if(!a.meetingDate) a.meetingDate=todayISO();\n    if(!a.annexure) a.annexure='H';\n  });\n  /* a courses & curriculum loop action, which SAR 5.4.3 requires */\n  state.cqi.push({id:uid('cq'),src:'Manual',loop:'Course & Curriculum',outcome:'General',cycle:latest,cohort:cs[0]?(cs[0].cohort||''):'',\n    finding:'The CO\\u2013PO map placed PO6 on a single course after the V3.0 merge of the former PO6 and PO7, leaving the programme figure hostage to one assessment. Faculty and student feedback both flagged that simulation courses assess tool operation more than interpretation.',\n    rootCause:'The curriculum map was inherited from the V2.1 outcome set and was not re-derived when the outcomes were merged and re-worded; rubric weights had not been revisited since.',\n    action:'Re-derive the CO\\u2013PO map against the V3.0 statements, map PO6 to the capstone as a second contributing course, and re-weight the simulation rubrics towards interpretation and limitations. Curriculum revision tabled for the next Board of Undergraduate Studies meeting.',\n    owner:'Program OBE Coordinator with the PSAC', targetDate:'2027-06-30', status:'In progress',\n    committee:'Board of Undergraduate Studies', meetingRef:'Minute 03/2026, item 7', meetingDate:todayISO(), annexure:'H',\n    evidence:'Revised CO\\u2013PO map (draft v2); rubric revision note circulated to course teachers.',\n    verifyNote:'', opened:todayISO(), closedDate:''});\n}\n\n/* ---------------- boot ---------------- */\nload(); refresh();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
