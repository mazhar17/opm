n===n;})[0]; if(!c) return {done:0,total:0,pct:0};\n  var done=0;\n  c.items.forEach(function(it){\n    if(it.covered) { if(coveredDone(it)) done++; }\n    else { var r=sarRec(it.id); if(r.status==='Ready'||(r.html&&r.html.replace(/<[^>]*>/g,'').trim().length>80)) done++; }\n  });\n  return {done:done,total:c.items.length,pct:Math.round(done/c.items.length*100)};\n}\nfunction coveredDone(it){\n  if(it.covered==='crit1'){\n    var c=state.crit1;\n    if(it.id==='1.1') return !!(c.instVision&&c.instMission&&c.deptMission&&c.alignment);\n    if(it.id==='1.2') return !!(c.peoProcess&&c.dissemination&&c.resourceRealism&&state.stakeholders.length&&state.peos.length);\n    if(it.id==='1.3') return state.peos.length>0 && state.peos.every(function(p){return !!p.missionLink;});\n    if(it.id==='1.4') return !!c.trackingProcess && state.peos.every(function(p){return !!(p.method&&p.tool&&p.criteria);}) && state.peoRecords.length>0;\n  }\n  if(it.covered==='outcomes') return state.plos.length>0;\n  if(it.covered==='dossier') return dossierPct()>=100 && state.capstones.length>0;\n  if(it.covered==='crit5') return it.id==='5.1'? !!state.crit5.qaSystem : !!state.crit5.studentFeedback;\n  if(it.covered==='feedback'){\n    var map={'5.3.1':'Students','5.3.2':'Faculty members','5.3.3':'Alumni','5.3.4':'Employers'};\n    return state.feedback.some(function(f){ return f.channel===map[it.id]; });\n  }\n  if(it.covered==='cqi'){\n    var lm={'5.4.1':'PEO','5.4.2':'PO','5.4.3':'Course & Curriculum'};\n    return state.cqi.some(function(a){ return (a.loop||'PO')===lm[it.id]; });\n  }\n  return false;\n}\nfunction escNl(s){ return s? esc(s).replace(/\\n/g,'<br>'):''; }\nfunction seedForClause(id){\n  var c=state.crit1;\n  if(id==='1.1'){\n    return '<table><tr><th><\u002Fth><th>Vision<\u002Fth><th>Mission<\u002Fth><\u002Ftr>'+\n      '<tr><td><b>Institution<\u002Fb><\u002Ftd><td>'+(escNl(c.instVision)||'[to be written]')+'<\u002Ftd><td>'+(escNl(c.instMission)||'[to be written]')+'<\u002Ftd><\u002Ftr>'+\n      '<tr><td><b>Department / school<\u002Fb><\u002Ftd><td>'+(escNl(c.deptVision)||'[to be written]')+'<\u002Ftd><td>'+(escNl(c.deptMission)||'[to be written]')+'<\u002Ftd><\u002Ftr><\u002Ftable>'+\n      '<p><b>Alignment.<\u002Fb> '+(escNl(c.alignment)||'[to be written]')+'<\u002Fp>';\n  }\n  if(id==='1.2'){\n    var h2='';\n    if(state.peos.length) h2+='<table><tr><th>PEO<\u002Fth><th>Statement<\u002Fth><\u002Ftr>'+state.peos.map(function(x){return '<tr><td><b>'+esc(x.code)+'<\u002Fb><\u002Ftd><td>'+esc(x.statement||'')+'<\u002Ftd><\u002Ftr>';}).join('')+'<\u002Ftable>';\n    h2+='<p><b>Establishment process and stakeholders consulted.<\u002Fb> '+(escNl(c.peoProcess)||'[to be written]')+'<\u002Fp>';\n    if(state.stakeholders.length) h2+='<table><tr><th>Group<\u002Fth><th>Name / body<\u002Fth><th>Role<\u002Fth><th>Last consulted<\u002Fth><\u002Ftr>'+state.stakeholders.map(function(s){return '<tr><td>'+esc(s.group||'')+'<\u002Ftd><td>'+esc(s.name||'')+'<\u002Ftd><td>'+esc(s.role||'')+'<\u002Ftd><td>'+esc(s.last||'')+'<\u002Ftd><\u002Ftr>';}).join('')+'<\u002Ftable>';\n    h2+='<p><b>Publication and dissemination.<\u002Fb> '+(escNl(c.dissemination)||'[to be written]')+'<\u002Fp>';\n    h2+='<p><b>Realistic within available resources.<\u002Fb> '+(escNl(c.resourceRealism)||'[to be written]')+'<\u002Fp>';\n    return h2;\n  }\n  if(id==='1.3'){\n    if(!state.peos.length) return '<p>[no PEOs defined]<\u002Fp>';\n    return '<table><tr><th>PEO<\u002Fth><th>Statement<\u002Fth><th>Consistency with the mission<\u002Fth><\u002Ftr>'+\n      state.peos.map(function(x){return '<tr><td><b>'+esc(x.code)+'<\u002Fb><\u002Ftd><td>'+esc(x.statement||'')+'<\u002Ftd><td>'+(esc(x.missionLink||'')||'[to be written]')+'<\u002Ftd><\u002Ftr>';}).join('')+'<\u002Ftable>';\n  }\n  if(id==='1.4'){\n    var h3='<p><b>Tracking of graduates and employers.<\u002Fb> '+(escNl(c.trackingProcess)||'[to be written]')+'<\u002Fp>';\n    if(state.peos.length) h3+='<table><tr><th>PEO<\u002Fth><th>Assessment method<\u002Fth><th>Instrument / tool<\u002Fth><th>Attainment criterion<\u002Fth><\u002Ftr>'+\n      state.peos.map(function(x){return '<tr><td><b>'+esc(x.code)+'<\u002Fb><\u002Ftd><td>'+esc(x.method||'[to be written]')+'<\u002Ftd><td>'+esc(x.tool||'[to be written]')+'<\u002Ftd><td>'+esc(x.criteria||'[to be written]')+'<\u002Ftd><\u002Ftr>';}).join('')+'<\u002Ftable>';\n    h3+='<p><b>Summary of PEO attainment results.<\u002Fb><\u002Fp>';\n    if(state.peoRecords.length){\n      var cohortsSeen=[]; state.peoRecords.forEach(function(r){ if(r.batch && cohortsSeen.indexOf(r.batch)===-1) cohortsSeen.push(r.batch); });\n      h3+='<table><tr><th>PEO<\u002Fth>'+cohortsSeen.map(function(b){return '<th>'+esc(b)+'<\u002Fth>';}).join('')+'<th>Target %<\u002Fth><\u002Ftr>'+\n        state.peos.map(function(x){\n          var t=Number(state.cfg.peoTarget)||70;\n          return '<tr><td><b>'+esc(x.code)+'<\u002Fb><\u002Ftd>'+cohortsSeen.map(function(b){\n            var rec=state.peoRecords.filter(function(r){return r.peo===x.code&&r.batch===b&&r.actual!==''&&r.actual!=null;}).sort(function(a,b2){return String(b2.assessYear).localeCompare(String(a.assessYear));})[0];\n            if(rec) t=(rec.target===''||rec.target==null)?t:Number(rec.target);\n            return '<td>'+(rec? esc(rec.actual)+(Number(rec.actual)<t?'*':''):'\\u2014')+'<\u002Ftd>';\n          }).join('')+'<td>'+t+'<\u002Ftd><\u002Ftr>';\n        }).join('')+'<\u002Ftable><p class=\"mut\">Figures marked * are below target.<\u002Fp>';\n    } else h3+='<p>[no PEO attainment records]<\u002Fp>';\n    return h3;\n  }\n  if(id==='2.1'){\n    if(!state.plos.length) return '<p>[no POs defined]<\u002Fp>';\n    return '<table><tr><th>PO<\u002Fth><th>Outcome<\u002Fth><th>Statement<\u002Fth><\u002Ftr>'+\n      plosSorted().map(function(x){return '<tr><td><b>'+esc(poLabel(x.code))+'<\u002Fb><\u002Ftd><td>'+esc(x.label||'')+'<\u002Ftd><td>'+esc(x.statement||'')+'<\u002Ftd><\u002Ftr>';}).join('')+'<\u002Ftable>';\n  }\n  if(id==='2.7'){\n    var gradCohort=view.gradCohort||(cohortsList().slice(-1)[0]||'');\n    var gcs=gradCohort? gradCyclesOf(gradCohort):[];\n    var h4='';\n    if(gcs.length){\n      var anyTransfer=plosSorted().some(function(pl){return gradRollup(gradCohort,pl,true)!=null;});\n      h4+='<p>Most recent graduating cohort: <b>'+esc(gradCohort)+'<\u002Fb>, cycle(s) '+esc(gcs.map(function(x){return x.semester;}).join(', '))+'.<\u002Fp>'+\n        '<table><tr><th>PO<\u002Fth><th>Target %<\u002Fth><th>Attained %<\u002Fth>'+(anyTransfer?'<th>Transfer %<\u002Fth>':'')+'<th>Result<\u002Fth><\u002Ftr>'+\n        plosSorted().map(function(pl){\n          var v=gradRollup(gradCohort,pl,false), tvv=gradRollup(gradCohort,pl,true), t=targetFor(gcs[0],pl);\n          return '<tr><td><b>'+esc(poLabel(pl.code))+'<\u002Fb><\u002Ftd><td>'+t+'<\u002Ftd><td>'+(pl.notAssessed?'not yet assessed':(v==null?'\\u2014':v))+'<\u002Ftd>'+\n            (anyTransfer?'<td>'+(pl.notAssessed?'\\u2014':(tvv==null?'\\u2014':tvv))+'<\u002Ftd>':'')+\n            '<td>'+(pl.notAssessed?'n/a':(v==null?'\\u2014':(v>=t?'Attained':'Below target')))+'<\u002Ftd><\u002Ftr>';\n        }).join('')+'<\u002Ftable>';\n    } else h4+='<p>[no graduating cohort marked \\u2014 mark the final-year cycles on the PLO Attainment tab]<\u002Fp>';\n    return h4;\n  }\n  if(/^5\\.3\\.\\d$/.test(id)){\n    var chMap={'5.3.1':'Students','5.3.2':'Faculty members','5.3.3':'Alumni','5.3.4':'Employers'};\n    var ch=chMap[id];\n    var frows=state.feedback.filter(function(f){return f.channel===ch;}).sort(function(a,b){return semRank(b.cycle)-semRank(a.cycle);});\n    if(!frows.length) return '<p>[no feedback recorded for '+esc(ch)+']<\u002Fp>';\n    return '<table><tr><th>Instrument<\u002Fth><th>Cycle<\u002Fth><th>Respondents<\u002Fth><th>Rate %<\u002Fth><th>Key findings<\u002Fth><th>Used in<\u002Fth><\u002Ftr>'+\n      frows.map(function(f){return '<tr><td>'+esc(f.instrument||'')+'<\u002Ftd><td>'+esc(f.cycle||'')+'<\u002Ftd><td>'+esc(f.respondents||'')+'<\u002Ftd><td>'+esc(f.rate||'')+'<\u002Ftd><td>'+esc(f.findings||'')+'<\u002Ftd><td>'+esc(f.usedIn||'not linked')+'<\u002Ftd><\u002Ftr>';}).join('')+'<\u002Ftable>';\n  }\n  if(/^5\\.4\\.\\d$/.test(id)){\n    var lMap={'5.4.1':'PEO','5.4.2':'PO','5.4.3':'Course & Curriculum'};\n    var loop=lMap[id];\n    var crows=state.cqi.filter(function(a){return (a.loop||'PO')===loop;});\n    if(!crows.length) return '<p>[no actions recorded in this loop]<\u002Fp>';\n    return '<table><tr><th>Outcome<\u002Fth><th>Cycle<\u002Fth><th>Finding<\u002Fth><th>Action<\u002Fth><th>Decision<\u002Fth><th>Status<\u002Fth><\u002Ftr>'+\n      crows.map(function(a){\n        var trail=[a.committee,a.meetingRef,a.meetingDate].filter(Boolean).join(', ');\n        return '<tr><td>'+esc(poLabel(a.outcome))+'<\u002Ftd><td>'+esc(a.cycle||'')+'<\u002Ftd><td>'+esc(a.finding||'')+'<\u002Ftd><td>'+esc(a.action||'')+'<\u002Ftd><td>'+esc(trail||'\\u2014')+'<\u002Ftd><td>'+esc(a.status||'')+'<\u002Ftd><\u002Ftr>';\n      }).join('')+'<\u002Ftable>';\n  }\n  return '';\n}\nfunction ensureSeed(id){ var r=sarRec(id); if(!r.html){ r.html=seedForClause(id); save(); } return r; }\nfunction regenClause(id){ if(!confirm('Replace the current text with freshly generated content from your data? Any manual edits here will be lost.')) return; var r=sarRec(id); r.html=seedForClause(id); r.manual=false; save(); refresh(); toast('Regenerated from data'); }\nvar COVER_TAB={crit1:['SAR Builder \\u203a Criterion 1 editors below','crit1'],outcomes:['Program Info','program'],dossier:['SAR Builder \\u203a PO Dossier below','dossier'],crit5:['the 5.1 / 5.2 boxes below','sar'],feedback:['the attainment tabs \\u2014 Students on PLO, Faculty on CO, Alumni & Employers on PEO','attain'],cqi:['CQI & Loop Closure','cqiwrap']};\n\nfunction renderCqiWrap(){\n  if(!view.cqiSub) view.cqiSub='cqi';\n  var steps=[['cqi','Register \\u2014 findings & actions'],['loop','Loop closure \\u2014 stage view']];\n  $('cqiNav').innerHTML=steps.map(function(s){\n    return '<button class=\"'+(view.cqiSub===s[0]?'active':'')+'\" data-sub=\"'+s[0]+'\">'+s[1]+'<\u002Fbutton>';\n  }).join('');\n  $('cqiNav').querySelectorAll('button').forEach(function(b){\n    b.onclick=function(){ view.cqiSub=b.dataset.sub; refresh(); };\n  });\n  ['cqi','loop'].forEach(function(k){ $('tab-'+k).style.display = view.cqiSub===k? '':'none'; });\n  if(view.cqiSub==='cqi') renderCqi(); else renderLoop();\n}\n/* SAR Builder: Criterion 1 \\u2192 PO Dossier (Criterion 2) \\u2192 Evidence, self-audit & export */\n\n/* ---------------- rich-text editor ---------------- */\nfunction rte(id, ph){\n  var r=sarRec(id);\n  return '<div class=\"rte-wrap\"><div class=\"rte-bar\" data-for=\"'+esc(id)+'\">'+\n    '<button data-cmd=\"bold\" title=\"Bold\"><b>B<\u002Fb><\u002Fbutton>'+\n    '<button data-cmd=\"italic\" title=\"Italic\"><i>I<\u002Fi><\u002Fbutton>'+\n    '<button data-cmd=\"underline\" title=\"Underline\"><u>U<\u002Fu><\u002Fbutton>'+\n    '<span class=\"sep\"><\u002Fspan>'+\n    '<button data-cmd=\"insertUnorderedList\" title=\"Bulleted list\">&bull; List<\u002Fbutton>'+\n    '<button data-cmd=\"insertOrderedList\" title=\"Numbered list\">1. List<\u002Fbutton>'+\n    '<span class=\"sep\"><\u002Fspan>'+\n    '<button data-cmd=\"table\" title=\"Insert a 3-column table\">Table<\u002Fbutton>'+\n    '<button data-cmd=\"removeFormat\" title=\"Clear formatting\">Clear<\u002Fbutton>'+\n    '<span class=\"wc\" id=\"wc-'+esc(id)+'\"><\u002Fspan><\u002Fdiv>'+\n    '<div class=\"rte\" contenteditable=\"true\" data-sar=\"'+esc(id)+'\" data-ph=\"'+esc(ph||'Write this sub-criterion\\u2019s SAR text here\\u2026')+'\"'+\n    (r.h?' style=\"height:'+esc(r.h)+'\"':'')+'>'+(r.html||'')+'<\u002Fdiv><\u002Fdiv>';\n}\nfunction wireRte(){\n  document.querySelectorAll('.rte-bar').forEach(function(bar){\n    bar.querySelectorAll('button').forEach(function(b){\n      b.onmousedown=function(e){ e.preventDefault(); };\n      b.onclick=function(){\n        var ed=document.querySelector('[data-sar=\"'+bar.dataset.for+'\"]'); if(!ed) return;\n        ed.focus();\n        if(b.dataset.cmd==='table'){\n          document.execCommand('insertHTML',false,'<table><tr><th>&nbsp;<\u002Fth><th>&nbsp;<\u002Fth><th>&nbsp;<\u002Fth><\u002Ftr><tr><td>&nbsp;<\u002Ftd><td>&nbsp;<\u002Ftd><td>&nbsp;<\u002Ftd><\u002Ftr><\u002Ftable><p>&nbsp;<\u002Fp>');\n        } else document.execCommand(b.dataset.cmd,false,null);\n        saveRte(ed);\n      };\n    });\n  });\n  document.querySelectorAll('[data-sar]').forEach(function(ed){\n    var t=null;\n    function grow(){ ed.style.height='auto'; ed.style.height=Math.max(ed.scrollHeight+2,110)+'px'; }\n    ed.oninput=function(){ clearTimeout(t); t=setTimeout(function(){ saveRte(ed); },600); countRte(ed); grow(); };\n    ed.onblur=function(){ saveRte(ed); };\n    ed.onpaste=function(e){\n      e.preventDefault();\n      var txt=(e.clipboardData||window.clipboardData).getData('text/plain');\n      document.execCommand('insertText',false,txt);\n    };\n    new ResizeObserver(function(){\n      var r=sarRec(ed.dataset.sar), nh=ed.style.height;\n      if(nh && nh!==r.h){ r.h=nh; save(); }\n    }).observe(ed);\n    countRte(ed);\n    grow();\n  });\n}\nfunction saveRte(ed){\n  var r=sarRec(ed.dataset.sar);\n  r.html=ed.innerHTML;\n  r.manual=true;\n  if(r.status==='Not started' && ed.textContent.trim()) r.status='Drafted';\n  save(); countRte(ed);\n}\nfunction countRte(ed){\n  var el=$('wc-'+ed.dataset.sar); if(!el) return;\n  var w=ed.textContent.trim().split(/\\s+/).filter(Boolean).length;\n  el.textContent = w? w+' word'+(w===1?'':'s') : '';\n}\nfunction setSar(id,k,v){ var r=sarRec(id); r[k]=v; save(); if(k==='status') refresh(); }\n\n/* ---------------- SAR Builder shell ---------------- */\nfunction renderSarBuilder(){\n  if(!view.sarSub) view.sarSub='ov';\n  var steps=[['ov','Overview']].concat(SAR_STRUCT.map(function(c){\n    var p=critProgress(c.n);\n    return [String(c.n), c.n+(p.pct===100?' \\u2713':'')];\n  })).concat([['sar','Export']]);\n  $('sarbNav').innerHTML=steps.map(function(s){\n    return '<button class=\"'+(view.sarSub===s[0]?'active':'')+'\" data-sub=\"'+s[0]+'\" title=\"'+esc(s[0]==='ov'?'Overview':(s[0]==='sar'?'Export':('Criterion '+s[0]+': '+SAR_STRUCT.filter(function(c){return String(c.n)===s[0];})[0].title)))+'\">'+esc(s[1])+'<\u002Fbutton>';\n  }).join('');\n  $('sarbNav').querySelectorAll('button').forEach(function(b){\n    b.onclick=function(){ view.sarSub=b.dataset.sub; refresh(); window.scrollTo(0,0); };\n  });\n  var isNum=/^[1-9]$/.test(view.sarSub);\n  $('sarbBody').style.display = (view.sarSub==='ov'||isNum)? '':'none';\n  $('tab-crit1').style.display = (view.sarSub==='1')? '':'none';\n  $('tab-dossier').style.display = (view.sarSub==='2')? '':'none';\n  $('tab-sar').style.display = (view.sarSub==='sar')? '':'none';\n  if(view.sarSub==='ov') renderSarOverview();\n  else if(isNum) renderCriterion(Number(view.sarSub));\n  else { $('sarbBody').innerHTML=''; renderSar(); }\n\n  if(view.sarSub==='2') renderDossier();\n}\nfunction renderSarOverview(){\n  var tot=0, done=0;\n  SAR_STRUCT.forEach(function(c){ var p=critProgress(c.n); tot+=p.total; done+=p.done; });\n  var pct=tot? Math.round(done/tot*100):0;\n  var h='<div class=\"card\"><h2>Self-assessment Report \\u2014 build progress<\u002Fh2>'+\n    '<p class=\"hint\">All nine criteria of ACC-TMP-04-04 V3. Criteria 1, 2 and 5 draw on the data you already keep in this app; the rest are narrative sections whose source material sits with other AUST offices. The SAR must not exceed 150 pages excluding annexures and is submitted through BAETE\\u2019s Online Accreditation Management System.<\u002Fp>'+\n    '<div class=\"grid c3\"><div class=\"kpi '+(pct>=90?'ok':pct>=40?'warn':'bad')+'\"><div class=\"cap\">Sub-criteria complete<\u002Fdiv><div class=\"val\">'+done+'/'+tot+'<\u002Fdiv><div class=\"sub\">'+pct+'% of the report<\u002Fdiv><\u002Fdiv>'+\n    '<div class=\"kpi\"><div class=\"cap\">Awaiting an office<\u002Fdiv><div class=\"val\">'+sarItems().filter(function(x){ return !x.it.covered && sarRec(x.it.id).status==='Requested from office'; }).length+'<\u002Fdiv><div class=\"sub\">requests out, nothing back yet<\u002Fdiv><\u002Fdiv>'+\n    '<div class=\"kpi '+(auditPct()>=90?'ok':'warn')+'\"><div class=\"cap\">Self-audit<\u002Fdiv><div class=\"val\">'+auditPct()+'%<\u002Fdiv><div class=\"sub\">policy \\u00b7 practice \\u00b7 improvement<\u002Fdiv><\u002Fdiv><\u002Fdiv>'+\n    '<div class=\"tbl-wrap\" style=\"margin-top:14px\"><table class=\"tbl\"><thead><tr><th style=\"width:56px\">No.<\u002Fth><th>Criterion<\u002Fth><th style=\"width:150px\">Progress<\u002Fth><th style=\"width:70px\"><\u002Fth><\u002Ftr><\u002Fthead><tbody>';\n  SAR_STRUCT.forEach(function(c){\n    var p=critProgress(c.n);\n    h+='<tr><td><b>'+c.n+'<\u002Fb><\u002Ftd><td>'+esc(c.title)+'<div style=\"font-size:11.5px;color:var(--muted)\">'+c.items.length+' sub-criteria<\u002Fdiv><\u002Ftd>'+\n      '<td><div style=\"display:flex;align-items:center;gap:8px\"><div style=\"flex:1;height:7px;border-radius:5px;background:#e8eef2;overflow:hidden\"><div style=\"height:100%;width:'+p.pct+'%;background:'+(p.pct===100?'var(--ok)':p.pct?'var(--primary)':'#e8eef2')+'\"><\u002Fdiv><\u002Fdiv><span style=\"font-size:12px;font-weight:600;min-width:34px\">'+p.done+'/'+p.total+'<\u002Fspan><\u002Fdiv><\u002Ftd>'+\n      '<td><button class=\"btn small secondary\" onclick=\"view.sarSub=\\''+c.n+'\\';refresh();window.scrollTo(0,0)\">Open<\u002Fbutton><\u002Ftd><\u002Ftr>';\n  });\n  h+='<\u002Ftbody><\u002Ftable><\u002Fdiv><\u002Fdiv>';\n\n  /* office workload */\n  var byOffice={};\n  sarItems().forEach(function(x){\n    if(x.it.covered) return;\n    var r=sarRec(x.it.id);\n    var complete = r.status==='Ready'||(r.html&&r.html.replace(/<[^>]*>/g,'').trim().length>80);\n    (x.it.o||[]).forEach(function(o){\n      if(o===OFF.DEPT||o===OFF.COORD||o===OFF.IAP||o===OFF.ALUM) return;\n      if(!byOffice[o]) byOffice[o]={items:[],done:0};\n      byOffice[o].items.push(x.it); if(complete) byOffice[o].done++;\n    });\n  });\n  var names=Object.keys(byOffice).sort(function(a,b){ return byOffice[b].items.length-byOffice[a].items.length; });\n  h+='<div class=\"card\"><h2>What to collect from each office<\u002Fh2>'+\n    '<p class=\"hint\">Sub-criteria whose source material sits outside the department \\u2014 and isn\\u2019t already collected elsewhere in this app. An office may also be named on other clauses (Criterion 1, 5.1\\u20135.4) that this app gathers through its own editors, so it won\\u2019t show up here for those; only the clauses still needing outside input are listed. Download a template for the office to fill in, then import it back \\u2014 the answers drop straight into the matching boxes above.<\u002Fp>'+\n    '<div class=\"tbl-wrap\"><table class=\"tbl\"><thead><tr><th>Office<\u002Fth><th>Sub-criteria<\u002Fth><th style=\"width:90px\">Received<\u002Fth><th style=\"width:270px\"><\u002Fth><\u002Ftr><\u002Fthead><tbody>';\n  names.forEach(function(o){\n    var d=byOffice[o];\n    var oq=JSON.stringify(o).replace(/\"/g,'&quot;');\n    h+='<tr><td><b>'+esc(o)+'<\u002Fb><\u002Ftd><td>'+d.items.map(function(it){ return '<span class=\"office\">'+esc(it.id)+'<\u002Fspan>'; }).join('')+'<\u002Ftd>'+\n      '<td>'+(d.done===d.items.length? '<span class=\"pill p-ok\">all<\u002Fspan>':'<span class=\"pill '+(d.done?'p-warn':'p-bad')+'\">'+d.done+'/'+d.items.length+'<\u002Fspan>')+'<\u002Ftd>'+\n      '<td><button class=\"btn small secondary\" onclick=\"officeLetter('+oq+')\">Forwarding letter<\u002Fbutton> '+\n      '<button class=\"btn small secondary\" onclick=\"officeTemplate('+oq+')\">CSV template<\u002Fbutton> '+\n      '<button class=\"btn small secondary\" onclick=\"officeImportClick('+oq+')\">Import<\u002Fbutton> '+\n      '<button class=\"btn small secondary\" onclick=\"officeExport('+oq+',\\'csv\\')\">Export<\u002Fbutton><\u002Ftd><\u002Ftr>';\n  });\n  h+='<\u002Ftbody><\u002Ftable><\u002Fdiv>'+\n    '<div class=\"btn-row\"><button class=\"btn secondary\" onclick=\"officeLetter(\\'\\')\">All forwarding letters<\u002Fbutton>'+\n    '<button class=\"btn secondary\" onclick=\"officeTemplate(\\'\\')\">Download all templates (CSV)<\u002Fbutton>'+\n    '<button class=\"btn secondary\" onclick=\"officeImportClick(\\'\\')\">Import (auto-routes by clause)<\u002Fbutton>'+\n    '<button class=\"btn secondary\" onclick=\"officeExport(\\'\\',\\'csv\\')\">Export all (CSV)<\u002Fbutton>'+\n    '<input type=\"file\" id=\"sarOffImp\" accept=\".csv,.json,text/csv,application/json\" style=\"display:none\"><\u002Fdiv><\u002Fdiv>';\n  $('sarbBody').innerHTML=h;\n  var fi=$('sarOffImp'); if(fi) fi.onchange=function(e){ var f=e.target.files&&e.target.files[0]; if(f) officeImportFile(f); e.target.value=''; };\n}\nfunction renderCriterion(n){\n  var c=SAR_STRUCT.filter(function(x){return x.n===n;})[0]; if(!c) return;\n  var p=critProgress(n);\n  var h='<div class=\"card\"><h2>Criterion '+n+': '+esc(c.title)+'<\u002Fh2>'+\n    '<p class=\"hint\">'+c.items.length+' sub-criteria \\u00b7 '+p.done+' complete. Each box holds the SAR text for that clause; drag the bottom-right corner to resize. Offices named on a card are where the source material lives.<\u002Fp>'+\n    '<div class=\"btn-row\" style=\"margin-top:0\"><button class=\"btn secondary\" onclick=\"printCriterion('+n+')\">Print criterion '+n+'<\u002Fbutton>'+\n    '<button class=\"btn secondary\" onclick=\"view.sarSub=\\'ov\\';refresh();window.scrollTo(0,0)\">Back to overview<\u002Fbutton><\u002Fdiv><\u002Fdiv>';\n  c.items.forEach(function(it){\n    var r=sarRec(it.id);\n    if(it.covered==='crit5'){\n      h+='<div class=\"crit-card\"><div class=\"crit-head\"><span class=\"crit-num\">'+esc(it.id)+'<\u002Fspan><span class=\"crit-title\">'+esc(it.t)+'<\u002Fspan>'+\n        (coveredDone(it)? '<span class=\"pill p-ok\">written<\u002Fspan>':'<span class=\"pill p-bad\">empty<\u002Fspan>')+'<\u002Fdiv>'+\n        '<div>'+(it.o||[]).map(function(o){ return '<span class=\"office'+((o===OFF.DEPT||o===OFF.COORD)?' dept':((o===OFF.IAP||o===OFF.ALUM)?' body':''))+'\">'+esc(o)+'<\u002Fspan>'; }).join('')+'<\u002Fdiv>'+\n        '<div class=\"crit-prompt\">'+esc(it.p)+'<\u002Fdiv>'+\n        taFld('', it.id==='5.1'?'crit5.qaSystem':'crit5.studentFeedback', it.id==='5.1'?state.crit5.qaSystem:state.crit5.studentFeedback)+\n        '<\u002Fdiv>';\n      return;\n    }\n    h+='<div class=\"crit-card\"><div class=\"crit-head\"><span class=\"crit-num\">'+esc(it.id)+'<\u002Fspan><span class=\"crit-title\">'+esc(it.t)+'<\u002Fspan>'+\n      (it.covered? '<span class=\"pill p-info\">from your data<\u002Fspan>' : '<span class=\"pill '+(r.status==='Ready'?'p-ok':r.status==='Not started'?'p-mut':'p-warn')+'\">'+esc(r.status)+'<\u002Fspan>')+'<\u002Fdiv>'+\n      '<div>'+(it.o||[]).map(function(o){ return '<span class=\"office'+((o===OFF.DEPT||o===OFF.COORD)?' dept':((o===OFF.IAP||o===OFF.ALUM)?' body':''))+'\">'+esc(o)+'<\u002Fspan>'; }).join('')+'<\u002Fdiv>'+\n      '<div class=\"crit-prompt\">'+esc(it.p)+'<\u002Fdiv>';\n    if(it.covered){\n      var cv=COVER_TAB[it.covered]||['',''];\n      ensureSeed(it.id);\n      var rr=sarRec(it.id);\n      h+='<div class=\"note\" style=\"margin:0 0 9px\">Pre-filled from '+cv[0]+'. Editable below \\u2014 fix it here if a mapping or figure looks wrong; the edited text is what goes into the SAR pack.'+\n        (rr.manual? ' <b style=\"color:var(--primary-dark)\">(edited)<\u002Fb>':'')+\n        (cv[1] && cv[1]!=='crit1' && cv[1]!=='dossier' && cv[1]!=='sar'? ' <a href=\"#\" onclick=\"go(\\''+cv[1]+'\\');return false\" style=\"color:var(--primary);font-weight:600\">Open source tab<\u002Fa>':'')+'<\u002Fdiv>'+\n        rte(it.id)+\n        '<div class=\"crit-meta\"><button class=\"btn small secondary\" onclick=\"regenClause(\\''+it.id+'\\')\">Regenerate from data<\u002Fbutton><\u002Fdiv>'+\n        (it.covered==='crit1'? crit1ExtrasHtml(it.id) : '');\n    } else {\n      h+=rte(it.id)+\n        '<div class=\"crit-meta\"><label style=\"font-size:12px;color:var(--muted)\">Status <select onchange=\"setSar(\\''+it.id+'\\',\\'status\\',this.value)\">'+\n        SAR_STATUS.map(function(s){ return '<option'+(s===r.status?' selected':'')+'>'+s+'<\u002Foption>'; }).join('')+'<\u002Fselect><\u002Flabel>'+\n        '<label style=\"font-size:12px;color:var(--muted)\">Responsible <input value=\"'+esc(r.owner||'')+'\" placeholder=\"person / office contact\" onchange=\"setSar(\\''+it.id+'\\',\\'owner\\',this.value)\" style=\"width:190px\"><\u002Flabel>'+\n        '<label style=\"font-size:12px;color:var(--muted)\">Annexure <select onchange=\"setSar(\\''+it.id+'\\',\\'annexure\\',this.value)\"><option value=\"\"><\u002Foption>'+\n        ANNEX_CODES.map(function(a){ return '<option'+(a===r.annexure?' selected':'')+'>'+a+'<\u002Foption>'; }).join('')+'<\u002Fselect><\u002Flabel>'+\n        '<\u002Fdiv>';\n    }\n    h+='<\u002Fdiv>';\n  });\n  $('sarbBody').innerHTML=h;\n  wireRte();\n  bindFields();\n}\nvar SAR_OFF_COLS=['office','clause','subcriterion','whatIsNeeded','response'];\nfunction officeRowsFor(office){\n  var rows=[];\n  sarItems().forEach(function(x){\n    if(x.it.covered) return;\n    var offs=(x.it.o||[]).filter(function(o){return o!==OFF.DEPT&&o!==OFF.COORD&&o!==OFF.IAP&&o!==OFF.ALUM;});\n    if(!offs.length) return;\n    if(office && offs.indexOf(office)===-1) return;\n    rows.push({office:office||offs.join('; '), id:x.it.id, t:x.it.t, need:x.it.p});\n  });\n  return rows;\n}\nfunction officeTemplate(office){\n  var rows=officeRowsFor(office);\n  if(!rows.length){ toast('Nothing to collect for '+(office||'any office'),'err'); return; }\n  var out=[SAR_OFF_COLS];\n  rows.forEach(function(r){ out.push([r.office,r.id,r.t,r.need,'']); });\n  downloadText((office? office.replace(/[^\\w]+/g,'_'):'all-offices')+'_SAR-template.csv', toCsv(out), 'text/csv');\n  toast('CSV template downloaded \\u2014 fill the Response column and import it back');\n}\nfunction officeLetter(office){\n  var rows=officeRowsFor(office);\n  if(!rows.length){ toast('Nothing to collect for '+(office||'any office'),'err'); return; }\n  var byOff={};\n  if(office) byOff[office]=rows;\n  else rows.forEach(function(r){ (r.office||'').split('; ').forEach(function(o){ (byOff[o]=byOff[o]||[]).push(r); }); });\n  var p=state.program;\n  var sections=Object.keys(byOff).map(function(o){\n    var items=byOff[o];\n    return '<h2 style=\"page-break-before:always\">To: '+esc(o)+'<\u002Fh2>'+\n      '<p><b>From:<\u002Fb> '+esc(p.coordinator||'Program OBE Coordinator')+', '+esc(p.dept||'')+'<br>'+\n      '<b>Programme:<\u002Fb> '+esc(p.name||p.code||'')+' &middot; <b>Date:<\u002Fb> '+new Date().toLocaleDateString('en-GB')+'<\u002Fp>'+\n      '<p>The programme is preparing its Self-assessment Report for accreditation by the Board of Accreditation for Engineering and Technical Education (BAETE), against template ACC-TMP-04-04 V3. The sub-criteria below draw on records held by your office. For each one, please write your response directly in the &ldquo;Your response&rdquo; column below \\u2014 in full sentences, as it should read in the report \\u2014 and return this document. If it is easier for your office to work in a spreadsheet instead, the equivalent CSV template is available on request and can be re-imported automatically; either format is welcome.<\u002Fp>'+\n      '<table class=\"office-tbl\"><colgroup><col style=\"width:9%\"><col style=\"width:22%\"><col style=\"width:29%\"><col style=\"width:40%\"><\u002Fcolgroup>'+\n      '<thead><tr><th>Clause<\u002Fth><th>Sub-criterion<\u002Fth><th>What the SAR asks for<\u002Fth><th>Your response<\u002Fth><\u002Ftr><\u002Fthead><tbody>'+\n      items.map(function(r){ return '<tr><td class=\"c\"><b>'+esc(r.id)+'<\u002Fb><\u002Ftd><td>'+esc(r.t)+'<\u002Ftd><td>'+esc(r.need)+'<\u002Ftd><td>&nbsp;<br><br><br><\u002Ftd><\u002Ftr>'; }).join('')+\n      '<\u002Ftbody><\u002Ftable>'+\n      '<p style=\"margin-top:22px\">Kindly return the completed document to the Programme OBE Coordinator, with a copy to the IQAC.<\u002Fp>'+\n      '<p style=\"margin-top:34px\">_______________________________<br>'+esc(p.coordinator||'Programme OBE Coordinator')+'<\u002Fp>';\n  }).join('');\n  var doc='<!DOCTYPE html><html xmlns:o=\"urn:schemas-microsoft-com:office:office\" xmlns:w=\"urn:schemas-microsoft-com:office:word\"><head><meta charset=\"utf-8\">'+\n    '<title>SAR data request<\u002Ftitle><!--[if gte mso 9]><xml><w:WordDocument><w:View>Print<\u002Fw:View><\u002Fw:WordDocument><\u002Fxml><![endif]-->'+\n    '<style>@page{size:A4;margin:2cm}body{font-family:\"Times New Roman\",Times,serif;font-size:12pt;color:#000;line-height:1.5}'+\n    'h1{font-size:16pt;margin:0 0 4px}h2{font-size:13.5pt;margin:0 0 8px;border-bottom:1pt solid #000;padding-bottom:3px}'+\n    'p{margin:0 0 10px;text-align:justify}'+\n    'table.office-tbl{width:100%;table-layout:fixed;border-collapse:collapse;margin:12px 0}'+\n    'table.office-tbl th,table.office-tbl td{border:1pt solid #666;padding:9px 10px;text-align:left;vertical-align:top;word-wrap:break-word;font-size:10.5pt}'+\n    'table.office-tbl th{background:#eee;font-weight:bold}table.office-tbl td.c{text-align:center}<\u002Fstyle><\u002Fhead><body>'+\n    '<h1>Request for BAETE self-assessment data<\u002Fh1>'+sections+'<\u002Fbody><\u002Fhtml>';\n  downloadText((office? office.replace(/[^\\w]+/g,'_'):'all-offices')+'_forwarding-letter.doc', doc, 'application/msword');\n  toast('Forwarding letter downloaded \\u2014 open it, then Save As .docx to edit or send');\n}\nfunction officeExport(office,kind){\n  var rows=officeRowsFor(office).map(function(r){ var rec=sarRec(r.id); return [r.office,r.id,r.t,r.need,(rec.html||'').replace(/<[^>]*>/g,' ').replace(/\\s+/g,' ').trim()]; });\n  if(!rows.length){ toast('Nothing to export','err'); return; }\n  if(kind==='json'){ downloadText((office||'all-offices').replace(/[^\\w]+/g,'_')+'_SAR-export.json', JSON.stringify(rows.map(function(r){return {office:r[0],clause:r[1],subcriterion:r[2],whatIsNeeded:r[3],response:r[4]};}),null,2), 'application/json'); return; }\n  downloadText((office||'all-offices').replace(/[^\\w]+/g,'_')+'_SAR-export.csv', toCsv([SAR_OFF_COLS].concat(rows)), 'text/csv');\n  toast('Exported');\n}\nfunction officeImportClick(office){ var fi=$('sarOffImp'); if(fi) fi.click(); }\nfunction officeImportFile(file){\n  var rd=new FileReader();\n  rd.onload=function(){\n    var txt=String(rd.result), list=[];\n    try{\n      if(/^\\s*[\\[{]/.test(txt)){ list=JSON.parse(txt); if(!Array.isArray(list)) list=[]; }\n      else{\n        var rows=parseCsv(txt);\n        if(rows.length<2) throw new Error('the CSV has no data rows');\n        var head=rows[0].map(function(hh){ return String(hh).trim().toLowerCase(); });\n        list=rows.slice(1).map(function(r){ var o={}; head.forEach(function(hh,i){ o[hh]=r[i]; }); return o; });\n      }\n    }catch(e){ toast('Could not read the file: '+(e.message||e),'err'); return; }\n    var updated=0, skipped=0;\n    list.forEach(function(o){\n      var clause=String(o.clause||'').trim();\n      var resp=String(o.response||'').trim();\n      var known=sarItems().some(function(x){ return x.it.id===clause; });\n      if(!clause||!known||!resp){ skipped++; return; }\n      var r=sarRec(clause);\n      r.html='<p>'+esc(resp).replace(/\\r?\\n\\r?\\n/g,'<\u002Fp><p>').replace(/\\r?\\n/g,'<br>')+'<\u002Fp>';\n      r.status='Draft received'; r.manual=true;\n      updated++;\n    });\n    if(updated) save();\n    refresh();\n    toast(updated+' clause(s) filled in from the file'+(skipped?', '+skipped+' skipped':''));\n  };\n  rd.onerror=function(){ toast('Could not read the file','err'); };\n  rd.readAsText(file);\n}\nfunction printCriterion(n){\n  var c=SAR_STRUCT.filter(function(x){return x.n===n;})[0]; if(!c) return;\n  var w=window.open('','_blank'); if(!w){ toast('Allow popups','err'); return; }\n  var body=c.items.map(function(it){\n    var r=sarRec(it.id);\n    var txt = it.covered? '<p class=\"muted\">Generated from structured data \\u2014 see the full SAR pack.<\u002Fp>'\n      : (r.html && r.html.replace(/<[^>]*>/g,'').trim()? r.html : '<p class=\"todo\">[to be written \\u2014 source: '+esc((it.o||[]).join('; '))+']<\u002Fp>');\n    return '<h3>'+esc(it.id)+' '+esc(it.t)+'<\u002Fh3>'+txt;\n  }).join('');\n  w.document.write('<!DOCTYPE html><html><head><meta charset=\"utf-8\"><title>Criterion '+n+'<\u002Ftitle><style>'+sarStyle()+'<\u002Fstyle><\u002Fhead><body><div class=\"wrap\">'+\n    '<div class=\"noprint\"><button onclick=\"window.print()\" style=\"padding:8px 18px;font-size:13px;cursor:pointer\">Print / save as PDF<\u002Fbutton><\u002Fdiv>'+\n    '<h1>Criterion '+n+': '+esc(c.title)+'<\u002Fh1><div class=\"sub\">'+esc(state.program.name||state.program.code||'')+'<\u002Fdiv>'+body+'<\u002Fdiv><\u002Fbody><\u002Fhtml>');\n  w.document.close();\n}\n\nfunction drawPloChart(cy){\n  var cv=$('chPlo'); if(!cv||!window.Chart) return;\n  if(view.charts.plo){ view.charts.plo.destroy(); view.charts.plo=null; }\n  var plos=plosSorted();\n  var labels=plos.map(function(p){return p.code;});\n  var vals=plos.map(function(p){ return cy? combinedOf(cy,p):null; });\n  var tg=plos.map(function(p){ return targetFor(cy,p); });\n  view.charts.plo=new Chart(cv,{ type:'bar',\n    data:{ labels:labels, datasets:[\n      {label:'Attained %', data:vals, backgroundColor:vals.map(function(v,i){ return v==null?'#dde4ea':(v>=tg[i]?'#4b3f8f':'#c0392b'); }), borderRadius:4},\n      {label:'Target %', data:tg, type:'line', borderColor:'#d98324', backgroundColor:'#d98324', borderDash:[5,4], pointRadius:0, borderWidth:2}\n    ]},\n    options:{ responsive:true, maintainAspectRatio:false, scales:{ y:{beginAtZero:true, max:100, title:{display:true,text:'%'}} }, plugins:{legend:{position:'bottom'}} }\n  });\n}\n\n/* ---------------- Program Info ---------------- */\nfunction renderProgram(){\n  var p=state.program, c=state.cfg;\n  $('tab-program').innerHTML='<div class=\"card\"><h2>Program<\u002Fh2><p class=\"hint\">Set once. The program code must match the code used in the AUST IQAC Portal.<\u002Fp>'+\n    '<div class=\"grid c3\">'+\n    fldSel('Program code (portal)','program.code',p.code,['','CE','CSE','EEE','ME','IPE','TE','ARCH','BBA'])+\n    fld('Program title','program.name',p.name,'e.g. B.Sc. in Mechanical Engineering')+\n    fld('Department','program.dept',p.dept,'e.g. Dept. of MPE')+\n    fld('Faculty / School','program.faculty',p.faculty,'e.g. Faculty of Engineering')+\n    fldSel('Accreditation framework','program.framework',p.framework,['BAETE','IAB','BAC','Internal/BNQF'])+\n    fldSel('Accreditation status','program.status',p.status,['Accredited','Visit expected','Applied','Preparing','Not applicable'])+\n    fld('Program OBE Coordinator','program.coordinator',p.coordinator,'your name')+\n    '<\u002Fdiv><\u002Fdiv>'+\n    renderOutcomesHtml()+\n    '<div class=\"card\"><h2>Attainment rules<\u002Fh2><p class=\"hint\">Program-level thresholds. Course KPI thresholds stay in the OBE Course Manager.<\u002Fp>'+\n    '<div class=\"grid c4\">'+\n    fldNum('Default PLO target %','cfg.ploTarget',c.ploTarget)+\n    fldNum('Default PEO target %','cfg.peoTarget',c.peoTarget)+\n    fldNum('Direct weight %','cfg.wDirect',c.wDirect)+\n    fldNum('Indirect weight %','cfg.wIndirect',c.wIndirect)+\n    '<\u002Fdiv>'+\n    '<div class=\"note\"><b>How attainment is computed.<\u002Fb> Direct PLO % = credit-weighted average of course-level PO attainment from your OBE Course Manager files. Indirect % = your exit/alumni survey result for that PLO (entered per cycle). Combined = ('+esc(c.wDirect)+'\\u00d7direct + '+esc(c.wIndirect)+'\\u00d7indirect) \\u00f7 100. A PLO is met when combined \\u2265 target.<\u002Fdiv><\u002Fdiv>';\n  var pi=$('tab-program');\n  var fwSel='<label class=\"fld\">BAETE template version<select data-path=\"program.frameworkVersion\">'+\n    ['BAETE V3.0','BAETE V2.1 (superseded)'].map(function(o){ return '<option'+(o===(state.program.frameworkVersion||'BAETE V3.0')?' selected':'')+'>'+esc(o)+'<\u002Foption>'; }).join('')+'<\u002Fselect><\u002Flabel>';\n  pi.insertAdjacentHTML('afterbegin','<div class=\"card\"><h2>Accreditation framework<\u002Fh2>'+\n    '<p class=\"hint\">Which BAETE criteria and SAR template this program is preparing against.<\u002Fp>'+\n    '<div class=\"grid c2\">'+fwSel+'<div><\u002Fdiv><\u002Fdiv>'+frameworkNote()+'<\u002Fdiv>');\n  bindFields();\n}\nfunction frameworkNote(){\n  var v=state.program.frameworkVersion||'BAETE V3.0';\n  if(v!=='BAETE V3.0') return '<div class=\"note\"><b>V2.1 is superseded.<\u002Fb> BAETE accepts applications on template V2.1 only until 30 June 2026; V3.0 has applied since 1 July 2025. Switch back only if an application is already in flight on the old template.<\u002Fdiv>';\n  return '<div class=\"note\"><b>BAETE V3.0<\u002Fb> (ACC-MAN-02 V3.0, effective 1 July 2025). PO6 now covers sustainable development impacts, merging the old PO6 and PO7, and <b>PO12 is entrepreneurship<\u002Fb> \\u2014 new in V3.0. Knowledge-Profile references are built into the statements; WP attributes are required for PO1\\u2013PO6 and EA attributes for PO9. <a href=\"#\" onclick=\"showMigration();return false\" style=\"color:var(--primary);font-weight:600\">See the migration notes<\u002Fa>.<\u002Fdiv>';\n}\nfunction fld(label,path,val,ph){ return '<label class=\"fld\">'+esc(label)+'<input data-path=\"'+path+'\" value=\"'+esc(val)+'\" placeholder=\"'+esc(ph||'')+'\"><\u002Flabel>'; }\nfunction fldNum(label,path,val){ return '<label class=\"fld\">'+esc(label)+'<input type=\"number\" data-path=\"'+path+'\" value=\"'+esc(val)+'\"><\u002Flabel>'; }\nfunction fldSel(label,path,val,opts){ return '<label class=\"fld\">'+esc(label)+'<select data-path=\"'+path+'\">'+opts.map(function(o){ return '<option'+(String(o)===String(val)?' selected':'')+'>'+esc(o)+'<\u002Foption>'; }).join('')+'<\u002Fselect><\u002Flabel>'; }\nfunction bindFields(){\n  document.querySelectorAll('[data-path]').forEach(function(inp){\n    inp.onchange=function(){\n      var parts=inp.dataset.path.split('.'), o=state;\n      for(var i=0;i<parts.length-1;i++) o=o[parts[i]];\n      o[parts[parts.length-1]]= inp.type==='number'? (inp.value===''?'':Number(inp.value)) : inp.value;\n      save(); refresh();\n    };\n  });\n}\n\n/* ---------------- Outcomes ---------------- */\nfunction renderOutcomesHtml(){\n  var h='<div class=\"card\"><h2>Program Educational Objectives (PEOs)'+subTag('1.2')+'<\u002Fh2><p class=\"hint\">Broad statements about graduates 3\\u20135 years after graduation. Assessed from alumni and employer surveys.<\u002Fp>';\n  if(!state.peos.length) h+='<div class=\"empty\">No PEOs yet.<\u002Fdiv>';\n  else{\n    h+='<div class=\"tbl-wrap\"><table class=\"tbl\"><thead><tr><th style=\"width:70px\">Code<\u002Fth><th>Statement<\u002Fth><th style=\"width:60px\"><\u002Fth><\u002Ftr><\u002Fthead><tbody>';\n    state.peos.forEach(function(p,i){ h+='<tr><td><b>'+esc(p.code)+'<\u002Fb><\u002Ftd><td>'+esc(p.statement)+'<\u002Ftd><td><button class=\"btn small secondary\" onclick=\"editPeoOutcome('+i+')\">Edit<\u002Fbutton><\u002Ftd><\u002Ftr>'; });\n    h+='<\u002Ftbody><\u002Ftable><\u002Fdiv>';\n  }\n  h+='<div class=\"btn-row\"><button class=\"btn secondary\" onclick=\"editPeoOutcome(-1)\">+ Add PEO<\u002Fbutton>'+\n    (state.peos.length?'':'<button class=\"btn secondary\" onclick=\"loadSamplePeos()\">Load 4 sample PEOs<\u002Fbutton>')+'<\u002Fdiv><\u002Fdiv>';\n\n  h+='<div class=\"card\"><h2>Program Learning Outcomes (PLOs / POs)'+subTag('2.1')+'<\u002Fh2><p class=\"hint\">Framework-configurable \\u2014 nothing engineering-specific is imposed on Architecture or Business. PLO numbers must match the PO numbers used in your course files. Assessment methods, WK / WP / EA attributes and SAR prose live on the <b>PO Dossier<\u002Fb> tab.<\u002Fp>';\n  if(!state.plos.length){\n    h+='<div class=\"empty\">No PLOs yet.<\u002Fdiv><div class=\"btn-row\"><button class=\"btn\" onclick=\"loadBaete()\">Load the twelve BAETE V3.0 POs<\u002Fbutton><button class=\"btn secondary\" onclick=\"editPlo(-1)\">+ Add PLO manually<\u002Fbutton><\u002Fdiv>';\n  }else{\n    h+='<div class=\"tbl-wrap\"><table class=\"tbl\"><thead><tr><th style=\"width:70px\">Code<\u002Fth><th>Short label<\u002Fth><th>BNQF domain<\u002Fth><th>Maps to PEOs<\u002Fth><th style=\"width:60px\"><\u002Fth><\u002Ftr><\u002Fthead><tbody>';\n    plosSorted().forEach(function(p){\n      var idx=state.plos.indexOf(p);\n      h+='<tr><td><b>'+esc(p.code)+'<\u002Fb><\u002Ftd><td>'+esc(p.label||'')+'<div style=\"font-size:12px;color:var(--muted)\">'+esc((p.statement||'').slice(0,110))+((p.statement||'').length>110?'\\u2026':'')+'<\u002Fdiv><\u002Ftd>'+\n        '<td><span class=\"chip\">'+esc(p.domain||'\\u2014')+'<\u002Fspan><\u002Ftd>'+\n        '<td>'+((p.peos||[]).length? (p.peos||[]).map(function(x){return '<span class=\"chip\">'+esc(x)+'<\u002Fspan>';}).join('') : '<span class=\"pill p-bad\">unmapped<\u002Fspan>')+'<\u002Ftd>'+\n        '<td><button class=\"btn small secondary\" onclick=\"editPlo('+idx+')\">Edit<\u002Fbutton><\u002Ftd><\u002Ftr>';\n    });\n    h+='<\u002Ftbody><\u002Ftable><\u002Fdiv><div class=\"btn-row\"><button class=\"btn secondary\" onclick=\"editPlo(-1)\">+ Add PLO<\u002Fbutton><\u002Fdiv>';\n  }\n  h+='<\u002Fdiv>';\n  if(state.plos.length&&state.peos.length){\n    h+='<div class=\"card\"><h2>PLO \\u2192 PEO mapping matrix'+subTag('2.2')+'<\u002Fh2><p class=\"hint\">Tick marks come from each PLO\\u2019s mapping. Every PLO should serve at least one PEO.<\u002Fp><div class=\"tbl-wrap\"><table class=\"tbl matrix\"><thead><tr><th>PLO<\u002Fth>'+\n      state.peos.map(function(p){return '<th>'+esc(p.code)+'<\u002Fth>';}).join('')+'<\u002Ftr><\u002Fthead><tbody>';\n    plosSorted().forEach(function(pl){\n      h+='<tr><td>'+esc(pl.code)+'<\u002Ftd>'+state.peos.map(function(pe){ return '<td>'+(((pl.peos||[]).indexOf(pe.code)>-1)?'<span style=\"color:var(--primary);font-weight:700\">\\u25cf<\u002Fspan>':'')+'<\u002Ftd>'; }).join('')+'<\u002Ftr>';\n    });\n    h+='<\u002Ftbody><\u002Ftable><\u002Fdiv><\u002Fdiv>';\n  }\n  return h;\n}\nfunction v3PeoMap(){ return {1:['PEO1'],2:['PEO1'],3:['PEO1','PEO2'],4:['PEO1'],5:['PEO2'],6:['PEO3'],7:['PEO3'],8:['PEO2'],9:['PEO2'],10:['PEO2','PEO4'],11:['PEO4'],12:['PEO4']}; }\nfunction loadBaete(){\n  if(state.plos.length && !confirm('Replace the current PLO list with the twelve BAETE V3.0 POs? Attainment history and CQI actions are kept \\u2014 only the outcome statements change.')) return;\n  var peoCodes=state.peos.map(function(p){return p.code;});\n  var mapDefault=v3PeoMap();\n  state.plos=baetePOs().map(function(r,i){\n    return {id:uid('plo'), code:r[0], label:r[1], statement:r[2], domain:r[3],\n      wk:(r[4]||[]).slice(), wp:[], ea:[], sdg:[],\n      method:'', criteria:'', expected:'', prose:'', annexure:'D', notAssessed:(i+1)===12,\n      peos:(mapDefault[i+1]||[]).filter(function(c){ return !peoCodes.length || peoCodes.indexOf(c)>-1; })};\n  });\n  if(!state.peos.length) loadSamplePeos(true);\n  ensurePo12Action();\n  save(); toast('BAETE V3.0 POs loaded \\u2014 review the statements, then the PO Dossier'); refresh();\n}\nfunction loadSamplePeos(quiet){\n  state.peos=samplePEOs().map(function(s,i){ return {id:uid('peo'), code:'PEO'+(i+1), statement:s}; });\n  save(); if(!quiet){ toast('Sample PEOs loaded \\u2014 edit to your approved statements'); refresh(); }\n}\nfunction editPeoOutcome(i){\n  var row= i>-1? state.peos[i]:null;\n  modal(row?'Edit PEO':'New PEO',[\n    {key:'code',label:'Code',value:row?row.code:'PEO'+(state.peos.length+1)},\n    {key:'statement',label:'Statement',type:'textarea',value:row?row.statement:''}\n  ],{\n    onSave:function(v){\n      if(!v.statement){ toast('Enter the statement','err'); return; }\n      if(row){ row.code=v.code; row.statement=v.statement; } else state.peos.push({id:uid('peo'),code:v.code,statement:v.statement});\n      save(); closeModal(); refresh();\n    },\n    onDelete: row? function(){ if(!confirm('Delete '+row.code+'?')) return; state.peos.splice(i,1); save(); closeModal(); refresh(); }:null\n  });\n}\nfunction editPlo(i){\n  var row= i>-1? state.plos[i]:null;\n  modal(row?'Edit PLO':'New PLO',[\n    {key:'code',label:'Code',value:row?row.code:'PLO'+(state.plos.length+1),hint:'The number must match the PO number in your course files.'},\n    {key:'label',label:'Short label',value:row?row.label:'',placeholder:'e.g. Problem analysis'},\n    {key:'statement',label:'Full statement',type:'textarea',value:row?row.statement:''},\n    {key:'domain',label:'BNQF domain',type:'select',options:DOMAINS,value:row?(row.domain||'Thinking'):'Thinking'},\n    {key:'peos',label:'Maps to PEOs',value:row?(row.peos||[]).join(', '):'',placeholder:'e.g. PEO1, PEO2',hint:'WK / WP / EA attributes, assessment method, criteria, expected level and SAR prose are edited on the PO Dossier tab.'}\n  ],{\n    onSave:function(v){\n      if(!v.code){ toast('Enter the code','err'); return; }\n      var peos=v.peos? v.peos.split(/[,;]/).map(function(s){return s.trim();}).filter(Boolean):[];\n      if(row) Object.assign(row,{code:v.code,label:v.label,statement:v.statement,domain:v.domain,peos:peos});\n      else state.plos.push({id:uid('plo'),code:v.code,label:v.label,statement:v.statement,domain:v.domain,peos:peos,wk:[],wp:[],ea:[],sdg:[],method:'',criteria:'',expected:'',prose:'',annexure:'D',notAssessed:false});\n      save(); closeModal(); refresh();\n    },\n    onDelete: row? function(){ if(!confirm('Delete '+row.code+'?')) return; state.plos.splice(i,1); save(); closeModal(); refresh(); }:null\n  });\n}\n\n/* ---------------- Course Files ---------------- */\nfunction renderCourses(){\n  var el=$('tab-courses');\n  var h='<div class=\"card\"><h2>CO attainments \\u2014 one drop per semester'+subTag('2.4')+'<\u002Fh2>'+\n    '<p class=\"hint\">Drop every course\\u2019s JSON export from the OBE Course Manager. CO and PO attainment are computed here; files are read in your browser and only course-level aggregates are kept.<\u002Fp>'+\n    '<div class=\"dropzone\" id=\"dz\"><div class=\"big\">Drop course JSON files here, or click to choose<\u002Fdiv>'+\n    '<div class=\"small\">several files at once is fine \\u00b7 a file containing many courses works too \\u00b7 re-dropping a course updates it<\u002Fdiv><\u002Fdiv>'+\n    '<input type=\"file\" id=\"fileIn\" accept=\".json,application/json\" multiple style=\"display:none\">'+\n    '<div class=\"note\"><b>Nothing personal is stored.<\u002Fb> Student names, IDs and marks are used only to compute CO/PO attainment while the file is open, then discarded. What is saved: course code, credit, section, student count and PO percentages.<\u002Fdiv>'+\n    '<div class=\"btn-row\"><button class=\"btn secondary\" onclick=\"newCycle()\">+ Add empty cycle<\u002Fbutton><button class=\"btn secondary\" onclick=\"loadDemo()\">Load demo cycles<\u002Fbutton><button class=\"btn secondary\" onclick=\"loadSample()\">Load grand sample<\u002Fbutton><\u002Fdiv><\u002Fdiv>';\n\n  var cs=cycles();\n  if(!cs.length) h+='<div class=\"card\"><div class=\"empty\">No evaluation cycle yet \\u2014 drop your course files above.<\u002Fdiv><\u002Fdiv>';\n cs.forEach(function(cy){\n    var nums=ploNumsIn(cy);\n    h+='<div class=\"card\"><h2 style=\"cursor:pointer\" title=\"Click to show or hide the course details\" onclick=\"toggleCycle(\\''+cy.id+'\\')\">'+esc(cy.semester||'(cycle)')+(cy.cohort?' \\u00b7 '+esc(cy.cohort):'')+'<\u002Fh2>'+\n      '<p class=\"hint\">'+(cy.courses||[]).length+' course(s) \\u00b7 '+(cy.courses||[]).reduce(function(s,c){return s+(c.credit||0);},0)+' credits \\u00b7 PLOs covered: '+(nums.length?nums.map(function(n){return 'PLO'+n;}).join(', '):'none')+'<\u002Fp>'+\n      '<div class=\"grid '')||'\\u2014')+'<\u002Ftd>'+\n            '<td>'+Object.keys(c.poAttain||{}).sort(function(a,b){return a-b;}).map(function(n){ var v=c.poAttain[n]; return '<span class=\"chip\">PO'+esc(n)+' '+v+'%<\u002Fspan>'; }).join('')+'<\u002Ftd>'+\n            '<td><button class=\"btn small danger\" onclick=\"delCourse(\\''+cy.id+'\\','+ci+')\">Remove<\u002Fbutton><\u002Ftd><\u002Ftr>';\n        });\n        h+='<\u002Ftbody><\u002Ftable><\u002Fdiv>';\n      }\n    }\n    h+='<div class=\"btn-row\"><button class=\"btn small danger\" onclick=\"delCycle(\\''+cy.id+'\\')\">Delete cycle<\u002Fbutton><\u002Fdiv><\u002Fdiv>';\n  });\n  h+=feedbackCard(['Faculty members'],'co','SAR 5.3.2','Faculty course-review and curriculum-retreat rounds \\u2014 the course & curriculum loop\\u2019s main input.');\n  if(cs.length){\n    h+='<div class=\"card\">'+collH2('co-cmp','Cohort comparison \\u2014 course-level PO attainment');\n    if(collOpen('co-cmp')){\n      h+='<p class=\"hint\">Credit-weighted PO attainment computed from the course files of each cohort, before survey (indirect) evidence is added. Use it to see whether a weakness travels with the cohort or with the curriculum.<\u002Fp>'+\n        '<div class=\"chartbox\"><canvas id=\"chCoBar\"><\u002Fcanvas><\u002Fdiv>'+\n        '<div class=\"tbl-wrap\" style=\"margin-top:14px\"><table class=\"tbl matrix\"><thead><tr><th>PLO / PO<\u002Fth>'+\n        cs.slice().reverse().map(function(c){ return '<th>'+esc(c.cohort||c.semester)+'<div style=\"font-weight:400;color:var(--muted)\">'+esc(c.semester)+'<\u002Fdiv><\u002Fth>'; }).join('')+'<th>Change<\u002Fth><\u002Ftr><\u002Fthead><tbody>';\n      var order=cs.slice().reverse();\n      plosSorted().forEach(function(pl){\n        var first=null,last=null,cells='';\n        order.forEach(function(c){\n          var v=directOf(c,pl), t=targetFor(c,pl);\n          if(v!=null){ if(first==null) first=v; last=v; }\n          cells+='<td>'+(v==null?'<span style=\"color:var(--muted)\">\\u2014<\u002Fspan>':'<span class=\"'+(v>=t?'cell-ok':'cell-bad')+'\">'+v+'<\u002Fspan>')+'<\u002Ftd>';\n        });\n        var chg=(first!=null&&last!=null)?r1(last-first):null;\n        cells+='<td>'+(chg==null?'\\u2014':(chg>0?'<span class=\"cell-ok\">\\u2191 +'+chg+'<\u002Fspan>':chg<0?'<span class=\"cell-bad\">\\u2193 '+chg+'<\u002Fspan>':'0'))+'<\u002Ftd>';\n        h+='<tr><td>'+esc(pl.code)+'<div style=\"font-size:11.5px;color:var(--muted);font-weight:400\">'+esc(pl.label||'')+'<\u002Fdiv><\u002Ftd>'+cells+'<\u002Ftr>';\n      });\n      h+='<\u002Ftbody><\u002Ftable><\u002Fdiv>';\n    }\n    h+='<\u002Fdiv>';\n  }\n  el.innerHTML=h;\n  drawCoCharts();\n  wireFeedbackCard('co');\n  var dz=$('dz');\n  dz.onclick=function(){ $('fileIn').click(); };\n  $('fileIn').onchange=function(e){ addFiles(e.target.files); e.target.value=''; };\n  ['dragover','dragenter'].forEach(function(ev){ dz.addEventListener(ev,function(e){ e.preventDefault(); dz.classList.add('over'); }); });\n  ['dragleave','drop'].forEach(function(ev){ dz.addEventListener(ev,function(e){ e.preventDefault(); dz.classList.remove('over'); }); });\n  dz.addEventListener('drop',function(e){ addFiles(e.dataTransfer.files); });\n}\nfunction drawCoCharts(){\n  var cv=$('chCoBar'); if(!cv||!window.Chart) return;\n  if(view.charts.coBar){ view.charts.coBar.destroy(); view.charts.coBar=null; }\n  var order=cycles().slice().reverse(); if(!order.length) return;\n  var palette=['#4b3f8f','#d98324','#2b6cb0','#7a8a5e','#8e5fa8','#c0392b'];\n  var sets=order.map(function(c,i){\n    return {label:(c.cohort||c.semester)+' \\u00b7 '+c.semester, data:plosSorted().map(function(pl){ return directOf(c,pl); }),\n      backgroundColor:palette[i%palette.length], borderRadius:4};\n  });\n  sets.push({label:'Target %', data:plosSorted().map(function(pl){ return targetFor(order[order.length-1],pl); }),\n    type:'line', borderColor:'#31285f', backgroundColor:'#31285f', borderDash:[5,4], pointRadius:0, borderWidth:2});\n  view.charts.coBar=new Chart(cv,{type:'bar',\n    data:{labels:plosSorted().map(function(p){return p.code;}), datasets:sets},\n    options:{responsive:true,maintainAspectRatio:false,scales:{y:{beginAtZero:true,max:100,title:{display:true,text:'direct attainment %'}}},plugins:{legend:{position:'bottom'}}}});\n}\nfunction subTag(id){ return id? ' <span class=\"subcrit\">'+esc(id)+'<\u002Fspan>' : ''; }\nfunction toggleColl(k){ view.coll=view.coll||{}; view.coll[k]=!collOpen(k); refresh(); }\nfunction collOpen(k,def){ view.coll=view.coll||{}; if(view.coll[k]===undefined) view.coll[k]=!!def; return view.coll[k]; }\nfunction collH2(key,title){ return '<h2 style=\"cursor:pointer\" onclick=\"toggleColl(\\''+key+'\\')\" title=\"Click to show or hide\">'+(collOpen(key)?'\\u25be ':'\\u25b8 ')+esc(title)+'<\u002Fh2>'; }\nfunction toggleCycle(id){ view.openCycle = (view.openCycle===id)? '' : id; refresh(); }\nfunction ploNumsIn(cy){\n  var s={}; (cy.courses||[]).forEach(function(c){ Object.keys(c.poAttain||{}).forEach(function(n){ s[n]=1; }); });\n  return Object.keys(s).map(Number).sort(function(a,b){return a-b;});\n}\nfunction setCy(id,k,v){ var cy=cycleById(id); if(!cy) return; cy[k]= (k==='gradCount')? (v===''?'':Number(v)) : v; save(); refresh(); }\nfunction delCourse(id,ci){ var cy=cycleById(id); if(!cy) return; cy.courses.splice(ci,1); save(); refresh(); }\nfunction delCycle(id){ if(!confirm('Delete this cycle and its course aggregates?')) return; state.cycles=state.cycles.filter(function(c){return c.id!==id;}); save(); refresh(); }\nfunction newCycle(){\n  modal('New evaluation cycle',[\n    {key:'semester',label:'Semester / cycle',value:'',placeholder:'e.g. Spring 2026'},\n    {key:'cohort',label:'Cohort (Batch)',value:'',placeholder:'e.g. Batch 42'}\n  ],{ onSave:function(v){\n    if(!v.semester){ toast('Enter the semester','err'); return; }\n    var cy={id:uid('cy'),semester:v.semester,cohort:v.cohort,courses:[],indirect:{},targets:{}};\n    state.cycles.push(cy); view.cycle=cy.id; save(); closeModal(); refresh();\n  }});\n}\nfunction findOrMakeCycle(sem,coh){\n  var cy=state.cycles.filter(function(c){ return c.semester===sem; })[0];\n  if(!cy){ cy={id:uid('cy'),semester:sem||'(unnamed)',cohort:coh||'',courses:[],indirect:{},targets:{}}; state.cycles.push(cy); }\n  if(!cy.cohort && coh) cy.cohort=coh;\n  return cy;\n}\nfunction addFiles(fileList){\n  var files=Array.prototype.slice.call(fileList||[]);\n  if(!files.length) return;\n  var pending=files.length, added=0;\n  files.forEach(function(f){\n    var rd=new FileReader();\n    rd.onload=function(){\n      try{\n        var data=JSON.parse(String(rd.result));\n        var list=Array.isArray(data.courses)? data.courses : (data.code&&data.cos? [data]:[]);\n        if(!list.length) throw new Error('no courses found');\n        list.forEach(function(c){\n          var a=analyzeCourse(c);\n          var cy=findOrMakeCycle(a.semester, a.cohort);\n          var key=a.code+'|'+a.section;\n          cy.courses=(cy.courses||[]).filter(function(x){ return (x.code+'|'+x.section)!==key; });\n          cy.courses.push(a); added++;\n          if(!Object.keys(a.poAttain).length) toast(a.code+': no computable PO results (marks missing?)','err');\n          if(!state.program.name && a.programText) state.program.name=a.programText;\n          view.cycle=cy.id;\n        });\n      }catch(e){ toast('Could not read '+f.name+': '+(e.message||e),'err'); }\n      if(--pending===0){ save(); refresh(); if(added) toast(added+' course(s) loaded'); }\n    };\n    rd.onerror=function(){ if(--pending===0){ save(); refresh(); } toast('Could not read '+f.name,'err'); };\n    rd.readAsText(f);\n  });\n}\n/* ---------------- grand sample: every input and every outcome filled in ---------------- */\nfunction loadSample(){\n  if((state.cycles.length||state.cqi.length) && !confirm('Replace everything in this browser with the grand sample program? Download a backup first if you need one.')) return;\n  state=blank();\n  state.program ection,pos,sem,drift){\n    var cos=pos.map(function(pr,i){ var o={}; o[pr[0]]=1; return {id:code+sem+'co'+i, statement:'CO'+(i+1), po:o}; });\n    var items=[], as=[{id:code+sem+'a', name:'All', type:'Quiz', items:items}];\n    cos.forEach(function(co,i){ items.push({id:code+sem+'it'+i, label:'Q'+(i+1), max:20, coId:co.id}); });\n    var students=[], marks={};\n    for(var s=0;s<NS;s++){ var sid=code+sem+'s'+s; students.push({id:sid}); marks[sid]={}; }\n    pos.forEach(function(pr,i){\n      var want=Math.max(5, Math.min(97, pr[1]+(drift||0)));\n      var pass=Math.round(NS*want/100);\n      var it=items[i];\n      for(var s=0;s<NS;s++){\n        /* deterministic shuffle so the passing students differ per CO */\n        var rank=((s*7+i*11)%NS);\n        var v= rank<pass ? 10+((s*3+i*5)%11) : ((s*5+i*3)%10);   /* >=10/20 passes, <10 fails */\n        marks[code+sem+'s'+s][it.id]=v;\n      }\n    });\n    return {code:code,title:title,credit:String(credit),section:section,semester:sem,cohort:({'Spring 2026':'Batch 42','Fall 2025':'Batch 41','Fall 2024':'Batch 40'}[sem]||'Batch 42'),\n      program:state.program.name||'B.Sc. in Mechanical Engineering',cos:cos,assessments:as,students:students,marks:marks,cfg:{kpiMarks:50,kpiTarget:50}};\n  }\n  function cycleSet(sem,drift){\n    return [\n      mk('ME4011','Renewable Energy',3,'A',[[7,38],[2,74],[6,62],[5,45],[3,58]],sem,drift),\n      mk('ME4105','Thermal Systems Design',4,'A',[[1,82],[2,70],[3,55],[11,34]],sem,drift),\n      mk('ME4203','Measurement & Instrumentation',3,'B',[[4,41],[5,52],[10,68]],sem,drift),\n      mk('ME4301','Industrial Management',2,'A',[[9,76],[10,72],[11,36]],sem,drift),\n      mk('ME4400','Capstone Project',6,'A',[[3,66],[4,48],[8,80],[9,78],[10,71],[11,40]],sem,drift)\n    ];\n  }\n  [['Fall 2024',-11],['Fall 2025',-6],['Spring 2026',0]].forEach(function(pair){\n    cycleSet(pair[0],pair[1]).forEach(function(c){\n      var a=analyzeCourse(c); var cy=findOrMakeCycle(a.semester,a.cohort);\n canvas id=\"chPloCompare\"><\u002Fcanvas><\u002Fdiv>'+\n        '<div class=\"chartbox\" style=\"margin-top:18px\"><canvas id=\"chTrend\"><\u002Fcanvas><\u002Fdiv>'+\n        '<div class=\"tbl-wrap\" style=\"margin-top:14px\"><table class=\"tbl matrix\"><thead><tr><th>PLO<\u002Fth>'+\n        cs.slice().reverse().map(function(c){ return '<th>'+esc(c.semester)+(c.cohort?'<div style=\"font-weight:400;color:var(--muted)\">'+esc(c.cohort)+'<\u002Fdiv>':'')+'<\u002Fth>'; }).join('')+'<th>Change<\u002Fth><\u002Ftr><\u002Fthead><tbody>';\n      var order=cs.slice().reverse();\n      plosSorted().forEach(function(pl){\n        var first=null,last=null,cells='';\n        order.forEach(function(c){\n          var v=combinedOf(c,pl), t=targetFor(c,pl);\n          if(v!=null){ if(first==null) first=v; last=v; }\n          cells+='<td>'+(v==null?'<span style=\"color:var(--muted)\">\\u2014<\u002Fspan>':'<span class=\"'+(v>=t?'cell-ok':'cell-bad')+'\">'+v+'<\u002Fspan>')+'<\u002Ftd>';\n        });\n        var chg=(first!=null&&last!=null)? r1(last-first):null;\n        cells+='<td>'+(chg==null?'\\u2014':(chg>0?'<span class=\"cell-ok\">\\u2191 +'+chg+'<\u002Fspan>':chg<0?'<span class=\"cell-bad\">\\u2193 '+chg+'<\u002Fspan>':'0'))+'<\u002Ftd>';\n        h+='<tr><td>'+esc(pl.code)+'<\u002Ftd>'+cells+'<\u002Ftr>';\n      });\n      h+='<\u002Ftbody><\u002Ftable><\u002Fdiv>';\n    }\n    h+='<\u002Fdiv>';\n  }\n  el.innerHTML=h;\n  wireFeedbackCard('plo');\n  wireGradPanel();\n  if(cs.length>1){ drawPloCompare(cs); drawTrend(cs); }\n}\nfunction drawPloCompare(cs){\n  var cv=$('chPloCompare'); if(!cv||!window.Chart) return;\n  if(view.charts.ploCmp){ view.charts.ploCmp.destroy(); view.charts.ploCmp=null; }\n  var order=cs.slice().reverse();\n  var palette=['#4b3f8f','#d98324','#2b6cb0','#7a8a5e','#8e5fa8','#c0392b'];\n  var sets=order.map(function(c,i){\n    return {label:(c.cohort||c.semester)+' \\u00b7 '+c.semester, data:plosSorted().map(function(pl){ return combinedOf(c,pl); }),\n
