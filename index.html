te.peoRecords.slice().sort(function(a,b){ return String(b.assessYear).localeCompare(String(a.assessYear)) || num(a.peo)-num(b.peo); });\n  var years=[]; rows.forEach(function(r){ var y=String(r.assessYear||''); if(y&&years.indexOf(y)===-1) years.push(y); }); years.sort();\n  var h='<div class=\"card\"><h2>PEO attainment \\u2014 alumni cohorts'+subTag('1.4')+'<\u002Fh2>'+\n    '<p class=\"hint\">Collected each year for cohorts 3\\u20135 years after graduation, from alumni and employer surveys. One survey round usually covers several cohorts \\u2014 enter them together with <b>+ Survey round<\u002Fb>. Aggregate figures only, never personal alumni data.<\u002Fp>';\n  if(!state.peos.length){ h+='<div class=\"empty\">Define the PEOs first on <b>Program Info<\u002Fb>.<\u002Fdiv><\u002Fdiv>'; el.innerHTML=h; return; }\n  h+='<div class=\"btn-row\" style=\"margin-top:0\"><button class=\"btn\" onclick=\"surveyRound()\">+ Survey round (all PEOs \\u00d7 cohorts)<\u002Fbutton>'+\n    '<button class=\"btn secondary\" onclick=\"editPeoRec(-1)\">+ Single record<\u002Fbutton>'+\n    '<button class=\"btn secondary\" onclick=\"peoTemplate()\">Download template (CSV)<\u002Fbutton>'+\n    '<button class=\"btn secondary\" onclick=\"$(\\'peoImp\\').click()\">Import CSV / JSON<\u002Fbutton>'+\n    '<button class=\"btn secondary\" onclick=\"peoExport(\\'csv\\')\">Export CSV<\u002Fbutton>'+\n    '<button class=\"btn secondary\" onclick=\"peoExport(\\'json\\')\">Export JSON<\u002Fbutton>'+\n    '<input type=\"file\" id=\"peoImp\" accept=\".csv,.json,text/csv,application/json\" style=\"display:none\"><\u002Fdiv>'+\n    '<div class=\"btn-row\"><span style=\"font-size:12.5px;color:var(--muted)\">View:<\u002Fspan>'+\n    '<button class=\"btn small '+(view.peoGrouped?'':'secondary')+'\" onclick=\"view.peoGrouped=true;refresh()\">One table per PEO<\u002Fbutton>'+\n    '<button class=\"btn small '+(view.peoGrouped?'secondary':'')+'\" onclick=\"view.peoGrouped=false;refresh()\">All records<\u002Fbutton><\u002Fdiv>'+\n    '<div class=\"note\" style=\"margin-bottom:0\">A cohort is <b>due<\u002Fb> for PEO review 3\\u20135 years after graduation. A cohort that has not yet reached its window is simply not due \\u2014 not non-compliant. CSV import upserts by PEO + cohort + assessment year.<\u002Fdiv><\u002Fdiv>';\n  if(!rows.length) h+='<div class=\"card\"><div class=\"empty\">No PEO records yet. Use <b>+ Survey round<\u002Fb> when a survey has been administered \\u2014 you can enter every PEO for every cohort in one grid.<\u002Fdiv><\u002Fdiv>';\n  else{\n    h+=cohortManageHtml();\n    h+= view.peoGrouped? peoGroupedHtml() : peoFlatHtml(rows);\n  }\n  h+=feedbackCard(['Alumni','Employers'],'peo','SAR 5.3.3 & 5.3.4','The alumni and employer survey rounds behind the PEO figures above \\u2014 respondents and response rates make the figures defensible.');\n  if(years.length>1) h+=peoTrendHtml(years);\n  h+=peoCohortCompareHtml();\n  el.innerHTML=h;\n  drawPeoChart();\n  wireFeedbackCard('peo');\n  var pi=$('peoImp'); if(pi) pi.onchange=function(e){ var f=e.target.files&&e.target.files[0]; if(f) importRows('peo',f); e.target.value=''; };\n}\n/* cohort-to-cohort comparison: PEO × cohort matrix + grouped bars */\nfunction peoCohorts(){\n  var seen={}, list=[];\n  state.peoRecords.forEach(function(r){\n    if(!r.batch || seen[r.batch]) return;\n    seen[r.batch]=1;\n    list.push({batch:r.batch, gradYear:r.gradYear||'', assessYear:r.assessYear||''});\n  });\n  return list.sort(function(a,b){ return String(a.gradYear).localeCompare(String(b.gradYear)) || String(a.batch).localeCompare(String(b.batch)); });\n}\nfunction peoValue(code,batch){\n  var r=state.peoRecords.filter(function(x){ return x.peo===code && String(x.batch)===String(batch) && x.actual!==''&&x.actual!=null; })\n    .sort(function(a,b){ return String(b.assessYear).localeCompare(String(a.assessYear)); })[0];\n  return r? {v:Number(r.actual), t:peoTargetOf(r), year:r.assessYear} : null;\n}\nfunction peoCohortCompareHtml(){\n  var cohorts=peoCohorts();\n  if(cohorts.length<2) return '';\n  var h='<div class=\"card\">'+collH2('peo-cmp','Cohort comparison');\n  if(collOpen('peo-cmp')){\n    h+='<p class=\"hint\">Latest assessed figure per PEO for each alumni cohort \\u2014 the view PSAC/FQAC and accreditors ask for. Green means the cohort met that PEO\\u2019s target.<\u002Fp>'+\n      '<div class=\"chartbox\"><canvas id=\"chPeo\"><\u002Fcanvas><\u002Fdiv>'+\n      '<div class=\"tbl-wrap\" style=\"margin-top:14px\"><table class=\"tbl matrix\"><thead><tr><th>PEO<\u002Fth>'+\n      cohorts.map(function(c){ return '<th>'+esc(c.batch)+(c.gradYear?'<div style=\"font-weight:400;color:var(--muted)\">grad '+esc(c.gradYear)+'<\u002Fdiv>':'')+'<\u002Fth>'; }).join('')+\n      '<th>Latest vs earliest<\u002Fth><\u002Ftr><\u002Fthead><tbody>';\n    state.peos.forEach(function(pe){\n      var first=null,last=null,cells='';\n      cohorts.forEach(function(c){\n        var d=peoValue(pe.code,c.batch);\n        if(d){ if(first==null) first=d.v; last=d.v; }\n        cells+='<td>'+(d==null?'<span style=\"color:var(--muted)\">\\u2014<\u002Fspan>':'<span class=\"'+(d.v>=d.t?'cell-ok':'cell-bad')+'\" title=\"assessed '+esc(d.year)+'\">'+d.v+'<\u002Fspan>')+'<\u002Ftd>';\n      });\n      var chg=(first!=null&&last!=null)?r1(last-first):null;\n      cells+='<td>'+(chg==null?'\\u2014':(chg>0?'<span class=\"cell-ok\">\\u2191 +'+chg+'<\u002Fspan>':chg<0?'<span class=\"cell-bad\">\\u2193 '+chg+'<\u002Fspan>':'0'))+'<\u002Ftd>';\n      h+='<tr><td>'+esc(pe.code)+'<div style=\"font-size:11.5px;color:var(--muted);font-weight:400\">'+esc((pe.statement||'').slice(0,60))+((pe.statement||'').length>60?'\\u2026':'')+'<\u002Fdiv><\u002Ftd>'+cells+'<\u002Ftr>';\n    });\n    h+='<\u002Ftbody><\u002Ftable><\u002Fdiv>'+\n      '<div class=\"note\" style=\"margin-bottom:0\">Read the last column as the direction of travel between your earliest and most recent cohort. A consistent gap on the same PEO across cohorts is a program-design signal, not a cohort anomaly \\u2014 raise it in the CQI Register.<\u002Fdiv>';\n  }\n  return h+'<\u002Fdiv>';\n}\nfunction drawPeoChart(){\n  var cv=$('chPeo'); if(!cv||!window.Chart) return;\n  if(view.charts.peo){ view.charts.peo.destroy(); view.charts.peo=null; }\n  var cohorts=peoCohorts(); if(cohorts.length<2) return;\n  var palette=['#4b3f8f','#d98324','#2b6cb0','#7a8a5e','#8e5fa8','#c0392b','#1e8e3e','#e67e22'];\n  var sets=cohorts.map(function(c,i){\n    return {label:c.batch, data:state.peos.map(function(pe){ var d=peoValue(pe.code,c.batch); return d? d.v:null; }),\n      backgroundColor:palette[i%palette.length], borderRadius:4};\n  });\n  var tg=state.peos.map(function(pe){\n    var d=null; cohorts.forEach(function(c){ d=d||peoValue(pe.code,c.batch); });\n    return d? d.t : Number(state.cfg.peoTarget)||70;\n  });\n  sets.push({label:'Target %', data:tg, type:'line', borderColor:'#31285f', backgroundColor:'#31285f', borderDash:[5,4], pointRadius:0, borderWidth:2});\n  view.charts.peo=new Chart(cv,{type:'bar',\n    data:{labels:state.peos.map(function(p){return p.code;}), datasets:sets},\n    options:{responsive:true,maintainAspectRatio:false,scales:{y:{beginAtZero:true,max:100,title:{display:true,text:'%'}}},plugins:{legend:{position:'bottom'}}}});\n}\n/* cohort management: rename, duplicate, delete a whole alumni cohort */\nfunction cohortManageHtml(){\n  var cs=peoCohorts();\n  var h='<div class=\"card\"><h2>Alumni cohorts'+subTag('1.4')+'<\u002Fh2><p class=\"hint\">Each cohort holds one record per PEO. Duplicate a cohort to start the next survey round from the same structure; deleting removes all of that cohort\\u2019s PEO records.<\u002Fp>'+\n    '<div class=\"tbl-wrap\"><table class=\"tbl\"><thead><tr><th>Cohort<\u002Fth><th>Graduated<\u002Fth><th>Assessed<\u002Fth><th>PEO records<\u002Fth><th>With data<\u002Fth><th>Coverage<\u002Fth><th><\u002Fth><\u002Ftr><\u002Fthead><tbody>';\n  cs.forEach(function(c){\n    var rs=state.peoRecords.filter(function(r){ return String(r.batch)===String(c.batch); });\n    var withData=rs.filter(function(r){ return r.actual!==''&&r.actual!=null; }).length;\n    var yrs=[]; rs.forEach(function(r){ var y=String(r.assessYear||''); if(y&&yrs.indexOf(y)===-1) yrs.push(y); });\n    var f=rs[0]||{};\n    var cov=[]; if(f.alumniN) cov.push(f.alumniN+' alumni'+(f.rate?' ('+f.rate+'%)':'')); if(f.employerN) cov.push(f.employerN+' employers');\n    h+='<tr><td><b>'+esc(c.batch)+'<\u002Fb><\u002Ftd><td>'+esc(c.gradYear||'\\u2014')+'<\u002Ftd><td>'+esc(yrs.join(', ')||'\\u2014')+'<\u002Ftd>'+\n      '<td>'+rs.length+'<\u002Ftd><td>'+withData+'<\u002Ftd><td style=\"font-size:12.5px;color:var(--muted)\">'+esc(cov.join(' \\u00b7 ')||'\\u2014')+'<\u002Ftd>'+\n      '<td><div class=\"btn-row\" style=\"margin:0\"><button class=\"btn small secondary\" onclick=\"duplicateCohort(\\''+esc(c.batch)+'\\')\">Duplicate<\u002Fbutton>'+\n      '<button class=\"btn small secondary\" onclick=\"renameCohort(\\''+esc(c.batch)+'\\')\">Rename<\u002Fbutton>'+\n      '<button class=\"btn small danger\" onclick=\"deleteCohort(\\''+esc(c.batch)+'\\')\">Delete<\u002Fbutton><\u002Fdiv><\u002Ftd><\u002Ftr>';\n  });\n  return h+'<\u002Ftbody><\u002Ftable><\u002Fdiv><\u002Fdiv>';\n}\nfunction deleteCohort(batch){\n  var rs=state.peoRecords.filter(function(r){ return String(r.batch)===String(batch); });\n  if(!rs.length) return;\n  if(!confirm('Delete cohort \\u201c'+batch+'\\u201d and all '+rs.length+' of its PEO record(s)? This cannot be undone.')) return;\n  state.peoRecords=state.peoRecords.filter(function(r){ return String(r.batch)!==String(batch); });\n  save(); refresh(); toast('Cohort \\u201c'+batch+'\\u201d deleted');\n}\nfunction renameCohort(batch){\n  modal('Rename cohort \\u2014 '+batch,[\n    {key:'batch',label:'Cohort name',value:batch},\n    {key:'gradYear',label:'Graduation year',type:'number',value:(state.peoRecords.filter(function(r){return String(r.batch)===String(batch);})[0]||{}).gradYear||''}\n  ],{ onSave:function(v){\n    if(!v.batch){ toast('Enter a cohort name','err'); return; }\n    state.peoRecords.forEach(function(r){ if(String(r.batch)===String(batch)){ r.batch=v.batch; if(v.gradYear!=='') r.gradYear=v.gradYear; } });\n    save(); closeModal(); refresh(); toast('Cohort renamed');\n  }});\n}\nfunction duplicateCohort(batch){\n  var src=state.peoRecords.filter(function(r){ return String(r.batch)===String(batch); });\n  if(!src.length) return;\n  var yr=new Date().getFullYear();\n  var g=Number((src[0]||{}).gradYear)||yr-5;\n  modal('Duplicate cohort \\u2014 from '+batch,[\n    {key:'batch',label:'New cohort name',value:'',placeholder:'e.g. Batch 38'},\n    {key:'gradYear',label:'Graduation year',type:'number',value:g+1},\n    {key:'assessYear',label:'Assessment year',type:'number',value:yr},\n    {key:'copyValues',label:'Copy the attainment percentages too?',type:'select',\n      options:['No \\u2014 blank, ready to fill (recommended)','Yes \\u2014 copy as a starting point'],\n      value:'No \\u2014 blank, ready to fill (recommended)',\n      hint:'Copied figures are real survey data for the source cohort \\u2014 only carry them over if you intend to overwrite them.'},\n    {key:'copyCoverage',label:'Copy respondent counts?',type:'select',options:['Yes','No'],value:'No'},\n    {type:'html',html:'Creates one record per PEO for the new cohort, keeping the same targets. Records that already exist for that cohort and year are left untouched.'}\n  ],{ saveLabel:'Duplicate', onSave:function(v){\n    var nb=(v.batch||'').trim();\n    if(!nb){ toast('Enter the new cohort name','err'); return; }\n    var keepVals=/^Yes/.test(v.copyValues||''), keepCov=/^Yes/.test(v.copyCoverage||'');\n    var made=0, skipped=0;\n    src.forEach(function(r){\n      var exists=state.peoRecords.some(function(x){ return x.peo===r.peo && String(x.batch)===nb && String(x.assessYear)===String(v.assessYear); });\n      if(exists){ skipped++; return; }\n      state.peoRecords.push({id:uid('pr'), peo:r.peo, batch:nb, gradYear:v.gradYear, assessYear:v.assessYear,\n        target:r.target, actual: keepVals? r.actual:'',\n        alumniN: keepCov? r.alumniN:'', rate: keepCov? r.rate:'', employerN: keepCov? r.employerN:'',\n        link:'', remarks:''});\n      made++;\n    });\n    if(!made){ toast('Nothing to create \\u2014 those records already exist','err'); return; }\n    save(); closeModal(); refresh();\n    toast('Cohort \\u201c'+nb+'\\u201d created with '+made+' PEO record(s)'+(skipped?' \\u00b7 '+skipped+' already existed':''));\n  }});\n}\nfunction peoTargetOf(r){ return (r.target===''||r.target==null)? Number(state.cfg.peoTarget)||70 : Number(r.target); }\nfunction peoRowCells(r){\n  var i=state.peoRecords.indexOf(r);\n  var t=peoTargetOf(r), has=(r.actual!==''&&r.actual!=null), a=has?Number(r.actual):null;\n  var met=has&&a>=t, since=(r.assessYear&&r.gradYear)?(Number(r.assessYear)-Number(r.gradYear)):null;\n  var cov=[]; if(r.alumniN) cov.push(r.alumniN+' alumni'+(r.rate?' ('+r.rate+'%)':'')); if(r.employerN) cov.push(r.employerN+' employers');\n  var acts=cqiFor(r.peo, String(r.assessYear||''));\n  return '<td>'+esc(r.batch||'\\u2014')+'<div style=\"font-size:12px;color:var(--muted)\">graduated '+esc(r.gradYear||'\\u2014')+'<\u002Fdiv><\u002Ftd>'+\n    '<td>'+esc(r.assessYear||'\\u2014')+(since!=null?' <span style=\"font-size:11.5px;color:var(--muted)\">(+'+since+'y)<\u002Fspan>':'')+'<\u002Ftd>'+\n    '<td>'+t+'<\u002Ftd><td><b>'+(has?a+'%':'\\u2014')+'<\u002Fb><\u002Ftd>'+\n    '<td>'+(has? (a-t>=0?'<span class=\"cell-ok\">+'+r1(a-t)+'<\u002Fspan>':'<span class=\"cell-bad\">'+r1(a-t)+'<\u002Fspan>'):'\\u2014')+'<\u002Ftd>'+\n    '<td style=\"font-size:12.5px;color:var(--muted)\">'+esc(cov.join(' \\u00b7 ')||'\\u2014')+'<\u002Ftd>'+\n    '<td>'+(has? (met?'<span class=\"pill p-ok\">Met<\u002Fspan>':'<span class=\"pill p-bad\">Below<\u002Fspan>'):'<span class=\"pill p-mut\">no data<\u002Fspan>')+'<\u002Ftd>'+\n    '<td>'+(acts.length? '<span class=\"pill p-info\">'+esc(acts[0].status)+'<\u002Fspan>' : (has&&!met? '<button class=\"btn small\" onclick=\"draftCqiPeo('+i+')\">Draft CQI<\u002Fbutton>':''))+\n    ' <button class=\"btn small secondary\" onclick=\"editPeoRec('+i+')\">Edit<\u002Fbutton><\u002Ftd>';\n}\nfunction peoGroupedHtml(){\n  var h='';\n  state.peos.forEach(function(pe){\n    var rs=state.peoRecords.filter(function(r){ return r.peo===pe.code; })\n      .sort(function(a,b){ return String(b.assessYear).localeCompare(String(a.assessYear)) || String(a.batch).localeCompare(String(b.batch)); });\n    var withData=rs.filter(function(r){ return r.actual!==''&&r.actual!=null; });\n    var met=withData.filter(function(r){ return Number(r.actual)>=peoTargetOf(r); }).length;\n    h+='<div class=\"card\"><h2>'+esc(pe.code)+' \\u00b7 '+esc((pe.statement||'').slice(0,110))+((pe.statement||'').length>110?'\\u2026':'')+subTag('1.4')+'<\u002Fh2>'+\n      '<p class=\"hint\">'+(withData.length? met+' of '+withData.length+' cohort(s) met target':'no cohort data yet')+'<\u002Fp>';\n    if(!rs.length) h+='<div class=\"empty\">No cohorts recorded for '+esc(pe.code)+'.<\u002Fdiv>';\n    else{\n      h+='<div class=\"tbl-wrap\"><table class=\"tbl\"><thead><tr><th>Alumni cohort<\u002Fth><th>Assessed<\u002Fth><th>Target<\u002Fth><th>Actual<\u002Fth><th>Gap<\u002Fth><th>Coverage<\u002Fth><th>Result<\u002Fth><th><\u002Fth><\u002Ftr><\u002Fthead><tbody>';\n      rs.forEach(function(r){ h+='<tr>'+peoRowCells(r)+'<\u002Ftr>'; });\n      h+='<\u002Ftbody><\u002Ftable><\u002Fdiv>';\n    }\n    h+='<div class=\"btn-row\"><button class=\"btn small secondary\" onclick=\"editPeoRec(-1,\\''+esc(pe.code)+'\\')\">+ Add cohort to '+esc(pe.code)+'<\u002Fbutton><\u002Fdiv><\u002Fdiv>';\n  });\n  return h;\n}\nfunction peoFlatHtml(rows){\n  var h='<div class=\"card\"><div class=\"tbl-wrap\"><table class=\"tbl\"><thead><tr><th>PEO<\u002Fth><th>Alumni cohort<\u002Fth><th>Assessed<\u002Fth><th>Target<\u002Fth><th>Actual<\u002Fth><th>Gap<\u002Fth><th>Coverage<\u002Fth><th>Result<\u002Fth><th><\u002Fth><\u002Ftr><\u002Fthead><tbody>';\n  rows.forEach(function(r){ h+='<tr><td><span class=\"chip\">'+esc(r.peo)+'<\u002Fspan><\u002Ftd>'+peoRowCells(r)+'<\u002Ftr>'; });\n  return h+'<\u002Ftbody><\u002Ftable><\u002Fdiv><\u002Fdiv>';\n}\nfunction peoTrendHtml(years){\n  var h='<div class=\"card\"><h2>PEO trend by assessment year'+subTag('1.4')+'<\u002Fh2><p class=\"hint\">Mean across the cohorts assessed in each year.<\u002Fp><div class=\"tbl-wrap\"><table class=\"tbl matrix\"><thead><tr><th>PEO<\u002Fth>'+years.map(function(y){return '<th>'+esc(y)+'<\u002Fth>';}).join('')+'<th>Change<\u002Fth><\u002Ftr><\u002Fthead><tbody>';\n  state.peos.forEach(function(pe){\n    var first=null,last=null,cells='';\n    years.forEach(function(y){\n      var rs=state.peoRecords.filter(function(x){ return x.peo===pe.code && String(x.assessYear)===y && x.actual!==''&&x.actual!=null; });\n      var v= rs.length? r1(rs.reduce(function(s,x){return s+Number(x.actual);},0)/rs.length) : null;\n      var t= rs.length? peoTargetOf(rs[0]) : Number(state.cfg.peoTarget)||70;\n      if(v!=null){ if(first==null) first=v; last=v; }\n      cells+='<td>'+(v==null?'<span style=\"color:var(--muted)\">\\u2014<\u002Fspan>':'<span class=\"'+(v>=t?'cell-ok':'cell-bad')+'\" title=\"'+esc(rs.map(function(x){return x.batch;}).join(', '))+'\">'+v+'<\u002Fspan>')+'<\u002Ftd>';\n    });\n    var chg=(first!=null&&last!=null)?r1(last-first):null;\n    cells+='<td>'+(chg==null?'\\u2014':(chg>0?'<span class=\"cell-ok\">\\u2191 +'+chg+'<\u002Fspan>':chg<0?'<span class=\"cell-bad\">\\u2193 '+chg+'<\u002Fspan>':'0'))+'<\u002Ftd>';\n    h+='<tr><td>'+esc(pe.code)+'<\u002Ftd>'+cells+'<\u002Ftr>';\n  });\n  return h+'<\u002Ftbody><\u002Ftable><\u002Fdiv><\u002Fdiv>';\n}\n\n/* one survey round \\u2014 every PEO for every cohort in a single grid */\nfunction surveyRound(){\n  var codes=state.peos.map(function(p){return p.code;});\n  if(!codes.length){ toast('Define PEOs first','err'); return; }\n  var yr=new Date().getFullYear();\n  var known={}, order=[];\n  state.peoRecords.forEach(function(r){ var k=(r.batch||'')+'|'+(r.gradYear||''); if(r.batch&&!known[k]){ known[k]=1; order.push(r.batch+':'+(r.gradYear||'')); } });\n  modal('Survey round \\u2014 PEO attainment',[\n    {key:'assessYear',label:'Assessment year',type:'number',value:yr},\n    {key:'cohorts',label:'Cohorts surveyed',value:order.slice(0,4).join(', ')||'Batch 36:'+(yr-5)+', Batch 37:'+(yr-4),\n      hint:'Comma-separated, as cohort:graduation-year \\u2014 e.g. Batch 36:2021, Batch 37:2022'},\n    {key:'target',label:'Target % (all cells)',type:'number',value:state.cfg.peoTarget},\n    {type:'html',html:'Press <b>Build grid<\u002Fb> to lay out the PEO \\u00d7 cohort table, fill the attainment percentages, then save. Existing records for the same PEO, cohort and year are updated.'}\n  ],{ saveLabel:'Build grid', onSave:function(v){ buildRoundGrid(v); } });\n}\nfunction buildRoundGrid(v){\n  var codes=state.peos.map(function(p){return p.code;});\n  var cohorts=String(v.cohorts||'').split(',').map(function(s){ return s.trim(); }).filter(Boolean)\n    .map(function(s){ var p=s.split(':'); return {batch:p[0].trim(), gradYear:(p[1]||'').trim()}; });\n  if(!cohorts.length){ toast('List at least one cohort','err'); return; }\n  var yr=String(v.assessYear||'').trim(), tgt=v.target===''?state.cfg.peoTarget:Number(v.target);\n  var body=$('mBody');\n  $('mTitle').textContent='Survey round '+yr+' \\u2014 '+cohorts.length+' cohort(s)';\n  body.innerHTML='';\n  var wrap=document.createElement('div'); wrap.className='tbl-wrap';\n  var head='<table class=\"tbl\"><thead><tr><th>PEO<\u002Fth>'+cohorts.map(function(c){ return '<th>'+esc(c.batch)+(c.gradYear?'<div style=\"font-weight:400;color:var(--muted)\">grad '+esc(c.gradYear)+'<\u002Fdiv>':'')+'<\u002Fth>'; }).join('')+'<\u002Ftr><\u002Fthead><tbody>';\n  codes.forEach(function(code){\n    head+='<tr><td><b>'+esc(code)+'<\u002Fb><\u002Ftd>'+cohorts.map(function(c){\n      var ex=state.peoRecords.filter(function(r){ return r.peo===code && String(r.batch)===c.batch && String(r.assessYear)===yr; })[0];\n      return '<td><input class=\"mini\" type=\"number\" min=\"0\" max=\"100\" data-peo=\"'+esc(code)+'\" data-batch=\"'+esc(c.batch)+'\" value=\"'+(ex&&ex.actual!==''&&ex.actual!=null?esc(ex.actual):'')+'\" placeholder=\"%\"><\u002Ftd>';\n    }).join('')+'<\u002Ftr>';\n  });\n  head+='<tr><td style=\"color:var(--muted)\">Alumni respondents<\u002Ftd>'+cohorts.map(function(c){\n    var ex=state.peoRecords.filter(function(r){ return String(r.batch)===c.batch && String(r.assessYear)===yr; })[0];\n    return '<td><input class=\"mini\" type=\"number\" min=\"0\" data-cov=\"alumniN\" data-batch=\"'+esc(c.batch)+'\" value=\"'+(ex&&ex.alumniN?esc(ex.alumniN):'')+'\"><\u002Ftd>';\n  }).join('')+'<\u002Ftr>'+\n  '<tr><td style=\"color:var(--muted)\">Response rate %<\u002Ftd>'+cohorts.map(function(c){\n    var ex=state.peoRecords.filter(function(r){ return String(r.batch)===c.batch && String(r.assessYear)===yr; })[0];\n    return '<td><input class=\"mini\" type=\"number\" min=\"0\" max=\"100\" data-cov=\"rate\" data-batch=\"'+esc(c.batch)+'\" value=\"'+(ex&&ex.rate?esc(ex.rate):'')+'\"><\u002Ftd>';\n  }).join('')+'<\u002Ftr>'+\n  '<tr><td style=\"color:var(--muted)\">Employer respondents<\u002Ftd>'+cohorts.map(function(c){\n    var ex=state.peoRecords.filter(function(r){ return String(r.batch)===c.batch && String(r.assessYear)===yr; })[0];\n    return '<td><input class=\"mini\" type=\"number\" min=\"0\" data-cov=\"employerN\" data-batch=\"'+esc(c.batch)+'\" value=\"'+(ex&&ex.employerN?esc(ex.employerN):'')+'\"><\u002Ftd>';\n  }).join('')+'<\u002Ftr><\u002Ftbody><\u002Ftable>';\n  wrap.innerHTML=head;\n  var note=document.createElement('div'); note.className='note'; note.style.margin='0';\n  note.innerHTML='Leave a cell blank if that PEO was not measured for that cohort. Target '+tgt+'% applies to every cell saved here.';\n  body.appendChild(note); body.appendChild(wrap);\n  $('mSave').textContent='Save round';\n  $('mSave').onclick=function(){\n    var cov={};\n    body.querySelectorAll('input[data-cov]').forEach(function(inp){\n      var b=inp.dataset.batch; cov[b]=cov[b]||{}; cov[b][inp.dataset.cov]= inp.value===''?'':Number(inp.value);\n    });\n    var added=0, updated=0;\n    body.querySelectorAll('input[data-peo]').forEach(function(inp){\n      if(inp.value==='') return;\n      var code=inp.dataset.peo, batch=inp.dataset.batch;\n      var c=cohorts.filter(function(x){return x.batch===batch;})[0]||{};\n      var rec={peo:code, batch:batch, gradYear:c.gradYear||'', assessYear:yr, target:tgt, actual:Number(inp.value),\n        alumniN:(cov[batch]||{}).alumniN||'', rate:(cov[batch]||{}).rate||'', employerN:(cov[batch]||{}).employerN||''};\n      var ex=state.peoRecords.filter(function(r){ return r.peo===code && String(r.batch)===batch && String(r.assessYear)===yr; })[0];\n      if(ex){ Object.assign(ex,rec); updated++; }\n      else { state.peoRecords.push(Object.assign({id:uid('pr'),link:'',remarks:''},rec)); added++; }\n    });\n    if(!added&&!updated){ toast('Nothing entered','err'); return; }\n    save(); closeModal(); refresh();\n    toast('Survey round saved \\u2014 '+added+' added, '+updated+' updated');\n  };\n}\n\n/* ---------------- CSV helpers, templates, import / export ---------------- */\nvar PEO_COLS=['peo','batch','gradYear','assessYear','target','actual','alumniRespondents','responseRate','employerRespondents','link','remarks'];\nvar CQI_COLS=['loop','outcome','cycle','cohort','finding','rootCause','action','owner','targetDate','status','committee','meetingRef','meetingDate','annexure','opened','closed','verification'];\nfunction csvCell(v){ v=(v==null?'':String(v)); return /[\",\\n\\r]/.test(v)? '\"'+v.replace(/\"/g,'\"\"')+'\"' : v; }\nfunction toCsv(rows){ return rows.map(function(r){ return r.map(csvCell).join(','); }).join('\\r\\n'); }\nfunction parseCsv(text){\n  var rows=[], row=[], cur='', q=false;\n  text=String(text).replace(/^\\uFEFF/,'');\n  for(var i=0;i<text.length;i++){\n    var ch=text[i];\n    if(q){\n      if(ch==='\"'){ if(text[i+1]==='\"'){ cur+='\"'; i++; } else q=false; }\n      else cur+=ch;\n    }else{\n      if(ch==='\"') q=true;\n      else if(ch===','){ row.push(cur); cur=''; }\n      else if(ch==='\\n'){ row.push(cur); cur=''; rows.push(row); row=[]; }\n      else if(ch!=='\\r') cur+=ch;\n    }\n  }\n  if(cur!==''||row.length){ row.push(cur); rows.push(row); }\n  return rows.filter(function(r){ return r.some(function(c){ return String(c).trim()!==''; }); });\n}\nfunction downloadText(name,text,mime){\n  var b=new Blob([text],{type:mime||'text/plain'});\n  var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name;\n  document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){URL.revokeObjectURL(a.href);},2000);\n}\nfunction peoTemplate(){\n  var codes=state.peos.map(function(p){return p.code;});\n  if(!codes.length) codes=['PEO1','PEO2','PEO3','PEO4'];\n  var yr=new Date().getFullYear();\n  var rows=[PEO_COLS];\n  codes.forEach(function(c){ rows.push([c,'Batch 36',yr-5,yr-1,state.cfg.peoTarget,'',52,43,18,'','']); });\n  downloadText((state.program.code||'program')+'_PEO-attainment-template.csv', toCsv(rows), 'text/csv');\n  toast('PEO template downloaded \\u2014 fill the actual % column and import it back');\n}\nfunction cqiTemplate(){\n  var cy=curCycle();\n  var rows=[CQI_COLS];\n  rows.push(['PO', (plosSorted()[0]||{code:'PLO1'}).code, cy?cy.semester:'Spring 2026', cy?(cy.cohort||''):'', 'Attained 38% against a target of 50%.', 'Insufficient design-of-experiments practice in the year-4 lab sequence.', 'Revise the investigation rubric and add a DoE module.', state.program.coordinator||'OBE Coordinator', '', 'Identified', 'Academic Committee', '', '', 'H', todayISO(), '', '']);\n  downloadText((state.program.code||'program')+'_CQI-register-template.csv', toCsv(rows), 'text/csv');\n  toast('CQI template downloaded \\u2014 one row per action, then import it back');\n}\nfunction peoExport(kind){\n  if(!state.peoRecords.length){ toast('No PEO records to export','err'); return; }\n  if(kind==='json'){ downloadText((state.program.code||'program')+'_PEO-attainment.json', JSON.stringify(state.peoRecords,null,2), 'application/json'); }\n  else{\n    var rows=[PEO_COLS];\n    state.peoRecords.forEach(function(r){ rows.push([r.peo,r.batch,r.gradYear,r.assessYear,r.target,r.actual,r.alumniN,r.rate,r.employerN,r.link,r.remarks]); });\n    downloadText((state.program.code||'program')+'_PEO-attainment.csv', toCsv(rows), 'text/csv');\n  }\n  toast('PEO records exported');\n}\nfunction cqiExport(kind){\n  if(!state.cqi.length){ toast('No CQI actions to export','err'); return; }\n  if(kind==='json'){ downloadText((state.program.code||'program')+'_CQI-register.json', JSON.stringify(state.cqi,null,2), 'application/json'); }\n  else{\n    var rows=[CQI_COLS];\n    state.cqi.forEach(function(a){ rows.push([a.loop||'PO',a.outcome,a.cycle,a.cohort,a.finding,a.rootCause,a.action,a.owner,a.targetDate,a.status,a.committee,a.meetingRef,a.meetingDate,a.annexure,a.opened,a.closedDate,a.verifyNote]); });\n    downloadText((state.program.code||'program')+'_CQI-register.csv', toCsv(rows), 'text/csv');\n  }\n  toast('CQI register exported');\n}\nfunction importRows(kind,file){\n  var rd=new FileReader();\n  rd.onload=function(){\n    var txt=String(rd.result), list=[];\n    try{\n      if(/^\\s*[\\[{]/.test(txt)){\n        var j=JSON.parse(txt);\n        list=Array.isArray(j)? j : (Array.isArray(j[kind])? j[kind] : (Array.isArray(j.peo)&&kind==='peo'? j.peo : (Array.isArray(j.cqi)&&kind==='cqi'? j.cqi : [])));\n        if(!list.length) throw new Error('no rows found in the JSON');\n      }else{\n        var rows=parseCsv(txt);\n        if(rows.length<2) throw new Error('the CSV has no data rows');\n        var head=rows[0].map(function(h){ return String(h).trim(); });\n        list=rows.slice(1).map(function(r){ var o={}; head.forEach(function(h,i){ o[h]=String(r[i]==null?'':r[i]).trim(); }); return o; });\n      }\n    }catch(e){ toast('Could not read the file: '+(e.message||e),'err'); return; }\n    var added=0, updated=0, skipped=0;\n    if(kind==='feedback'){\n      list.forEach(function(o){\n        var ch=String(o.channel||'').trim();\n        if(!ch){ skipped++; return; }\n        var rec={channel:ch, instrument:o.instrument||'', cycle:o.cycle||'', respondents:o.respondents||'', rate:o.rate||'',\n          findings:o.findings||'', usedIn:o.usedIn||'', annexure:o.annexure||'H'};\n        if(!rec.instrument && !rec.findings && !String(rec.respondents)){ skipped++; return; }\n        var exf=state.feedback.filter(function(x){ return x.channel===rec.channel && String(x.cycle||'')===String(rec.cycle||'') && String(x.instrument||'')===String(rec.instrument||''); })[0];\n        if(exf){ Object.assign(exf,rec); updated++; } else { state.feedback.push(Object.assign({id:uid('fb')},rec)); added++; }\n      });\n    }\n    else if(kind==='peo'){\n      var codes=state.peos.map(function(p){return p.code;});\n      list.forEach(function(o){\n        var code=String(o.peo||o.code||'').trim();\n        if(!code || (codes.length && codes.indexOf(code)===-1)){ skipped++; return; }\n        var rec={peo:code, batch:o.batch||'', gradYear:o.gradYear||'', assessYear:o.assessYear||'',\n          target:(o.target===''||o.target==null)?state.cfg.peoTarget:o.target, actual:o.actual==null?'':o.actual,\n          alumniN:o.alumniRespondents!=null?o.alumniRespondents:(o.alumniN||''), rate:o.responseRate!=null?o.responseRate:(o.rate||''),\n          employerN:o.employerRespondents!=null?o.employerRespondents:(o.employerN||''), link:o.link||'', remarks:o.remarks||''};\n        var ex=state.peoRecords.filter(function(x){ return x.peo===rec.peo && String(x.batch||'')===String(rec.batch||'') && String(x.assessYear||'')===String(rec.assessYear||''); })[0];\n        if(ex){ Object.assign(ex,rec); updated++; } else { state.peoRecords.push(Object.assign({id:uid('pr')},rec)); added++; }\n      });\n    }else{\n      list.forEach(function(o){\n        var code=String(o.outcome||'').trim();\n        if(!code){ skipped++; return; }\n        var rec={outcome:code, loop:o.loop||'PO', committee:o.committee||'', meetingRef:o.meetingRef||'', meetingDate:o.meetingDate||'', annexure:o.annexure||'H',\n          cycle:o.cycle||'', cohort:o.cohort||'', finding:o.finding||'', rootCause:o.rootCause||'',\n          action:o.action||'', owner:o.owner||'', targetDate:o.targetDate||'', status:o.status||'Identified',\n          opened:o.opened||todayISO(), closedDate:o.closed||o.closedDate||'', verifyNote:o.verification||o.verifyNote||'',\n          src: state.plos.some(function(p){return p.code===code;})?'PLO':(state.peos.some(function(p){return p.code===code;})?'PEO':'Manual')};\n        var ex=state.cqi.filter(function(x){ return x.outcome===rec.outcome && String(x.cycle||'')===String(rec.cycle||''); })[0];\n        if(ex){ Object.assign(ex,rec); updated++; } else { state.cqi.push(Object.assign({id:uid('cq')},rec)); added++; }\n      });\n    }\n    save(); refresh();\n    toast(added+' added, '+updated+' updated'+(skipped?', '+skipped+' skipped (unknown code)':''));\n  };\n  rd.onerror=function(){ toast('Could not read the file','err'); };\n  rd.readAsText(file);\n}\n\nfunction editPeoRec(i,preCode){\n  var row= i>-1? state.peoRecords[i]:null;\n  var codes=state.peos.map(function(p){return p.code;});\n  if(!codes.length){ toast('Define PEOs first','err'); return; }\n  modal(row?'Edit PEO record':'Record PEO attainment',[\n    {key:'peo',label:'PEO',type:'select',options:codes,value:row?row.peo:(preCode||codes[0])},\n    {key:'batch',label:'Alumni cohort / batch',value:row?row.batch:'',placeholder:'e.g. Batch 36'},\n    {key:'gradYear',label:'Graduation year',type:'number',val  or three sentences in formal institutional English suitable for a self-assessment report. Do not propose course-level CLO interventions \\u2014 those belong to the course teachers.';\n  modal('AI helper prompt',[{type:'html',html:'Copy this into Claude or any AI tool, then paste the useful parts into each CQI entry. It carries your live attainment data \\u2014 no student data.'}],{saveLabel:'Copy',\n    onSave:function(){ navigator.clipboard.writeText(p).then(function(){ toast('Prompt copied'); closeModal(); },function(){ toast('Copy failed \\u2014 select the text manually','err'); }); }});\n  var ta=document.createElement('textarea'); ta.className='mono'; ta.style.minHeight='240px'; ta.readOnly=true; ta.value=p;\n  $('mBody').appendChild(ta);\n}\n\n/* ---------------- Loop closure ---------------- */\nfunction renderLoop(){\n  var el=$('tab-loop');\n  var rows=state.cqi.filter(function(a){ return a.src!=='PEO'; });\n  var h='<div class=\"card\"><h2>Loop closure \\u2014 did the actions work?'+subTag('5.4')+'<\u002Fh2>'+\n    '<p class=\"hint\">Each action is checked against the outcome\\u2019s attainment in the cycle after it was raised. This is the evidence accreditors ask for.<\u002Fp>';\n  if(!rows.length){ h+='<div class=\"empty\">No PLO-linked CQI actions yet.<\u002Fdiv><\u002Fdiv>'; el.innerHTML=h; return; }\n  h+='<div class=\"tbl-wrap\"><table class=\"tbl\"><thead><tr><th>Outcome<\u002Fth><th>Raised<\u002Fth><th>Action<\u002Fth><th>Status<\u002Fth><th>At raising<\u002Fth><th>Next cycle<\u002Fth><th>Change<\u002Fth><th>Verdict<\u002Fth><th><\u002Fth><\u002Ftr><\u002Fthead><tbody>';\n  rows.forEach(function(a){\n    var i=state.cqi.indexOf(a), ver=verifyInfo(a);\n    var pl=state.plos.filter(function(p){return p.code===a.outcome;})[0];\n    var cs=cycles(), idx=-1; cs.forEach(function(c,k){ if(c.semester===a.cycle) idx=k; });\n    var v0= (pl&&idx>-1)? combinedOf(cs[idx],pl):null;\n    var v1= (pl&&idx>0)? combinedOf(cs[idx-1],pl):null;\n    h+='<tr><td><span class=\"chip\">'+esc(a.outcome)+'<\u002Fspan><\u002Ftd><td>'+esc(a.cycle||'\\u2014')+'<\u002Ftd>'+\n      '<td style=\"max-width:280px\">'+esc((a.action||a.finding||'').slice(0,150))+'<\u002Ftd>'+\n      '<td>'+esc(a.status)+'<\u002Ftd><td>'+(v0==null?'\\u2014':v0+'%')+'<\u002Ftd><td>'+(v1==null?'<span style=\"color:var(--muted)\">awaiting next cycle<\u002Fspan>':v1+'%')+'<\u002Ftd>'+\n      '<td>'+(ver? (ver.delta>=0?'<span class=\"cell-ok\">+'+ver.delta+'<\u002Fspan>':'<span class=\"cell-bad\">'+ver.delta+'<\u002Fspan>'):'\\u2014')+'<\u002Ftd>'+\n      '<td>'+(!ver? '<span class=\"pill p-mut\">pending<\u002Fspan>' : (ver.meets? '<span class=\"pill p-ok\">target met<\u002Fspan>' : (ver.improved? '<span class=\"pill p-warn\">improving<\u002Fspan>':'<span class=\"pill p-bad\">no improvement<\u002Fspan>')))+'<\u002Ftd>'+\n      '<td>'+(a.status!=='Closed'? '<button class=\"btn small\" onclick=\"closeLoop('+i+')\">Verify &amp; close<\u002Fbutton>':'<span class=\"pill p-ok\">closed<\u002Fspan>')+'<\u002Ftd><\u002Ftr>';\n  });\n  h+='<\u002Ftbody><\u002Ftable><\u002Fdiv>'+\n    '<div class=\"note\"><b>Reading this table.<\u002Fb> \\u201cNo improvement\\u201d is not a failure of the process \\u2014 it is a signal to revise the action or look for a different root cause. Record that reasoning in the CQI entry before closing.<\u002Fdiv><\u002Fdiv>';\n  el.innerHTML=h;\n}\n\n/* ---------------- Reports & IQAC return ---------------- */\nfunction renderReports(){\n  var el=$('tab-reports'), cy=curCycle();\n  el.innerHTML='<div class=\"card\"><h2>IQAC QA return<\u002Fh2>'+\n    '<p class=\"hint\">One small JSON file for the IQAC Portal \\u2014 aggregates only. In the portal: Program QA \\u2192 your program \\u2192 PLO attainment \\u2192 Import JSON return.<\u002Fp>'+\n    '<div class=\"btn-row\" style=\"margin-top:0\"><button class=\"btn\" onclick=\"exportReturn()\">Download QA return<\u002Fbutton>'+\n    '<button class=\"btn secondary\" onclick=\"previewReturn()\">Preview<\u002Fbutton><\u002Fdiv>'+\n    '<textarea class=\"mono\" id=\"retPrev\" style=\"display:none;margin-top:12px;min-height:200px\" readonly><\u002Ftextarea>'+\n    '<div class=\"note\"><b>Schema v2.<\u002Fb> Contains: framework version, cycle and cohort, survey coverage, per-PO target/direct/indirect, the PO assessment dossier (WK/WP/EA, method, criteria, expected level), attainment at graduation with transfer students, Criterion 1 narrative and stakeholders, the four feedback channels, the three-loop CQI register with its committee decision trail, capstones, D/W/C items and the self-audit. No student data.<\u002Fdiv><\u002Fdiv>'+\n    '<div class=\"card\"><h2>Accreditation-related Documents<\u002Fh2><p class=\"hint\">For PSAC/FQAC meetings, the self-assessment report and its supporting annexures.<\u002Fp>'+\n    '<div class=\"btn-row\" style=\"margin-top:0\">'+\n    '<button class=\"btn\" onclick=\"exportSarPack()\">SAR Pack<\u002Fbutton>'+\n    '<button class=\"btn secondary\" onclick=\"cqiPrompt()\">AI narrative prompt<\u002Fbutton>'+\n    '<button class=\"btn secondary\" onclick=\"downloadSarWord()\">SAR Pack (Word .doc)<\u002Fbutton>'+\n    '<button class=\"btn secondary\" onclick=\"exportAnnexTable()\">Table of Annexures<\u002Fbutton>'+\n    '<button class=\"btn secondary\" onclick=\"printAttainDoc()\">PLO attainment report<\u002Fbutton>'+\n    '<button class=\"btn secondary\" onclick=\"printCqi()\">CQI register (Annex H)<\u002Fbutton>'+\n    '<button class=\"btn secondary\" onclick=\"showMigration()\">V2.1 \\u2192 V3.0 migration notes<\u002Fbutton><\u002Fdiv>'+\n    (cy?'<div class=\"note\">Current cycle: <b>'+esc(cy.semester)+'<\u002Fb>'+(cy.cohort?' \\u00b7 '+esc(cy.cohort):'')+' \\u00b7 '+(cy.courses||[]).length+' course(s).<\u002Fdiv>':'<div class=\"note\">No cycle loaded yet.<\u002Fdiv>')+\n    '<\u002Fdiv>';\n}\nfunction buildReturn(){\n  var cy=curCycle();\n  if(!state.program.code) throw new Error('Set the program code in Program Info');\n  if(!cy) throw new Error('No evaluation cycle loaded');\n  if(!cy.cohort) throw new Error('Enter the Cohort (Batch) for this cycle');\n  var plo=[];\n  plosSorted().forEach(function(pl){\n    var d=directOf(cy,pl); if(d==null) return;\n    plo.push({code:pl.code, target:targetFor(cy,pl), direct:d, indirect:indirectOf(cy,pl)});\n  });\n  if(!plo.length) throw new Error('No computable PLO figures \\u2014 load course files first');\n  var peo=state.peoRecords.map(function(r){\n    return {code:r.peo, batch:r.batch, gradYear:r.gradYear===''?null:Number(r.gradYear), assessYear:r.assessYear===''?null:Number(r.assessYear),\n      target:r.target===''?null:Number(r.target), actual:r.actual===''?null:Number(r.actual),\n      alumniRespondents:r.alumniN===''?null:Number(r.alumniN), responseRate:r.rate===''?null:Number(r.rate),\n      employerRespondents:r.employerN===''?null:Number(r.employerN), link:r.link||'', remarks:r.remarks||''};\n  });\n  var cqi=state.cqi.map(function(a){\n    return {outcome:a.outcome, loop:a.loop||'PO', cycle:a.cycle, finding:a.finding, rootCause:a.rootCause||'', action:a.action||'',\n      owner:a.owner||'', status:a.status, opened:a.opened||'', targetDate:a.targetDate||'', closed:a.closedDate||'',\n      committee:a.committee||'', meetingRef:a.meetingRef||'', meetingDate:a.meetingDate||'', annexure:a.annexure||'H',\n      remarks:a.verifyNote||''};\n  });\n  var dossier=plosSorted().map(function(p){\n    return {code:p.code, label:p.label||'', domain:p.domain||'', peos:(p.peos||[]).slice(),\n      wk:(p.wk||[]).slice(), wp:(p.wp||[]).slice(), ea:(p.ea||[]).slice(), sdg:(p.sdg||[]).slice(),\n      method:p.method||'', criteria:p.criteria||'', expected:p.expected||'', notAssessed:!!p.notAssessed, annexure:p.annexure||'D'};\n  });\n  var gradCohort=view.gradCohort||(cohortsList().slice(-1)[0]||'');\n  var grad=null;\n  if(gradCohort && gradCyclesOf(gradCohort).length){\n    var g0=gradCyclesOf(gradCohort)[0];\n    grad={cohort:gradCohort, cycles:gradCyclesOf(gradCohort).map(function(c){return c.semester;}),\n      plo:plosSorted().map(function(pl){\n        return {code:pl.code, atGraduation:gradRollup(gradCohort,pl,false), transfer:gradRollup(gradCohort,pl,true), target:targetFor(g0,pl)};\n      })};\n  }\n  return {format:'aust-iqac-qa-return', version:2, frameworkVersion:state.program.frameworkVersion||'BAETE V3.0',\n    program:state.program.code, semester:cy.semester, cohort:cy.cohort,\n    dossier:dossier, graduation:grad,\n    crit1:{vision:{institution:state.crit1.instVision||'', department:state.crit1.deptVision||''},\n      mission:{institution:state.crit1.instMission||'', department:state.crit1.deptMission||''},\n      alignment:state.crit1.alignment||'', peoProcess:state.crit1.peoProcess||'',\n      dissemination:state.crit1.dissemination||'', resourceRealism:state.crit1.resourceRealism||'',\n      trackingProcess:state.crit1.trackingProcess||'',\n      peoMeasurement:state.peos.map(function(p){ return {code:p.code, statement:p.statement||'', method:p.method||'', tool:p.tool||'', criteria:p.criteria||'', tracking:p.tracking||'', missionLink:p.missionLink||'', annexure:p.annexure||'C'}; }),\n      stakeholders:state.stakeholders.map(function(s){ return {group:s.group||'', name:s.name||'', role:s.role||'', lastConsulted:s.last||''}; })},\n    crit5:{qaSystem:state.crit5.qaSystem||'', studentFeedback:state.crit5.studentFeedback||''},\n    feedback:state.feedback.map(function(f){ return {channel:f.channel||'', instrument:f.instrument||'', cycle:f.cycle||'',\n      respondents:f.respondents===''?null:Number(f.respondents), responseRate:f.rate===''?null:Number(f.rate),\n      findings:f.findings||'', usedIn:f.usedIn||'', annexure:f.annexure||'H'}; }),\n    capstones:state.capstones.map(function(c){ return {title:c.title||'', supervisor:c.supervisor||'', groupSize:c.groupSize===''?null:Number(c.groupSize), cycle:c.cycle||'', pos:c.pos||'', wp:c.wp||'', ea:c.ea||''}; }),\n    dwc:state.dwc.map(function(d){ return {type:d.type||'', criterion:d.criterion||'', statement:d.statement||'', remedial:d.remedial||'', annexure:d.annexure||'B', status:d.status||'Open'}; }),\n    selfAudit:AUDIT_ITEMS.map(function(it){ var a=auditState(it[0]); return {ref:it[0], criterion:it[1], subCriterion:it[2], policy:a.policy||'', practice:a.practice||'', improvement:a.improve||'', deviation:a.deviation||''}; }),\n    survey:{respondents: cy.srvN===''||cy.srvN==null?null:Number(cy.srvN), responseRate: cy.srvRate===''||cy.srvRate==null?null:Number(cy.srvRate)},\n    plo:plo, peo:peo, cqi:cqi,\n    meta:{generatedBy:'OBE Program Manager v1.10', generatedAt:new Date().toISOString(),\n      rollup:'credit-weighted average of course-level PO attainment; combined = '+state.cfg.wDirect+'% direct + '+state.cfg.wIndirect+'% indirect',\n      coordinator:state.program.coordinator||'', evidenceLink:cy.link||'',\n      courses:(cy.courses||[]).map(function(c){ return {code:c.code, section:c.section, credit:c.credit, students:c.students}; })}};\n}\nfunction previewReturn(){\n  try{ var ta=$('retPrev'); ta.value=JSON.stringify(buildReturn(),null,2); ta.style.display='block'; }\n  catch(e){ toast(e.message||String(e),'err'); }\n}\nfunction exportReturn(){\n  try{\n    var o=buildReturn();\n    download(o.program+'_'+String(o.semester).replace(/\\s+/g,'')+'_qa-return.json', JSON.stringify(o,null,2));\n    toast('QA return downloaded \\u2014 send it to IQAC');\n  }catch(e){ toast(e.message||String(e),'err'); }\n}\nfunction download(name,text){\n  var b=new Blob([text],{type:'application/json'});\n  var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name;\n  document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){URL.revokeObjectURL(a.href);},2000);\n}\nfunction docShell(title, body){\n  var w=window.open('','_blank');\n  if(!w){ toast('Popup blocked \\u2014 allow popups','err'); return; }\n  w.document.write('<!DOCTYPE html><html><head><meta charset=\"utf-8\"><title>'+esc(title)+'<\u002Ftitle><style>'+\n    'body{font-family:Arial,Helvetica,sans-serif;font-size:12.5px;color:#1f2d3d;margin:34px;line-height:1.45}'+\n    'h1{font-size:17px;margin:0 0 3px} h2{font-size:13px;margin:20px 0 6px;color:#31285f;border-bottom:1px solid #ccd;padding-bottom:3px}'+\n    '.sub{color:#666;font-size:11.5px;margin-bottom:14px}'+\n    'table{width:100%;border-collapse:collapse;margin-top:6px} th,td{border:1px solid #bbb;padding:6px 8px;text-align:left;vertical-align:top}'+\n    'th{background:#eceaf8;font-size:11px;text-transform:uppercase;letter-spacing:.4px} td.c{text-align:center}'+\n    '.sig{display:flex;gap:36px;margin-top:36px} .sig div{flex:1;border-top:1px solid #555;padding-top:5px;font-size:11.5px;text-align:center}'+\n    '.note{background:#f4f6f8;border:1px solid #dde;padding:8px 11px;font-size:11px;margin-top:14px}'+\n    '.noprint{margin-bottom:14px} @media print{.noprint{display:none}}'+\n    '<\u002Fstyle><\u002Fhead><body><div class=\"noprint\"><button onclick=\"window.print()\" style=\"padding:7px 16px;font-size:13px;cursor:pointer\">Print / save as PDF<\u002Fbutton><\u002Fdiv>'+body+'<\u002Fbody><\u002Fhtml>');\n  w.document.close();\n}\nfunction printCqi(){\n  var p=state.program;\n  var rows=state.cqi.slice().sort(function(a,b){ return String(a.outcome).localeCompare(String(b.outcome)); });\n  var body='<h1>Continuous Quality Improvement (CQI) Register<\u002Fh1>'+\n    '<div class=\"sub\">'+esc(p.name||'')+' ('+esc(p.code||'')+') \\u00b7 '+esc(p.dept||'')+' \\u00b7 framework: '+esc(p.framework||'')+' \\u00b7 generated '+new Date().toLocaleDateString('en-GB')+'<\u002Fdiv>'+\n    '<h2>Section A \\u2014 CQI actions (PLO / PEO level)<\u002Fh2>'+\n    '<table><thead><tr><th>Outcome<\u002Fth><th>Cycle<\u002Fth><th>Finding<\u002Fth><th>Root cause<\u002Fth><th>Action<\u002Fth><th>Owner<\u002Fth><th>Status<\u002Fth><th>Closure evidence<\u002Fth><\u002Ftr><\u002Fthead><tbody>';\n  if(!rows.length) body+='<tr><td colspan=\"8\" style=\"color:#888\">No CQI actions recorded.<\u002Ftd><\u002Ftr>';\n  rows.forEach(function(a){\n    body+='<tr><td>'+esc(a.outcome)+'<\u002Ftd><td>'+esc(a.cycle||'')+'<\u002Ftd><td>'+esc(a.finding||'')+'<\u002Ftd><td>'+esc(a.rootCause||'')+'<\u002Ftd>'+\n      '<td>'+esc(a.action||'')+'<\u002Ftd><td>'+esc(a.owner||'')+'<\u002Ftd><td>'+esc(a.status)+(a.closedDate?'<br>'+esc(a.closedDate):'')+'<\u002Ftd><td>'+esc(a.verifyNote||'')+'<\u002Ftd><\u002Ftr>';\n  });\n  body+='<\u002Ftbody><\u002Ftable>';\n  var lp=state.cqi.filter(function(a){ return verifyInfo(a); });\n  if(lp.length){\n    body+='<h2>Section B \\u2014 Loop closure evidence (next-cycle attainment)<\u002Fh2><table><thead><tr><th>Outcome<\u002Fth><th>Raised in<\u002Fth><th>Change<\u002Fth><th>Next-cycle result<\u002Fth><\u002Ftr><\u002Fthead><tbody>';\n    lp.forEach(function(a){ var v=verifyInfo(a); body+='<tr><td>'+esc(a.outcome)+'<\u002Ftd><td>'+esc(a.cycle)+'<\u002Ftd><td class=\"c\">'+(v.delta>=0?'+':'')+v.delta+'<\u002Ftd><td>'+v.text+'<\u002Ftd><\u002Ftr>'; });\n    body+='<\u002Ftbody><\u002Ftable>';\n  }\n  body+='<div class=\"note\">Scope: program-level (PLO/PO and PEO) continuous quality improvement. Course-level (CLO) assessment and improvement remain with the course teachers and are documented in the OBE Course Manager course reports.<\u002Fdiv>'+\n    '<div class=\"sig\"><div>Program OBE Coordinator<\u002Fdiv><div>Head of Department<\u002Fdiv><div>Received by IQAC<\u002Fdiv><\u002Fdiv>';\n  docShell('CQI Register \\u2014 '+(p.code||''), body);\n}\nfunction printAttainDoc(){\n  var cy=curCycle(); if(!cy){ toast('No cycle loaded','err'); return; }\n  var p=state.program;\n  var body='<h1>Program Learning Outcome Attainment Report<\u002Fh1>'+\n    '<div class=\"sub\">'+esc(p.name||'')+' ('+esc(p.code||'')+') \\u00b7 '+esc(cy.semester)+(cy.cohort?' \\u00b7 cohort '+esc(cy.cohort):'')+' \\u00b7 framework: '+esc(p.framework||'')+'<\u002Fdiv>'+\n    '<h2>Section A \\u2014 Attainment per PLO<\u002Fh2>'+\n    '<table><thead><tr><th>PLO<\u002Fth><th>Short label<\u002Fth><th class=\"c\">Target %<\u002Fth><th class=\"c\">Direct %<\u002Fth><th class=\"c\">Indirect %<\u002Fth><th class=\"c\">Combined %<\u002Fth><th class=\"c\">Result<\u002Fth><\u002Ftr><\u002Fthead><tbody>';\n  plosSorted().forEach(function(pl){\n    var d=directOf(cy,pl), i=indirectOf(cy,pl), cb=combinedOf(cy,pl), t=targetFor(cy,pl);\n    body+='<tr><td>'+esc(pl.code)+'<\u002Ftd><td>'+esc(pl.label||'')+'<\u002Ftd><td class=\"c\">'+t+'<\u002Ftd><td class=\"c\">'+(d==null?'\\u2014':d)+'<\u002Ftd>'+\n      '<td class=\"c\">'+(i==null?'\\u2014':i)+'<\u002Ftd><td class=\"c\">'+(cb==null?'\\u2014':cb)+'<\u002Ftd><td class=\"c\">'+(cb==null?'no data':(cb>=t?'Met':'Below target'))+'<\u002Ftd><\u002Ftr>';\n  });\n  body+='<\u002Ftbody><\u002Ftable>'+\n    '<h2>Section B \\u2014 Courses contributing to this cycle<\u002Fh2><table><thead><tr><th>Course<\u002Fth><th>Title<\u002Fth><th class=\"c\">Credit<\u002Fth><th class=\"c\">Students<\u002Fth><th>POs addressed<\u002Fth><\u002Ftr><\u002Fthead><tbody>';\n  (cy.courses||[]).forEach(function(c){\n    body+='<tr><td>'+esc(c.code)+(c.section?' ('+esc(c.section)+')':'')+'<\u002Ftd><td>'+esc(c.title)+'<\u002Ftd><td class=\"c\">'+esc(c.credit)+'<\u002Ftd><td class=\"c\">'+esc(c.students)+'<\u002Ftd>'+\n      '<td>'+Object.keys(c.poAttain||{}).sort(function(a,b){return a-b;}).map(function(n){return 'PO'+n+' ('+c.poAttain[n]+'%)';}).join(', ')+'<\u002Ftd><\u002Ftr>';\n  });\n  body+='<\u002Ftbody><\u002Ftable>'+\n    '<div class=\"note\">Method: a student attains a CO when marks on that CO\\u2019s assessment items reach the course KPI threshold; course PO attainment is the mapping-weighted average of its COs; program PLO direct attainment is the credit-weighted average across courses. Combined = '+esc(state.cfg.wDirect)+'% direct + '+esc(state.cfg.wIndirect)+'% indirect (survey). Survey coverage: '+esc(cy.srvN||'\\u2014')+' respondents'+(cy.srvRate?' ('+esc(cy.srvRate)+'% response rate)':'')+'.<\u002Fdiv>'+\n    '<div class=\"sig\"><div>Program OBE Coordinator<\u002Fdiv><div>Head of Department<\u002Fdiv><div>Received by IQAC<\u002Fdiv><\u002Fdiv>';\n  docShell('PLO Attainment \\u2014 '+(p.code||''), body);\n}\n\n/* ---------------- Data & backup ---------------- */\nfunction renderData(){\n  var counts=state.cycles.reduce(function(s,c){return s+(c.courses||[]).length;},0);\n  $('tab-data').innerHTML='<div class=\"card\"><h2>Program file<\u002Fh2>'+\n    '<p class=\"hint\">Everything is stored in this browser. Download the program file to keep a backup, move to another computer, or hand over to the next coordinator.<\u002Fp>'+\n    '<div class=\"grid c4\" style=\"margin-bottom:6px\">'+\n      kpi('PLOs',state.plos.length,'defined','')+kpi('Cycles',state.cycles.length,counts+' course aggregates','')+\n      kpi('PEO records',state.peoRecords.length,'alumni cohorts','')+kpi('CQI actions',state.cqi.length,openCqi().length+' open','')+\n    '<\u002Fdiv>'+\n    '<div class=\"btn-row\"><button class=\"btn\" onclick=\"exportAll()\">Download program file (.json)<\u002Fbutton>'+\n    '<button class=\"btn secondary\" onclick=\"$(\\'impIn\\').click()\">Restore from file<\u002Fbutton>'+\n    '<button class=\"btn secondary\" onclick=\"loadSample()\">Load grand sample program<\u002Fbutton>'+\n    '<button class=\"btn danger\" onclick=\"wipe()\">Clear everything<\u002Fbutton><\u002Fdiv>'+\n    '<input type=\"file\" id=\"impIn\" accept=\".json\" style=\"display:none\">'+\n    '<div class=\"note\">Last saved: '+esc(state.updatedAt? new Date(state.updatedAt).toLocaleString():'never')+'. No student names, IDs or marks are ever stored in this file. <b>Grand sample:<\u002Fb> the sample program file shipped alongside this app (SAMPLE - ME Program) can be opened with <b>Restore from file<\u002Fb>, or generated in place with <b>Load grand sample program<\u002Fb> \\u2014 it fills every tab: program info, PEOs/PLOs and mapping, two cycles of CO attainments, survey figures, PLO and PEO attainment, and a CQI register with a closed, verified loop.<\u002Fdiv><\u002Fdiv>'+\n    '<div class=\"card\"><h2>How this fits together<\u002Fh2>'+\n    '<div class=\"note\" style=\"margin-top:0\"><b>Course teachers<\u002Fb> \\u2192 OBE Course Manager (CLOs, marks, course CQI) \\u2192 export course JSON.<br>'+\n    '<b>You, the Program OBE Coordinator<\u002Fb> \\u2192 this app: drop course files, review PLO attainment, run the CQI loop \\u2192 export the QA return.<br>'+\n    '<b>IQAC<\u002Fb> \\u2192 imports the QA return into the AUST IQAC Portal for program QA, accreditation evidence and reporting.<br><br>'+\n    'Student-level data never travels beyond the department \\u2014 the boundary is structural, not a policy promise.<\u002Fdiv><\u002Fdiv>';\n  $('impIn').onchange=function(e){\n    var f=e.target.files&&e.target.files[0]; if(!f) return;\n    var rd=new FileReader();\n    rd.onload=function(){\n      try{\n        var d=JSON.parse(String(rd.result));\n        if(!d.program||!d.plos) throw new Error('not a program file');\n        if(!confirm('Replace all current data with the contents of '+f.name+'?')) return;\n        state=d; load(); save(); refresh(); toast('Program file restored');\n      }catch(err){ toast('Could not restore: '+(err.message||err),'err'); }\n    };\n    rd.readAsText(f); e.target.value='';\n  };\n}\nfunction exportAll(){\n  download((state.program.code||'program')+'-obe-program-manager.json', JSON.stringify(state,null,2));\n  toast('Program file downloaded');\n}\nfunction startFresh(){\n  var has=state.cycles.length||state.cqi.length||state.plos.length||state.peoRecords.length;\n  if(has){\n    if(!confirm('Start a fresh program? Everything currently in this browser \\u2014 PLOs, cycles, PEO records and the CQI register \\u2014 will be removed.')) return;\n    if(confirm('Download a backup of the current data first?')) exportAll();\n  }\n  state=blank(); save(); view.tab='program'; refresh(); window.scrollTo(0,0);\n  toast('Fresh program \\u2014 start with Program Info');\n}\nfunction wipe(){\n  if(!confirm('Delete all program data from this browser? Download a backup first if you need one.')) return;\n  state=blank(); save(); refresh(); toast('Cleared');\n}\n\n\n/* ============================================================\n   BAETE V3.0 SAR support \\u2014 PO dossier, Criterion 1, stakeholder\n   feedback, graduating-cohort roll-up, annexures, DWC register,\n   capstones, self-audit and the SAR export pack.\n   Scope stays PO/PEO level: no course-level data is collected.\n   ============================================================ */\n\nvar ANNEX=[['A','Eligibility documentation'],['B','Last accreditation certificate & final statement'],['C','Criterion 1 \\u2014 Program Educational Objectives'],['D','Criterion 2 \\u2014 Program Outcomes and Assessment'],['E','Detailed course content'],['F','Criterion 3 \\u2014 Curriculum and Teaching-Learning'],['G','Criterion 4 \\u2014 Interactions with the Industry'],['H','Criterion 5 \\u2014 Continuous Quality Improvement'],['I','Criterion 6 \\u2014 Students'],['J','Faculty curriculum vitae'],['K','Criterion 7 \\u2014 Faculty']];\nvar ANNEX_CODES=ANNEX.map(function(a){return a[0];});\nvar LOOPS=['PEO','PO','Course & Curriculum'];\nvar CHANNELS=['Students','Faculty members','Alumni','Employers'];\nvar AUDIT_ITEMS=[\n  ['C1-i','1','Published PEOs are clear, concise, assessable and realistic within available resources'],\n  ['C1-ii','1','PEOs are consistent with the vision and mission of the institution / department'],\n  ['C1-iii','1','An established system compiles PEO attainment, including tracking of graduates and employers'],\n  ['C2-i','2','The process of defining POs is described; POs are substantially equivalent to the twelve BAETE POs'],\n  ['C2-ii','2','Each course has clear quality requirements and facilitates CO achievement through teaching-learning and assessment'],\n  ['C2-iii','2','Lecture plans, COs, content, books, grading policy, assessment tools, student work samples and CO attainment are available'],\n  ['C2-iv','2','Students\\u2019 academic performance is continuously monitored to ensure outcome achievement'],\n  ['C2-v','2','Direct methods demonstrate that students attain all POs by graduation'],\n  ['C5-i','5','A functional quality assurance system exists under an institutional framework'],\n  ['C5-ii','5','Concerns, weaknesses and deficiencies from the last review are addressed'],\n  ['C5-iii','5','Students receive periodic feedback on their academic performance from course teachers'],\n  ['C5-iv','5','PEO CQI findings are evaluated and used to refine and improve the program'],\n  ['C5-v','5','POs are assessed on a regular cycle and reviewed with stakeholder feedback'],\n  ['C5-vi','5','Curriculum and teaching quality are evaluated regularly using faculty, student and stakeholder feedback']\n];\n\nfunction tickList(list, chosen, name, cols){\n  chosen=chosen||[];\n  return '<div style=\"display:grid;grid-template-columns:repeat('+(cols||1)+',minmax(0,1fr));gap:6px 16px\">'+\n    list.map(function(it){\n      var code=Array.isArray(it)?it[0]:it, desc=Array.isArray(it)?it[1]:'';\n      return '<label style=\"display:flex;gap:8px;align-items:flex-start;font-size:12.5px;line-height:1.4;cursor:pointer\">'+\n        '<input type=\"checkbox\" data-tick=\"'+esc(name)+'\" value=\"'+esc(code)+'\"'+(chosen.indexOf(code)>-1?' checked':'')+' style=\"margin-top:2px\">'+\n        '<span><b>'+esc(code)+'<\u002Fb>'+(desc?' <span style=\"color:var(--muted)\">'+esc(desc)+'<\u002Fspan>':'')+'<\u002Fspan><\u002Flabel>';\n    }).join('')+'<\u002Fdiv>';\n}\nfunction readTicks(name){\n  var out=[];\n  document.querySelectorAll('[data-tick=\"'+name+'\"]').forEach(function(cb){ if(cb.checked) out.push(cb.value); });\n  return out;\n}\nfunction sdgRequired(n){ return Number(n)===2; } /* SAR clause 2.7.2 */\nfunction dossierDone(p){\n  var n=num(p.code), need=3;\n  var got=(p.method?1:0)+(p.criteria?1:0)+(p.expected?1:0);\n  if(wpRequired(n)){ need++; if((p.wp||[]).length) got++; }\n  if(eaRequired(n)){ need++; if((p.ea||[]).length) got++; }\n  if(sdgRequired(n)){ need++; if((p.sdg||[]).length) got++; }\n  return {got:got, need:need, ok:got>=need};\n}\nfunction dossierPct(){\n  var ps=plosSorted(); if(!ps.length) return 0;\n  var g=0,n=0; ps.forEach(function(p){ var d=dossierDone(p); g+=d.got; n+=d.need; });\n  return n? Math.round(g/n*100):0;\n}\n\n/* ---------------- PO Dossier ---------------- */\nfunction renderDossier(){\n  var el=$('tab-dossier');\n  if(!state.plos.length){\n    el.innerHTML='<div class=\"card\"><div class=\"empty\">Load the PO set first on <b>Program Info<\u002Fb>.<\u002Fdiv><\u002Fdiv>';\n    return;\n  }\n  var pct=dossierPct(), lin=v3Lineage();\n  var h='<div class=\"card\"><h2>PO assessment dossier<\u002Fh2>'+\n    '<p class=\"hint\">SAR clauses 2.7.1\\u20132.7.13 ask the same questions of every outcome: how it is assessed, with what criteria and scale, what level is expected, and which Knowledge-Profile, Complex-Problem and Complex-Activity attributes it carries. Written once, edited rarely.<\u002Fp>'+\n    '<div class=\"grid c3\"><div class=\"kpi '+(pct>=100?'ok':pct>=50?'warn':'bad')+'\"><div class=\"cap\">Dossier completeness<\u002Fdiv><div class=\"val\">'+pct+'%<\u002Fdiv><div class=\"sub\">required fields across all POs<\u002Fdiv><\u002Fdiv>'+\n    '<div class=\"kpi\"><div class=\"cap\">Framework<\u002Fdiv><div class=\"val\" style=\"font-size:19px\">'+esc(state.program.frameworkVersion||'BAETE V3.0')+'<\u002Fdiv><div class=\"sub\">WP required for PO1\\u2013PO6 \\u00b7 EA for PO9<\u002Fdiv><\u002Fdiv>'+\n    '<div class=\"kpi\"><div class=\"cap\">Not yet assessed<\u002Fdiv><div class=\"val\">'+state.plos.filter(function(p){return p.notAssessed;}).length+'<\u002Fdiv><div class=\"sub\">declared openly in the SAR<\u002Fdiv><\u002Fdiv><\u002Fdiv>'+\n    '<div class=\"btn-row\"><button class=\"btn secondary\" onclick=\"go(\\'sar\\')\">Self-audit &amp; SAR export<\u002Fbutton>'+\n    '<button class=\"btn secondary\" onclick=\"showMigration()\">V2.1 \\u2192 V3.0 migration notes<\u002Fbutton><\u002Fdiv><\u002Fdiv>';\n\n  h+='<div class=\"card\"><h2>Outcomes<\u002Fh2><div class=\"tbl-wrap\"><table class=\"tbl\"><thead><tr><th style=\"width:64px\">PO<\u002Fth><th>Outcome<\u002Fth><th style=\"width:150px\">WK<\u002Fth><th style=\"width:130px\">WP / EA<\u002Fth><th style=\"width:110px\">Dossier<\u002Fth><th style=\"width:64px\"><\u002Fth><\u002Ftr><\u002Fthead><tbody>';\n  plosSorted().forEach(function(p){\n    var i=state.plos.indexOf(p), n=num(p.code), d=dossierDone(p);\n    var wpea=[];\n    if(wpRequired(n)) wpea.push((p.wp||[]).length? '<span class=\"chip\">WP '+(p.wp||[]).length+'<\u002Fspan>' : '<span class=\"pill p-bad\">WP missing<\u002Fspan>');\n    if(eaRequired(n)) wpea.push((p.ea||[]).length? '<span class=\"chip\">EA '+(p.ea||[]).length+'<\u002Fspan>' : '<span class=\"pill p-bad\">EA missing<\u002Fspan>');\n    if(sdgRequired(n)) wpea.push((p.sdg||[]).length? '<span class=\"chip\">SDG '+(p.sdg||[]).length+'<\u002Fspan>' : '<span class=\"pill p-bad\">SDG missing<\u002Fspan>');\n    if(!wpea.length) wpea.push('<span style=\"color:var(--muted)\">not required<\u002Fspan>');\n    h+='<tr><td><b>'+esc(poLabel(p.code))+'<\u002Fb>'+(p.notAssessed?'<div><span class=\"pill p-warn\">not assessed<\u002Fspan><\u002Fdiv>':'')+'<\u002Ftd>'+\n      '<td><b>'+esc(p.label||'')+'<\u002Fb><div style=\"font-size:12px;color:var(--muted)\">'+esc((p.statement||'').slice(0,120))+((p.statement||'').length>120?'\\u2026':'')+'<\u002Fdiv>'+\n      (lin[n]&&lin[n].from===null?'<div style=\"font-size:11.5px;color:var(--warn);margin-top:3px\">new in V3.0 \\u2014 no V2.1 predecessor<\u002Fdiv>':'')+'<\u002Ftd>'+\n      '<td>'+((p.wk||[]).length? (p.wk||[]).map(function(x){return '<span class=\"chip\">'+esc(x)+'<\u002Fspan>';}).join('') : '<span style=\"color:var(--muted)\">\\u2014<\u002Fspan>')+'<\u002Ftd>'+\n      '<td>'+wpea.join(' ')+'<\u002Ftd>'+\n      '<td>'+(d.ok? '<span class=\"pill p-ok\">complete<\u002Fspan>':'<span class=\"pill p-bad\">'+d.got+'/'+d.need+'<\u002Fspan>')+'<\u002Ftd>'+\n      '<td><button class=\"btn small secondary\" onclick=\"editDossier('+i+')\">Edit<\u002Fbutton><\u002Ftd><\u002Ftr>';\n    if(p.notAssessed){\n      var stray=cycles().some(function(cyx){ return (cyx.courses||[]).some(function(cc){ return cc.poAttain[n]!=null; }); });\n      if(stray) h+='<tr><td><\u002Ftd><td colspan=\"5\" style=\"color:var(--warn);font-size:12px;padding-top:0\">\\u26a0 Declared not yet assessed, but a course file still maps a CO to '+esc(poLabel(p.code))+'. Figures for it are suppressed everywhere \\u2014 remove the mapping or un-flag the outcome.<\u002Ftd><\u002Ftr>';\n    }\n  });\n  h+='<\u002Ftbody><\u002Ftable><\u002Fdiv>'+\n    '<div class=\"note\"><b>Expected level of attainment<\u002Fb> is not the same as the target percentage. BAETE asks what standard of performance counts as attainment (for example &ldquo;at least 60% of students score 3 of 4 on the design rubric&rdquo;); the target is the share of students that must reach it.<\u002Fdiv><\u002Fdiv>';\n  el.innerHTML=h;\n}\nfunction editDossier(i){\n  var p=state.plos[i]; if(!p) return;\n  var n=num(p.code);\n  modal('Dossier \\u2014 '+poLabel(p.code)+' '+(p.label||''),[\n    {key:'method',label:'Assessment methods and tools, with justification',type:'textarea',value:p.method||'',hint:'SAR: \\u201cState and justify the methods, tools, criteria and scale used in the assessment process.\\u201d'},\n    {key:'criteria',label:'Attainment criteria and scale',type:'textarea',value:p.criteria||''},\n    {key:'expected',label:'Expected level of attainment',type:'textarea',value:p.expected||'',hint:'The performance standard itself \\u2014 distinct from the target percentage.'},\n    {key:'prose',label:'SAR narrative for this outcome',type:'textarea',value:p.prose||'',hint:'Reused verbatim in the exported Criterion 2 pack. Summarise the results and how they demonstrate attainment.'},\n    {key:'annexure',label:'Annexure',type:'select',options:ANNEX_CODES,value:p.annexure||'D'},\n    {key:'notAssessed',label:'Not yet assessed by this program',type:'select',options:['No','Yes'],value:p.notAssessed?'Yes':'No',hint:'Declare openly rather than leaving a silent gap; a standing CQI action is raised automatically.'}\n  ],{\n    wide:true,\n    build:function(body){\n      var box=document.createElement('div');\n      box.innerHTML='<div style=\"border-top:1px solid var(--border);padding-top:12px\">'+\n        '<div style=\"font-weight:600;font-size:13px;margin-bottom:7px\">Knowledge Profile (WK) incorporated in this outcome<\u002Fdiv>'+\n        tickList(WK_LIST,p.wk,'wk',1)+\n        (wpRequired(n)? '<div style=\"font-weight:600;font-size:13px;margin:14px 0 7px\">Complex Engineering Problem attributes addressed <span class=\"pill p-info\">required for '+poLabel(p.code)+'<\u002Fspan><\u002Fdiv>'+tickList(WP_LIST,p.wp,'wp',1):'')+\n        (eaRequired(n)? '<div style=\"font-weight:600;font-size:13px;margin:14px 0 7px\">Complex Engineering Activity attributes addressed <span class=\"pill p-info\">required for PO9<\u002Fspan><\u002Fdiv>'+tickList(EA_LIST,p.ea,'ea',1):'')+\n        '<div style=\"font-weight:600;font-size:13px;margin:14px 0 7px\">UN Sustainable Development Goals considered'+(sdgRequired(n)?' <span class=\"pill p-info\">required for PO2, per clause 2.7.2<\u002Fspan>':'')+'<\u002Fdiv>'+\n        tickList(SDG_LIST,p.sdg,'sdg',2)+'<\u002Fdiv>';\n      body.appendChild(box);\n    },\n    onSave:function(v){\n      p.method=v.method; p.criteria=v.criteria; p.expected=v.expected; p.prose=v.prose; p.annexure=v.annexure;\n      p.notAssessed=(v.notAssessed==='Yes');\n      p.wk=readTicks('wk'); p.sdg=readTicks('sdg');\n      if(wpRequired(n)) p.wp=readTicks('wp');\n      if(eaRequired(n)) p.ea=readTicks('ea');\n      if(p.notAssessed) ensureNotAssessedAction(p);\n      save(); closeModal(); refresh(); toast('Dossier saved for '+poLabel(p.code));\n    }\n  });\n}\nfunction ensureNotAssessedAction(p){\n  var exists=state.cqi.some(function(a){ return a.outcome===p.code && a.loop==='PO' && /not yet assessed/i.test(a.finding||''); });\n  if(exists) return;\n  state.cqi.push({id:uid('cq'),src:'PLO',loop:'PO',outcome:p.code,cycle:'Standing',cohort:'',\n    finding:poLabel(p.code)+' ('+(p.label||'')+') is not yet assessed by the program. BAETE V3.0 requires attainment of every PO to be demonstrated by graduation.',\n    rootCause:'The outcome is new in BAETE ACC-MAN-02 V3.0 (effective 1 July 2025) and no assessment instrument existed under the superseded V2.1 outcome set.',\n    action:'Identify or create the course(s) carrying this outcome, define the assessment instrument and rubric with the PSAC, and report attainment from the next evaluation cycle.',\n    owner:state.program.coordinator||'Program OBE Coordinator', targetDate:'', status:'Identified',\n    committee:'', meetingRef:'', meetingDate:'', annexure:'D', evidence:'', verifyNote:'', opened:todayISO(), closedDate:''});\n}\nfunction ensurePo12Action(){ var p=state.plos.filter(function(x){return num(x.code)===12;})[0]; if(p&&p.notAssessed) ensureNotAssessedAction(p); }\nfunction showMigration(){\n  var lin=v3Lineage(), old=baeteV21Labels();\n  var w=window.open('','_blank'); if(!w){ toast('Allow popups to open the migration notes','err'); return; }\n  var rows=plosSorted().map(function(p){\n    var n=num(p.code), L=lin[n]||{};\n    return '<tr><td><b>'+poLabel(p.code)+'<\u002Fb> '+esc(p.label||'')+'<\u002Ftd><td>'+(L.from? esc(L.from)+(old[n]?'':''):'<b>none<\u002Fb>')+'<\u002Ftd><td>'+esc(L.note||'')+'<\u002Ftd><\u002Ftr>';\n  }).join('');\n  w.document.write('<!DOCTYPE html><html><head><meta charset=\"utf-8\"><title>BAETE V2.1 \\u2192 V3.0 migration \\u2014 '+esc(state.program.code||'')+'<\u002Ftitle>'+\n    '<style>body{font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#1b2b36;margin:34px;line-height:1.5}h1{font-size:18px;margin:0 0 4px}'+\n    '.sub{color:#667;font-size:12px;margin-bottom:16px}table{width:100%;border-collapse:collapse;margin-top:8px}'+\n    'th,td{border:1px solid #bbb;padding:7px 9px;text-align:left;vertical-align:top}th{background:#eef2f5;font-size:11px;text-transform:uppercase;letter-spacing:.4px}'+\n    '.note{background:#f4f7f9;border:1px solid #dde;padding:9px 12px;margin-top:16px;font-size:12px}<\u002Fstyle><\u002Fhead><body>'+\n    '<h1>BAETE V2.1 \\u2192 V3.0 outcome migration<\u002Fh1><div class=\"sub\">'+esc(state.program.name||state.program.code||'')+' \\u00b7 generated '+new Date().toLocaleDateString()+'<\u002Fdiv>'+\n    '<table><thead><tr><th style=\"width:34%\">V3.0 outcome<\u002Fth><th style=\"width:14%\">Continues<\u002Fth><th>What changed, and what it means for historical data<\u002Fth><\u002Ftr><\u002Fthead><tbody>'+rows+'<\u002Ftbody><\u002Ftable>'+\n    '<div class=\"note\">Attainment series recorded against a V2.1 outcome number are only comparable where the statement is substantially unchanged. Where an outcome was merged or is new, start a fresh series and say so in the SAR rather than presenting a continuous trend.<\u002Fdiv>'+\n    '<\u002Fbody><\u002Fhtml>');\n  w.document.close();\n}\n\nfunction crit1ExtrasHtml(id){\n  var c=state.crit1, h='';\n  if(id==='1.1'){\n    h+='<div class=\"grid c2\" style=\"margin-top:10px;grid-template-columns:1fr\">'+\n      taFld('Institution vision','crit1.instVision',c.instVision)+\n      taFld('Institution mission','crit1.instMission',c.instMission)+\n      taFld('Department / school vision','crit1.deptVision',c.deptVision)+\n      taFld('Department / school mission','crit1.deptMission',c.deptMission)+\n    '<\u002Fdiv>'+taFld('How the institutional and departmental missions are aligned','crit1.alignment',c.alignment);\n  }\n  if(id==='1.2'){\n    h+=taFld('Process of establishing the PEOs, and the stakeholders consulted \\u2014 industry included','crit1.peoProcess',c.peoProcess)+\n      taFld('How the PEOs are published and disseminated to each stakeholder group','crit1.dissemination',c.dissemination)+\n      taFld('Why the PEOs are realistic within available resources','crit1.resourceRealism',c.resourceRealism);\n    h+='<div style=\"margin-top:10px\"><b style=\"font-size:12.5px\">Stakeholders consulted<\u002Fb>';\n    if(!state.stakeholders.length) h+='<div class=\"empty\">No stakeholders recorded.<\u002Fdiv>';\n    else{\n      h+='<div class=\"tbl-wrap\"><table class=\"tbl\"><thead><tr><th>Group<\u002Fth><th>Name / body<\u002Fth><th>Role in PEO or curriculum review<\u002Fth><th>Last consulted<\u002Fth><th style=\"width:60px\"><\u002Fth><\u002Ftr><\u002Fthead><tbody>';\n      state.stakeholders.forEach(function(s,i){\n        h+='<tr><td><span class=\"chip\">'+esc(s.group||'\\u2014')+'<\u002Fspan><\u002Ftd><td>'+esc(s.name||'')+'<\u002Ftd><td>'+esc(s.role||'')+'<\u002Ftd><td>'+esc(s.last||'\\u2014')+'<\u002Ftd>'+\n          '<td><button class=\"btn small secondary\" onclick=\"editStakeholder('+i+')\">Edit<\u002Fbutton><\u002Ftd><\u002Ftr>';\n      });\n      h+='<\u002Ftbody><\u002Ftable><\u002Fdiv>';\n    }\n    h+='<div class=\"btn-row\" style=\"margin-top:6px\"><button class=\"btn small secondary\" onclick=\"editStakeholder(-1)\">+ Add stakeholder<\u002Fbutton><\u002Fdiv><\u002Fdiv>';\n  }\n  if(id==='1.3' && state.peos.length){\n    h+='<div style=\"margin-top:10px\"><b style=\"font-size:12.5px\">PEO \\u2194 mission consistency<\u002Fb><div class=\"tbl-wrap\"><table class=\"tbl\"><thead><tr><th style=\"width:64px\">PEO<\u002Fth><th>Statement<\u002Fth><th style=\"width:40%\">Consistency with the mission<\u002Fth><\u002Ftr><\u002Fthead><tbody>';\n    state.peos.forEach(function(p,i){\n      h+='<tr><td><b>'+esc(p.code)+'<\u002Fb><\u002Ftd><td style=\"font-size:12.5px\">'+esc(p.statement||'')+'<\u002Ftd>'+\n        '<td>'+(p.missionLink? esc(p.missionLink):'<span class=\"pill p-bad\">not stated<\u002Fspan>')+' <button class=\"btn s
