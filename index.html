document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\n<title>OBE Program Manager<\u002Ftitle>\n<link rel=\"icon\" href=\"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234B3F8F'/%3E%3Cpath d='M14 42h9V22h-9zm13 0h9V14h-9zm13 0h10V28H40z' fill='%23fff'/%3E%3C/svg%3E\">\n<script src=\"11acced0-faaf-45ae-b180-713f615ac3df\"><\u002Fscript>\n<style>\n:root{\n  --primary:#4b3f8f; --primary-dark:#31285f; --primary-light:#eceaf8;\n  --accent:#d98324; --bg:#f4f6f8; --card:#ffffff; --text:#1f2d3d; --muted:#6b7a8d;\n  --border:#dde4ea; --danger:#c0392b; --ok:#1e8e3e; --warn:#e67e22;\n  --radius:10px; --shadow:0 1px 3px rgba(16,36,52,.08),0 4px 14px rgba(16,36,52,.05);\n}\n*{box-sizing:border-box;margin:0;padding:0}\nbody{font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}\n.app-header{background:var(--primary);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}\n.app-header h1{font-size:19px;font-weight:600;letter-spacing:.2px}\n.header-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}\n.hsel{padding:7px 10px;border-radius:8px;border:none;font-size:14px;font-family:inherit;min-width:170px}\n.hchip{font-size:12px;background:rgba(255,255,255,.14);padding:6px 11px;border-radius:20px;white-space:nowrap}\n.tabs{display:flex;gap:2px;background:var(--primary-dark);padding:0 14px;overflow-x:auto}\n.tab-btn{background:transparent;border:none;color:#cdc7e8;padding:11px 15px;font-size:14px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;font-family:inherit}\n.tab-btn:hover{color:#fff}\n.tab-btn.active{color:#fff;border-bottom-color:var(--accent);font-weight:600}\nmain{max-width:1200px;margin:0 auto;padding:22px 18px 34px}\nsection.tab{display:none}\nsection.tab.active{display:block}\n.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:18px}\n.card h2{font-size:17px;margin-bottom:4px;color:var(--primary-dark)}\n.card h3{font-size:15px;margin:14px 0 8px;color:var(--primary-dark)}\n.card .hint{font-size:13px;color:var(--muted);margin-bottom:14px}\n.grid{display:grid;gap:12px}\n.grid.c2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}\n.grid.c3{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}\n.grid.c4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}\nlabel.fld{display:block;font-size:13px;color:var(--muted);font-weight:600}\nlabel.fld input,label.fld select,label.fld textarea{display:block;width:100%;margin-top:4px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;color:var(--text);background:#fff}\nlabel.fld textarea{resize:vertical;min-height:64px}\ninput:focus,select:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:0;border-color:var(--primary)}\n.btn{display:inline-block;background:var(--primary);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:14px;cursor:pointer;font-family:inherit;font-weight:600;white-space:nowrap}\n.btn:hover{background:var(--primary-dark)}\n.btn.secondary{background:#fff;color:var(--primary);border:1.5px solid var(--primary)}\n.btn.secondary:hover{background:var(--primary-light)}\n.btn.danger{background:#fff;color:var(--danger);border:1.5px solid var(--danger)}\n.btn.danger:hover{background:#fdf0ee}\n.btn.small{padding:5px 10px;font-size:12.5px}\n.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}\ntable.tbl{width:100%;border-collapse:collapse;font-size:14px;background:#fff}\ntable.tbl th{background:var(--primary-light);color:var(--primary-dark);text-align:left;padding:8px 10px;border:1px solid var(--border);font-size:13px;white-space:nowrap}\ntable.tbl td{padding:7px 10px;border:1px solid var(--border);vertical-align:top}\ntable.tbl tr:nth-child(even) td{background:#fafcfd}\n.tbl-wrap{overflow-x:auto}\n.tbl input.mini,.tbl select.mini{width:78px;padding:5px 7px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;text-align:center}\n.tbl input.wide{width:100%;padding:5px 7px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit}\n.kpi{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}\n.kpi .cap{font-size:12.5px;color:var(--muted);font-weight:600}\n.kpi .val{font-size:26px;font-weight:700;margin-top:6px;line-height:1}\n.kpi .sub{font-size:12px;color:var(--muted);margin-top:5px}\n.kpi.ok .val{color:var(--ok)} .kpi.bad .val{color:var(--danger)} .kpi.warn .val{color:var(--warn)}\n.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap}\n.p-ok{background:#e7f6ea;color:var(--ok)} .p-bad{background:#fdecea;color:var(--danger)}\n.p-warn{background:#fdf3e6;color:var(--warn)} .p-mut{background:#eef2f5;color:var(--muted)}\n.p-info{background:#e8f0f9;color:#2b6cb0}\n.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--primary-light);color:var(--primary-dark);margin:1px 3px 1px 0;white-space:nowrap}\n.rte-wrap{border:1px solid var(--border);border-radius:9px;background:#fff;overflow:hidden}\n.rte-bar{display:flex;gap:3px;flex-wrap:wrap;align-items:center;padding:5px 7px;border-bottom:1px solid var(--border);background:#fafcfd}\n.rte-bar button{font:inherit;font-size:12.5px;font-weight:600;min-width:27px;min-height:26px;padding:0 7px;border:1px solid transparent;border-radius:6px;background:none;color:var(--muted);cursor:pointer;white-space:nowrap}\n.rte-bar button:hover{background:var(--primary-light);color:var(--primary-dark)}\n.rte-bar .sep{width:1px;height:16px;background:var(--border);margin:0 3px}\n.rte-bar .wc{margin-left:auto;font-size:11.5px;font-weight:500;color:var(--muted)}\n.rte{min-height:110px;padding:11px 13px;font-size:13.5px;line-height:1.55;outline:0;overflow:visible;resize:vertical}\n.rte:focus{background:#fdfdff}\n.rte:empty:before{content:attr(data-ph);color:#9aa7b0}\n.rte p{margin:0 0 8px}.rte ul,.rte ol{margin:0 0 8px;padding-left:22px}.rte li{margin-bottom:3px}\n.rte table{border-collapse:collapse;margin:6px 0}.rte td,.rte th{border:1px solid var(--border);padding:4px 7px}\n.crit-card{background:#fff;border:1px solid var(--border);border-radius:11px;padding:16px 18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(16,40,55,.05)}\n.crit-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px}\n.crit-num{font-weight:700;font-size:14px;color:var(--primary-dark);white-space:nowrap}\n.crit-title{font-weight:600;font-size:14px;flex:1;min-width:160px}\n.office{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:#fff59d;color:#1a4fc4;margin:2px 3px 2px 0;white-space:nowrap}\n.office.dept{background:var(--primary-light);color:var(--primary-dark)}\n.office.body{background:#f0eef8;color:#5a4a8f;font-weight:600}\n.crit-prompt{font-size:12.5px;color:var(--muted);line-height:1.5;margin:4px 0 9px}\n.crit-meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:9px}\n.crit-meta select,.crit-meta input{font:inherit;font-size:12.5px;padding:5px 8px;border:1px solid var(--border);border-radius:7px}\n.subcrit{font-size:10px;font-weight:800;color:#c00;background:#fff59d;padding:1px 5px;border-radius:3px;vertical-align:super;margin-left:5px;white-space:nowrap}\n.subtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}\n.subtabs button{font:inherit;font-size:13px;font-weight:600;padding:7px 15px;border-radius:20px;border:1px solid var(--border);background:#fff;color:var(--muted);cursor:pointer;white-space:nowrap}\n.subtabs button.active{background:var(--primary);border-color:var(--primary);color:#fff}\n.subtabs button:hover:not(.active){border-color:var(--primary);color:var(--primary-dark)}\n.dropzone{border:1.5px dashed var(--border);border-radius:10px;padding:20px;text-align:center;cursor:pointer;background:#fafcfd}\n.dropzone:hover,.dropzone.over{border-color:var(--primary);background:var(--primary-light)}\n.dropzone .big{font-weight:600;color:var(--primary-dark)}\n.dropzone .small{font-size:12.5px;color:var(--muted);margin-top:3px}\n.note{font-size:13px;color:var(--muted);background:#fafcfd;border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin:12px 0}\n.note b{color:var(--text)}\n.empty{padding:22px;text-align:center;color:var(--muted);font-size:13.5px}\n.stage{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 0}\n.stage span{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:5px;background:#eef2f5;color:var(--muted)}\n.stage span.on{background:var(--primary);color:#fff}\n.modal-bg{position:fixed;inset:0;background:rgba(15,45,61,.45);display:none;align-items:flex-start;justify-content:center;padding:36px 14px;overflow:auto;z-index:60}\n.modal-bg.open{display:flex}\n.modal{background:#fff;border-radius:12px;width:100%;max-width:820px;box-shadow:0 18px 50px rgba(10,40,55,.3)}\n.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}\n.modal-head h3{font-size:16px;color:var(--primary-dark)}\n.modal-body{padding:16px 20px;display:grid;gap:12px}\n.modal-foot{display:flex;gap:10px;align-items:center;padding:14px 20px;border-top:1px solid var(--border)}\n.x{background:none;border:0;font-size:19px;cursor:pointer;color:var(--muted);line-height:1}\n.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center}\n.toast{background:var(--primary-dark);color:#fff;padding:10px 17px;border-radius:9px;font-size:13.5px;box-shadow:0 10px 30px rgba(10,40,55,.25)}\n.toast.err{background:var(--danger)}\n.chartbox{position:relative;height:300px}\n.mono{font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;width:100%;min-height:150px;padding:11px;border:1px solid var(--border);border-radius:8px;background:#fafcfd;color:var(--text)}\n.matrix td,.matrix th{text-align:center;padding:6px 9px}\n.matrix td:first-child,.matrix th:first-child{text-align:left}\n.cell-ok{color:var(--ok);font-weight:600} .cell-bad{color:var(--danger);font-weight:600}\n.app-foot{border-top:1px solid var(--border);background:#fff;padding:18px 22px 26px;text-align:center;font-size:12.5px;color:var(--muted);line-height:1.6}\n.app-foot a{color:var(--primary);font-weight:600;text-decoration:none}\n.app-foot a:hover{color:var(--primary-dark);text-decoration:underline}\n@media (max-width:640px){ .app-header{padding:12px 15px} main{padding:16px 12px 50px} .card{padding:15px} .app-foot{padding:16px 14px 22px} }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<header class=\"app-header\">\n  <div>\n    <h1>OBE Program Manager<\u002Fh1>\n  <\u002Fdiv>\n  <div class=\"header-right\">\n    <span class=\"hchip\" id=\"progChip\">No program set<\u002Fspan>\n    <select class=\"hsel\" id=\"cycleSel\" title=\"Evaluation cycle\"><\u002Fselect>\n    <span class=\"hchip\" id=\"saveChip\">Saved locally<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<nav class=\"tabs\">\n  <button class=\"tab-btn active\" data-tab=\"dashboard\">Dashboard<\u002Fbutton>\n  <button class=\"tab-btn\" data-tab=\"program\">Program Info<\u002Fbutton>\n\n  <button class=\"tab-btn\" data-tab=\"courses\">CO Attainments<\u002Fbutton>\n  <button class=\"tab-btn\" data-tab=\"attain\">PLO Attainment<\u002Fbutton>\n  <button class=\"tab-btn\" data-tab=\"peo\">PEO Attainment<\u002Fbutton>\n  <button class=\"tab-btn\" data-tab=\"cqiwrap\">CQI &amp; Loop Closure<\u002Fbutton>\n  <button class=\"tab-btn\" data-tab=\"sarb\">SAR Builder<\u002Fbutton>\n  <button class=\"tab-btn\" data-tab=\"reports\">Reports<\u002Fbutton>\n  <button class=\"tab-btn\" data-tab=\"data\">Data &amp; Backup<\u002Fbutton>\n<\u002Fnav>\n\n<main>\n  <section class=\"tab active\" id=\"tab-dashboard\"><\u002Fsection>\n  <section class=\"tab\" id=\"tab-program\"><\u002Fsection>\n  <section class=\"tab\" id=\"tab-sarb\">\n    <div class=\"subtabs\" id=\"sarbNav\"><\u002Fdiv>\n    <div id=\"sarbBody\"><\u002Fdiv>\n    <div id=\"tab-crit1\"><\u002Fdiv>\n    <div id=\"tab-dossier\"><\u002Fdiv>\n    <div id=\"tab-sar\"><\u002Fdiv>\n  <\u002Fsection>\n  <section class=\"tab\" id=\"tab-courses\"><\u002Fsection>\n  <section class=\"tab\" id=\"tab-attain\"><\u002Fsection>\n  <section class=\"tab\" id=\"tab-peo\"><\u002Fsection>\n  <section class=\"tab\" id=\"tab-cqiwrap\">\n    <div class=\"subtabs\" id=\"cqiNav\"><\u002Fdiv>\n    <div id=\"tab-cqi\"><\u002Fdiv>\n    <div id=\"tab-loop\"><\u002Fdiv>\n  <\u002Fsection>\n  <section class=\"tab\" id=\"tab-reports\"><\u002Fsection>\n  <section class=\"tab\" id=\"tab-data\"><\u002Fsection>\n<\u002Fmain>\n\n<div class=\"modal-bg\" id=\"modalBg\">\n  <div class=\"modal\">\n    <div class=\"modal-head\"><h3 id=\"mTitle\">Edit<\u002Fh3><button class=\"x\" id=\"mX\">×<\u002Fbutton><\u002Fdiv>\n    <div class=\"modal-body\" id=\"mBody\"><\u002Fdiv>\n    <div class=\"modal-foot\">\n      <button class=\"btn danger\" id=\"mDel\" style=\"display:none\">Delete<\u002Fbutton>\n      <span style=\"flex:1\"><\u002Fspan>\n      <button class=\"btn secondary\" id=\"mCancel\">Cancel<\u002Fbutton>\n      <button class=\"btn\" id=\"mSave\">Save<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<div class=\"toasts\" id=\"toasts\"><\u002Fdiv>\n\n<footer class=\"app-foot\">\n  <div><b>OBE Program Manager v1.10<\u002Fb> (<a href=\"https://mazhar17.github.io/OPM/\" target=\"_blank\" rel=\"noopener\">mazhar17.github.io/OPM<\u002Fa>) · runs fully in your browser · data stays on your device · export backups regularly from Data &amp; Backup<\u002Fdiv>\n  <div style=\"margin-top:4px\">© 2026 <a href=\"https://mazhar17.github.io/MI\" target=\"_blank\" rel=\"noopener\">Prof. Mazharul Islam<\u002Fa> · Distributed under the Creative Commons Attribution (CC BY) 4.0 International License<\u002Fdiv>\n<\u002Ffooter>\n\n<script>\n'use strict';\n/* ============================================================\n   OBE Program Manager — program-level OBE/CQI workbench for\n   Program OBE Coordinators. Runs entirely in the browser:\n   course files are read locally, only aggregates are stored.\n   ============================================================ */\nvar STORE_KEY='obe-program-manager-v1';\nvar $=function(id){return document.getElementById(id);};\nvar esc=function(s){return String(s==null?'':s).replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c];});};\nvar r1=function(x){return Math.round(x*10)/10;};\nvar uid=function(p){return (p||'x')+Date.now().toString(36)+Math.random().toString(36).slice(2,6);};\nvar todayISO=function(){return new Date().toISOString().slice(0,10);};\nfunction toast(m,k){var t=document.createElement('div');t.className='toast'+(k==='err'?' err':'');t.textContent=m;$('toasts').appendChild(t);setTimeout(function(){t.style.transition='opacity .3s';t.style.opacity='0';setTimeout(function(){t.remove();},300);},2800);}\n\n/* ---------------- state ---------------- */\nvar state=null, view={tab:'dashboard', cycle:'', charts:{}, peoGrouped:true};\nfunction blank(){\n  return {\n    program:{code:'', name:'', dept:'', faculty:'', framework:'BAETE', frameworkVersion:'BAETE V3.0', accreditor:'BAETE', status:'Accredited', coordinator:''},\n    cfg:{ploTarget:50, peoTarget:70, wDirect:80, wIndirect:20},\n    peos:[], plos:[], cycles:[], peoRecords:[], cqi:[],\n    crit1:{instVision:'', instMission:'', deptVision:'', deptMission:'', alignment:'', peoProcess:'', dissemination:'', resourceRealism:'', trackingProcess:''},\n    stakeholders:[], feedback:[], capstones:[], dwc:[], audit:{},\n    crit5:{qaSystem:'', studentFeedback:''}, sar:{},\n    updatedAt:''\n  };\n}\nfunction load(){\n  try{ var raw=localStorage.getItem(STORE_KEY); if(raw) state=JSON.parse(raw); }catch(e){}\n  if(!state) state=blank();\n  ['peos','plos','cycles','peoRecords','cqi','stakeholders','feedback','capstones','dwc'].forEach(function(k){ if(!Array.isArray(state[k])) state[k]=[]; });\n  if(!state.program) state.program=blank().program;\n  if(!state.cfg) state.cfg=blank().cfg;\n  if(!state.crit1) state.crit1=blank().crit1;\n  if(!state.crit5) state.crit5=blank().crit5;\n  if(!state.sar) state.sar={};\n  if(!state.audit) state.audit={};\n  if(!state.program.frameworkVersion) state.program.frameworkVersion='BAETE V3.0';\n  /* forward-fill so program files written by earlier versions open cleanly */\n  state.plos.forEach(function(p){\n    ['wk','wp','ea','sdg'].forEach(function(k){ if(!Array.isArray(p[k])) p[k]=[]; });\n    ['method','criteria','expected','prose','annexure'].forEach(function(k){ if(p[k]==null) p[k]=''; });\n    if(p.notAssessed==null) p.notAssessed=false;\n  });\n  state.peos.forEach(function(p){ ['method','tool','criteria','tracking','annexure','missionLink'].forEach(function(k){ if(p[k]==null) p[k]=''; }); });\n  state.cqi.forEach(function(a){ if(!a.loop) a.loop=(a.src==='PEO'?'PEO':'PO'); ['committee','meetingRef','meetingDate','annexure'].forEach(function(k){ if(a[k]==null) a[k]=''; }); });\n  state.cycles.forEach(function(c){ if(c.gradCohort==null) c.gradCohort=false; if(!c.transfer) c.transfer={}; });\n}\nfunction save(){\n  state.updatedAt=new Date().toISOString();\n  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); $('saveChip').textContent='Saved locally \\u00b7 '+new Date().toLocaleTimeString(); }\n  catch(e){ $('saveChip').textContent='Not saved (storage full)'; }\n}\n\n/* ---------------- templates ---------------- */\n/* BAETE ACC-MAN-02 V3.0 (effective 1 July 2025) \\u2014 the twelve POs.\n   [code, short label, statement, BNQF domain, WK attributes]  */\nfunction baetePOs(){ return [\n  ['PLO1','Engineering knowledge','Apply knowledge of mathematics, natural science, computing, engineering fundamentals and an engineering specialization as specified in WK1 to WK4 respectively to develop solutions of complex engineering problems.','Fundamental',['WK1','WK2','WK3','WK4']],\n  ['PLO2','Problem analysis','Identify, formulate, research literature and analyze complex engineering problems reaching substantiated conclusions using first principles of mathematics, natural sciences and engineering sciences with holistic considerations for sustainable development (WK1 to WK4).','Thinking',['WK1','WK2','WK3','WK4']],\n  ['PLO3','Design/development of solutions','Design creative solutions for complex engineering problems and design systems, components or processes to meet identified needs with appropriate consideration for public health and safety, whole-life cost, net zero carbon as well as resource, cultural, societal, and environmental considerations as required (WK5).','Thinking',['WK5']],\n  ['PLO4','Investigation','Conduct investigations of complex engineering problems using research methods including research-based knowledge, design of experiments, analysis and interpretation of data, and synthesis of information to provide valid conclusions (WK8).','Thinking',['WK8']],\n  ['PLO5','Modern tool usage','Create, select and apply and recognize limitations of appropriate techniques, resources, and modern engineering and IT tools, including prediction and modeling, to complex engineering problems (WK2, WK6).','Fundamental',['WK2','WK6']],\n  ['PLO6','The engineer and the world','When solving complex engineering problems, analyze and evaluate sustainable development impacts to: society, the economy, sustainability, health and safety, legal frameworks, and the environment (WK1, WK5, and WK7).','Social',['WK1','WK5','WK7']],\n  ['PLO7','Ethics','Apply ethical principles and commit to professional ethics and norms of engineering practice and adhere to relevant national and international laws. Demonstrate an understanding of the need for diversity and inclusion (WK9).','Personal',['WK9']],\n  ['PLO8','Individual and collaborative team work','Function effectively as an individual, and as a member or leader in diverse and inclusive teams and in multi-disciplinary, face-to-face, remote and distributed settings (WK9).','Social',['WK9']],\n  ['PLO9','Communication','Communicate effectively and inclusively on complex engineering activities with the engineering community and with society at large, such as being able to comprehend and write effective reports and design documentation, make effective presentations, taking into account cultural, language, and learning differences.','Social',[]],\n  ['PLO10','Project management and finance','Apply knowledge and understanding of engineering management principles and economic decision-making and apply these to one\\u2019s own work, as a member and leader in a team and to manage projects and in multidisciplinary environments.','Fundamental',[]],\n  ['PLO11','Life-long learning','Recognize the need for, and have the preparation and ability for i) independent and life-long learning ii) adaptability to new and emerging technologies and iii) critical thinking in the broadest context of technological change (WK8).','Personal',['WK8']],\n  ['PLO12','Entrepreneurship','Demonstrate knowledge and understanding of the competences necessary to transform opportunities and ideas into a new business.','Personal',[]]\n];}\n/* The superseded V2.1 wording, kept only so a migration can be explained. */\nfunction baeteV21Labels(){ return {1:'Engineering knowledge',2:'Problem analysis',3:'Design/development of solutions',4:'Investigation',5:'Modern tool usage',6:'The engineer and society',7:'Environment and sustainability',8:'Ethics',9:'Individual and team work',10:'Communication',11:'Project management and finance',12:'Life-long learning'};}\n/* Which V2.1 outcome each V3.0 outcome continues (null = no predecessor). */\nfunction v3Lineage(){ return {\n  1:{from:'PO1',note:'Computing added explicitly to the statement.'},\n  2:{from:'PO2',note:'Holistic considerations for sustainable development added.'},\n  3:{from:'PO3',note:'Whole-life cost and net zero carbon added.'},\n  4:{from:'PO4',note:'Substantially unchanged.'},\n  5:{from:'PO5',note:'Recognising the limitations of tools is now explicit.'},\n  6:{from:'PO6 + PO7',note:'Merges the old PO6 (engineer and society) and PO7 (environment and sustainability). Neither historical series transfers cleanly \\u2014 record the decision taken.'},\n  7:{from:'PO8',note:'National and international law compliance, and diversity and inclusion, added.'},\n  8:{from:'PO9',note:'Face-to-face, remote and distributed settings added.'},\n  9:{from:'PO10',note:'Inclusive communication across cultural, language and learning differences added.'},\n  10:{from:'PO11',note:'Renumbered only.'},\n  11:{from:'PO12',note:'Adaptability to emerging technologies and critical thinking added.'},\n  12:{from:null,note:'Entirely new in V3.0 \\u2014 no V2.1 predecessor. A program with no entrepreneurship assessment starts from nothing here.'}\n};}\nvar WK_LIST=[\n  ['WK1','A systematic, theory-based understanding of the natural sciences applicable to the discipline and awareness of relevant social sciences'],\n  ['WK2','Conceptually based mathematics, numerical analysis, data analysis, statistics and the formal aspects of computer and information science supporting detailed analysis and modeling'],\n  ['WK3','A systematic, theory-based formulation of engineering fundamentals required in the engineering discipline'],\n  ['WK4','Engineering specialist knowledge providing theoretical frameworks and bodies of knowledge for accepted practice areas; much at the forefront of the discipline'],\n  ['WK5','Knowledge including efficient resource use, environmental impacts, whole-life cost, re-use of resources, net zero carbon and similar concepts supporting engineering design and operations'],\n  ['WK6','Knowledge of engineering practice (technology) in the practice areas of the discipline'],\n  ['WK7','Knowledge of the role of engineering in society and identified issues in practice, such as professional responsibility to public safety and sustainable development'],\n  ['WK8','Engagement with selected knowledge in current research literature; awareness of the power of critical thinking and creative approaches to evaluate emerging issues'],\n  ['WK9','Ethics, inclusive behaviour and conduct; professional ethics, responsibilities and norms; awareness of the need for diversity with mutual understanding and respect']\n];\nvar WP_LIST=[\n  ['WP1','Depth of knowledge \\u2014 cannot be resolved without in-depth engineering knowledge at the level of WK3, WK4, WK5, WK6 or WK8'],\n  ['WP2','Range of conflicting requirements \\u2014 wide-ranging or conflicting technical and non-technical issues, and future requirements'],\n  ['WP3','Depth of analysis \\u2014 no obvious solution; abstract thinking, creativity and originality to formulate suitable models'],\n  ['WP4','Familiarity of issues \\u2014 infrequently encountered issues or novel problems'],\n  ['WP5','Extent of applicable codes \\u2014 problems not encompassed by standards and codes of practice'],\n  ['WP6','Stakeholder involvement \\u2014 collaboration across disciplines, other fields and diverse groups of stakeholders'],\n  ['WP7','Interdependence \\u2014 high-level problems with many components or sub-problems requiring a systems approach']\n];\nvar EA_LIST=[\n  ['EA1','Range of resources \\u2014 diverse resources: people, data and information, natural, financial and physical resources, and appropriate technologies'],\n  ['EA2','Level of interactions \\u2014 optimal resolution of interactions between wide-ranging and conflicting technical, non-technical and engineering issues'],\n  ['EA3','Innovation \\u2014 creative use of engineering principles, innovative solutions for a conscious purpose, and research-based knowledge'],\n  ['EA4','Consequences to society and the environment \\u2014 significant consequences characterised by difficulty of prediction and mitigation'],\n  ['EA5','Familiarity \\u2014 can extend beyond previous experiences by applying principles-based approaches']\n];\nvar SDG_LIST=['SDG1 No poverty','SDG2 Zero hunger','SDG3 Good health and well-being','SDG4 Quality education','SDG5 Gender equality','SDG6 Clean water and sanitation','SDG7 Affordable and clean energy','SDG8 Decent work and economic growth','SDG9 Industry, innovation and infrastructure','SDG10 Reduced inequalities','SDG11 Sustainable cities and communities','SDG12 Responsible consumption and production','SDG13 Climate action','SDG14 Life below water','SDG15 Life on land','SDG16 Peace, justice and strong institutions','SDG17 Partnerships for the goals'];\n/* SAR clauses 2.7.1\\u20132.7.6 require WP attributes; clause 2.7.9 requires EA attributes. */\nfunction wpRequired(n){ return Number(n)>=1 && Number(n)<=6; }\nfunction eaRequired(n){ return Number(n)===9; }\nfunction poLabel(code){ return String(code||'').replace(/^PLO/,'PO'); }\n\nfunction samplePEOs(){ return [\n  'Graduates will build successful professional careers applying core disciplinary knowledge to problems of industry and society.',\n  'Graduates will work and lead effectively in multidisciplinary teams, using modern tools and sound management practice.',\n  'Graduates will practise their profession ethically, with due regard for society, environment and sustainability.',\n  'Graduates will engage in life-long learning, postgraduate study and continuing professional development.'\n];}\nvar DOMAINS=['Fundamental','Social','Thinking','Personal'];\n\n/* ---------------- course-file analysis (aggregates only) ---------------- */\nfunction analyzeCourse(c){\n  var itemsByCo={};\n  (c.assessments||[]).forEach(function(a){ (a.items||[]).forEach(function(it){ (itemsByCo[it.coId]=itemsByCo[it.coId]||[]).push(it); }); });\n  var kpi=Number((c.cfg&&c.cfg.kpiMarks)!=null&&c.cfg.kpiMarks!==''?c.cfg.kpiMarks:50);\n  var coStats={}, coList=[];\n  (c.cos||[]).forEach(function(co,idx){\n    var items=itemsByCo[co.id]||[];\n    var res=null;\n    if(items.length){\n      var considered=0, achieved=0;\n      (c.students||[]).forEach(function(st){\n        var mk=(c.marks||{})[st.id]||{}, got=0, max=0;\n        items.forEach(function(it){ var v=mk[it.id]; if(v!=null&&v!==''){ got+=Number(v)||0; max+=Number(it.max)||0; } });\n        if(max>0){ considered++; if(got/max*100>=kpi) achieved++; }\n      });\n      if(considered) res={attain:achieved/considered*100, considered:considered};\n    }\n    coStats[co.id]=res;\n    coList.push({code:'CO'+(idx+1), attain:res?r1(res.attain):null, pos:Object.keys(co.po||{}).map(Number).sort(function(a,b){return a-b;})});\n  });\n  var acc={};\n  (c.cos||[]).forEach(function(co){\n    var st=coStats[co.id]; if(!st) return;\n    Object.keys(co.po||{}).forEach(function(n){\n      var w=Number(co.po[n])||1;\n      if(!acc[n]) acc[n]={w:0,s:0};\n      acc[n].w+=w; acc[n].s+=st.attain*w;\n    });\n  });\n  var poAttain={};\n  Object.keys(acc).forEach(function(n){ poAttain[n]=r1(acc[n].s/acc[n].w); });\n  return {\n    code:c.code||'?', title:c.title||'', credit:Number(c.credit)||0, section:c.section||'',\n    semester:c.semester||'', cohort:c.cohort||'', programText:c.program||'', instructor:c.instructor||'',\n    students:(c.students||[]).length, cos:coList,\n    kpiTarget:Number((c.cfg&&c.cfg.kpiTarget)!=null&&c.cfg.kpiTarget!==''?c.cfg.kpiTarget:50),\n    poAttain:poAttain\n  };\n}\n\n/* ---------------- cycle helpers ---------------- */\nfunction cycles(){ return state.cycles.slice().sort(function(a,b){ return semRank(b.semester)-semRank(a.semester); }); }\nfunction semRank(s){ var m=/(Spring|Summer|Fall)\\s*(\\d{4})/i.exec(String(s||'')); if(!m) return 0; var t={spring:1,summer:2,fall:3}[m[1].toLowerCase()]||0; return Number(m[2])*10+t; }\nfunction curCycle(){ var cs=cycles(); if(!cs.length) return null; var f=cs.filter(function(c){return c.id===view.cycle;})[0]; return f||cs[0]; }\nfunction cycleById(id){ return state.cycles.filter(function(c){return c.id===id;})[0]||null; }\nfunction plosSorted(){ return state.plos.slice().sort(function(a,b){ return num(a.code)-num(b.code); }); }\nfunction num(code){ var m=/\\d+/.exec(String(code||'')); return m?Number(m[0]):0; }\nfunction ploByNum(n){ return state.plos.filter(function(p){return num(p.code)===Number(n);})[0]||null; }\nfunction targetFor(cy,plo){\n  if(cy && cy.targets && cy.targets[plo.code]!=null && cy.targets[plo.code]!=='') return Number(cy.targets[plo.code]);\n  return Number(state.cfg.ploTarget)||50;\n}\nfunction directOf(cy,plo){\n  if(!cy||(plo&&plo.notAssessed)) return null;\n  var s=0,w=0;\n  (cy.courses||[]).forEach(function(c){\n    var v=c.poAttain[num(plo.code)];\n    if(v==null) return;\n    var cr=c.credit||1; s+=v*cr; w+=cr;\n  });\n  return w? r1(s/w) : null;\n}\nfunction indirectOf(cy,plo){\n  var v=cy&&cy.indirect? cy.indirect[plo.code]:'';\n  return (v===''||v==null)? null : Number(v);\n}\nfunction combinedOf(cy,plo){\n  if(plo&&plo.notAssessed) return null;\n  var d=directOf(cy,plo), i=indirectOf(cy,plo);\n  if(d==null) return null;\n  if(i==null) return d;\n  var wd=Number(state.cfg.wDirect)||80, wi=Number(state.cfg.wIndirect)||20;\n  return r1((d*wd+i*wi)/(wd+wi));\n}\nfunction contributors(cy,plo){\n  return (cy&&cy.courses||[]).filter(function(c){ return c.poAttain[num(plo.code)]!=null; })\n    .map(function(c){ return {code:c.code, section:c.section, credit:c.credit, v:c.poAttain[num(plo.code)]}; })\n    .sort(function(a,b){ return a.v-b.v; });\n}\nfunction gapsIn(cy){\n  if(!cy) return [];\n  return plosSorted().filter(function(pl){ return !pl.notAssessed; }).map(function(pl){\n    var v=combinedOf(cy,pl), t=targetFor(cy,pl);\n    return (v!=null&&v<t)? {plo:pl, value:v, target:t}:null;\n  }).filter(Boolean);\n}\nfunction peoGaps(){\n  return state.peoRecords.filter(function(r){\n    var t=(r.target===''||r.target==null)? Number(state.cfg.peoTarget)||70 : Number(r.target);\n    return r.actual!==''&&r.actual!=null&&Number(r.actual)<t;\n  });\n}\nfunction cqiFor(outcome, cycleLabel){\n  return state.cqi.filter(function(a){ return a.outcome===outcome && (!cycleLabel || a.cycle===cycleLabel); });\n}\nfunction openCqi(){ return state.cqi.filter(function(a){ return a.status!=='Closed'; }); }\n\n/* ---------------- generic modal ---------------- */\nfunction modal(title, fields, opts){\n  opts=opts||{};\n  $('mTitle').textContent=title;\n  var body=$('mBody'); body.innerHTML='';\n  fields.forEach(function(f){\n    if(f.type==='html'){ var d=document.createElement('div'); d.className='note'; d.style.margin='0'; d.innerHTML=f.html; body.appendChild(d); return; }\n    var l=document.createElement('label'); l.className='fld'; l.textContent=f.label;\n    var inp;\n    if(f.type==='textarea'){ inp=document.createElement('textarea'); if(f.rows) inp.rows=f.rows; }\n    else if(f.type==='select'){ inp=document.createElement('select'); (f.options||[]).forEach(function(o){ var op=document.createElement('option'); op.textContent=o; inp.appendChild(op); }); }\n    else { inp=document.createElement('input'); inp.type=f.type==='number'?'number':(f.type==='date'?'date':'text'); }\n    if(f.placeholder) inp.placeholder=f.placeholder;\n    inp.value=(f.value==null?'':f.value);\n    l.appendChild(inp);\n    if(f.hint){ var h=document.createElement('div'); h.style.cssText='font-size:11.5px;color:var(--muted);margin-top:3px;font-weight:400'; h.textContent=f.hint; l.appendChild(h); }\n    f._el=inp; body.appendChild(l);\n  });\n  if(opts.build) opts.build(body);\n  document.querySelector('#modalBg .modal').style.maxWidth = opts.wide? '980px':'820px';\n  $('mDel').style.display=opts.onDelete?'inline-block':'none';\n  $('mDel').onclick=opts.onDelete||null;\n  $('mSave').textContent=opts.saveLabel||'Save';\n  $('mSave').onclick=function(){\n    var v={}; fields.forEach(function(f){ if(f._el) v[f.key]=String(f._el.value).trim(); });\n    if(opts.onSave) opts.onSave(v);\n  };\n  $('modalBg').classList.add('open');\n  if(fields[0]&&fields[0]._el) setTimeout(function(){ fields[0]._el.focus(); },40);\n}\nfunction closeModal(){ $('modalBg').classList.remove('open'); }\n$('mX').onclick=closeModal; $('mCancel').onclick=closeModal;\n$('modalBg').onclick=function(e){ if(e.target===$('modalBg')) closeModal(); };\ndocument.addEventListener('keydown',function(e){ if(e.key==='Escape') closeModal(); });\n\n/* ---------------- tabs ---------------- */\ndocument.querySelectorAll('.tab-btn').forEach(function(b){\n  b.onclick=function(){ go(b.dataset.tab); };\n});\nfunction refresh(){\n  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.tab===view.tab); });\n  document.querySelectorAll('section.tab').forEach(function(s){ s.classList.toggle('active', s.id==='tab-'+view.tab); });\n  var p=state.program;\n  $('progChip').textContent = p.code? (p.code+' \\u00b7 '+(p.framework||'')) : 'No program set';\n  var cs=cycles();\n  $('cycleSel').innerHTML = cs.length? cs.map(function(c){ return '<option value=\"'+esc(c.id)+'\">'+esc(c.semester)+(c.cohort?' \\u00b7 '+esc(c.cohort):'')+'<\u002Foption>'; }).join('') : '<option value=\"\">No cycle yet<\u002Foption>';\n  var cur=curCycle(); if(cur) $('cycleSel').value=cur.id;\n  var fn={dashboard:renderDashboard,program:renderProgram,sarb:renderSarBuilder,courses:renderCourses,attain:renderAttain,peo:renderPeo,cqiwrap:renderCqiWrap,reports:renderReports,data:renderData}[view.tab];\n  if(fn) fn();\n}\n$('cycleSel').onchange=function(){ view.cycle=$('cycleSel').value; refresh(); };\n\n/* ---------------- Dashboard ---------------- */\nfunction renderDashboard(){\n  var el=$('tab-dashboard'), cy=curCycle();\n  if(!state.plos.length){\n    el.innerHTML='<div class=\"card\"><h2>Welcome to the OBE Program Manager<\u002Fh2>'+\n      '<p class=\"hint\">Set up once, then each semester it takes minutes: drop your course files, review, act on the gaps, export the IQAC return.<\u002Fp>'+\n      '<div class=\"grid c2\">'+\n        '<div class=\"kpi\"><div class=\"cap\">Step 1<\u002Fdiv><div class=\"sub\" style=\"margin-top:6px\">Fill in <b>Program Info<\u002Fb> (code, framework, targets).<\u002Fdiv><\u002Fdiv>'+\n        '<div class=\"kpi\"><div class=\"cap\">Step 2<\u002Fdiv><div class=\"sub\" style=\"margin-top:6px\">Load the PLO/PEO set on <b>Program Info<\u002Fb> \\u2014 one click for BAETE.<\u002Fdiv><\u002Fdiv>'+\n        '<div class=\"kpi\"><div class=\"cap\">Step 3<\u002Fdiv><div class=\"sub\" style=\"margin-top:6px\">Drop the semester\\u2019s course files under <b>CO Attainments<\u002Fb>.<\u002Fdiv><\u002Fdiv>'+\n        '<div class=\"kpi\"><div class=\"cap\">Step 4<\u002Fdiv><div class=\"sub\" style=\"margin-top:6px\">Work the <b>CQI Register<\u002Fb> and export the <b>IQAC Return<\u002Fb>.<\u002Fdiv><\u002Fdiv>'+\n      '<\u002Fdiv>'+\n      '<div class=\"btn-row\"><button class=\"btn\" onclick=\"go(\\'program\\')\">Start with Program Info<\u002Fbutton>'+\n      '<button class=\"btn secondary\" onclick=\"loadBaete()\">Load BAETE PLOs + sample PEOs<\u002Fbutton>'+\n      '<button class=\"btn secondary\" onclick=\"loadSample()\">Open the grand sample program<\u002Fbutton><\u002Fdiv><\u002Fdiv>';\n    return;\n  }\n  var gs=gapsIn(cy), pg=peoGaps(), oc=openCqi();\n  var overdue=oc.filter(function(a){ return a.targetDate && a.targetDate<todayISO(); });\n  var plos=plosSorted();\n  var reported=cy? plos.filter(function(p){return combinedOf(cy,p)!=null;}).length:0;\n  var h='<div class=\"btn-row\" style=\"margin:0 0 14px;justify-content:flex-end\">'+\n    '<span style=\"flex:1;font-size:12.5px;color:var(--muted)\">'+esc(state.program.name||'Program')+(cy?' \\u00b7 '+esc(cy.semester)+(cy.cohort?' \\u00b7 '+esc(cy.cohort):''):'')+'<\u002Fspan>'+\n    '<button class=\"btn small secondary\" onclick=\"loadSample()\">Load grand sample<\u002Fbutton>'+\n    '<button class=\"btn small danger\" onclick=\"startFresh()\">Start fresh<\u002Fbutton><\u002Fdiv>'+\n    '<div class=\"grid c4\" style=\"margin-bottom:18px\">'+\n    kpi('PLOs met', cy? (reported-gs.length)+'/'+reported : '\\u2014', cy? (cy.semester+(cy.cohort?' \\u00b7 '+cy.cohort:'')):'no cycle loaded', gs.length?'warn':'ok')+\n    kpi('PLOs below target', gs.length, gs.length? gs.map(function(g){return g.plo.code;}).join(', '):'all on target', gs.length?'bad':'ok')+\n    kpi('Open CQI actions', oc.length, overdue.length? overdue.length+' past target date':'none overdue', overdue.length?'bad':(oc.length?'warn':'ok'))+\n    kpi('PEO gaps', pg.length, state.peoRecords.length? 'from '+state.peoRecords.length+' record(s) across '+peoCohorts().length+' cohort(s)':'no PEO data yet', pg.length?'bad':'ok')+\n  '<\u002Fdiv>';\n\n  h+='<div class=\"card\"><h2>PLO attainment \\u2014 '+(cy? esc(cy.semester)+(cy.cohort?' ('+esc(cy.cohort)+')':''):'no cycle')+'<\u002Fh2>'+\n    '<p class=\"hint\">Combined attainment (direct '+esc(state.cfg.wDirect)+'% / indirect '+esc(state.cfg.wIndirect)+'%) against target. Red bars are the CQI agenda.<\u002Fp>'+\n    '<div class=\"chartbox\"><canvas id=\"chPlo\"><\u002Fcanvas><\u002Fdiv><\u002Fdiv>';\n\n  if(gs.length){\n    h+='<div class=\"card\"><h2>Needs action now<\u002Fh2><p class=\"hint\">Below-target PLOs in this cycle. One click drafts a CQI entry with the finding pre-written.<\u002Fp><div class=\"tbl-wrap\"><table class=\"tbl\"><thead><tr><th>PLO<\u002Fth><th>Attained<\u002Fth><th>Target<\u002Fth><th>Weakest contributing courses<\u002Fth><th>CQI<\u002Fth><\u002Ftr><\u002Fthead><tbody>';\n    gs.forEach(function(g){\n      var cc=contributors(cy,g.plo).slice(0,3);\n      var acts=cqiFor(g.plo.code, cy.semester);\n      h+='<tr><td><b>'+esc(g.plo.code)+'<\u002Fb><div style=\"font-size:12px;color:var(--muted)\">'+esc(g.plo.label||'')+'<\u002Fdiv><\u002Ftd>'+\n        '<td><span class=\"pill p-bad\">'+g.value+'%<\u002Fspan><\u002Ftd><td>'+g.target+'%<\u002Ftd>'+\n        '<td>'+(cc.map(function(c){return '<span class=\"chip\">'+esc(c.code)+' '+c.v+'%<\u002Fspan>';}).join('')||'<span style=\"color:var(--muted)\">\\u2014<\u002Fspan>')+'<\u002Ftd>'+\n        '<td>'+(acts.length? '<span class=\"pill p-info\">'+esc(acts[0].status)+'<\u002Fspan>':'<button class=\"btn small\" onclick=\"draftCqi(\\''+esc(g.plo.code)+'\\')\">Draft CQI<\u002Fbutton>')+'<\u002Ftd><\u002Ftr>';\n    });\n    h+='<\u002Ftbody><\u002Ftable><\u002Fdiv><div class=\"btn-row\"><button class=\"btn\" onclick=\"scanGaps()\">Draft CQI for all gaps<\u002Fbutton><button class=\"btn secondary\" onclick=\"go(\\'cqi\\')\">Open CQI Register<\u002Fbutton><\u002Fdiv><\u002Fdiv>';\n  }\n  if(oc.length){\n    h+='<div class=\"card\"><h2>Open CQI actions<\u002Fh2><div class=\"tbl-wrap\"><table class=\"tbl\"><thead><tr><th>Outcome<\u002Fth><th>Action<\u002Fth><th>Owner<\u002Fth><th>Target date<\u002Fth><th>Stage<\u002Fth><\u002Ftr><\u002Fthead><tbody>';\n    oc.slice(0,8).forEach(function(a){\n      h+='<tr><td><span class=\"chip\">'+esc(a.outcome)+'<\u002Fspan><\u002Ftd><td>'+esc(a.action||a.finding)+'<\u002Ftd><td>'+esc(a.owner||'\\u2014')+'<\u002Ftd>'+\n        '<td>'+(a.targetDate? (a.targetDate<todayISO()? '<span class=\"pill p-bad\">'+esc(a.targetDate)+'<\u002Fspan>':esc(a.targetDate)) : '\\u2014')+'<\u002Ftd>'+\n        '<td>'+stageHtml(a.status)+'<\u002Ftd><\u002Ftr>';\n    });\n    h+='<\u002Ftbody><\u002Ftable><\u002Fdiv><\u002Fdiv>';\n  }\n  el.innerHTML=h;\n  drawPloChart(cy);\n}\nfunction kpi(cap,val,sub,cls){ return '<div class=\"kpi '+(cls||'')+'\"><div class=\"cap\">'+esc(cap)+'<\u002Fdiv><div class=\"val\">'+esc(val)+'<\u002Fdiv><div class=\"sub\">'+esc(sub)+'<\u002Fdiv><\u002Fdiv>'; }\nfunction stageHtml(status){\n  var stages=['Identify','Analyse','Act','Verify','Close'];\n  var idx={'Identified':0,'Analysed':1,'In progress':2,'Implemented':3,'Verified':3,'Closed':4}[status];\n  if(idx==null) idx=0;\n  return '<div class=\"stage\">'+stages.map(function(s,i){ return '<span class=\"'+(i<=idx?'on':'')+'\">'+s+'<\u002Fspan>'; }).join('')+'<\u002Fdiv>';\n}\nfunction go(t){\n  if(t==='crit1'){ view.tab='sarb'; view.sarSub='1'; }\n  else if(t==='dossier'){ view.tab='sarb'; view.sarSub='2'; }\n  else if(t==='sar'){ view.tab='sarb'; view.sarSub='sar'; }\n  else if(t==='cqi'||t==='loop'){ view.tab='cqiwrap'; view.cqiSub=t; }\n  else view.tab=t;\n  refresh(); window.scrollTo(0,0);\n}\n\n/* ============================================================\n   SAR report builder \\u2014 all nine criteria of ACC-TMP-04-04 V3,\n   each sub-criterion with the AUST office(s) that hold the data.\n   ============================================================ */\nvar OFF={\n  DEPT:'Department / PSAC', COORD:'Program OBE Coordinator', DEAN:'Dean of Faculty',\n  IQAC:'IQAC', REG:'Office of the Registrar', VC:'Office of the Vice-Chancellor',\n  TRE:'Office of the Treasurer', COE:'Controller of Examinations', LIB:'Kazi Fazlur Rahman Library',\n  PROC:'Office of the Proctor', ASW:'Advisor of Students\\u2019 Welfare', UE:'Office of the University Engineer',\n  ICT:'ICT Center', PND:'Planning and Development (P&D)', CES:'Center for Extension Services (CES)',\n  RPO:'Research and Publication Office (RPO)', CPC:'Career Placement Center (CPC)',\n  CSTF:'Campus Safety Task Force (CSTF)', ADM:'Admission Office', ALUM:'Alumni Association',\n  IAP:'Industrial Advisory Panel', MED:'Medical Centre', FIN:'Finance Committee'\n};\nvar SAR_STRUCT=[\n {n:1,title:'Program Educational Objectives',items:[\n  {id:'1.1',t:'Mission and Vision Statement',o:[OFF.REG,OFF.DEPT],p:'Institutional and departmental vision and mission, and how they are aligned.',covered:'crit1'},\n  {id:'1.2',t:'Program Educational Objectives',o:[OFF.DEPT,OFF.IAP,OFF.ALUM,OFF.IQAC],p:'PEO statements, the process and stakeholders behind them, publication and dissemination, and why they are realistic within available akeholder results and feedback are systematically used \\u2014 with survey results, analyses and meeting minutes.',covered:'cqi'},\n  {id:'5.4.2',t:'CQI Loop for PO',o:[OFF.COORD,OFF.DEPT],p:'The PO improvement process and how direct and indirect assessment results are systematically used.',covered:'cqi'},\n  {id:'5.4.3',t:'CQI Loop for Courses and Curriculum',o:[OFF.DEPT,OFF.IQAC],p:'The course and curriculum improvement process and how assessment results and stakeholder feedback are systematically used.',covered:'cqi'}\n ]},\n {n:6,title:'Students',items:[\n  {id:'6.1',t:'Policy for Student Admission',o:[OFF.ADM,OFF.REG],p:'Admission policy and process, exceptions, dissemination, quotas, admitted numbers per semester for three years, and how the requirements select students able to attain the POs.'},\n  {id:'6.2',t:'Policy for Transfer Students',o:[OFF.REG,OFF.COE,OFF.DEPT],p:'Transfer policy, equivalence of transfer credits, and the transfer table for the last three academic years.'},\n  {id:'6.3',t:'Advising and Counseling',o:[OFF.DEPT,OFF.ASW,OFF.MED,OFF.CPC],p:'Academic advising process and adviser lists for three semesters, advising records, professional and mental-health counselling, career counselling and placement support, and support for international students.'},\n  {id:'6.4',t:'Extra- and Co-curricular Activities',o:[OFF.ASW,OFF.PROC,OFF.DEPT],p:'Institutional policy and support, student participation and achievements over three years, professional-society opportunities, and whether the workload allows participation.'}\n ]},\n {n:7,title:'Faculty',items:[\n  {id:'7.1',t:'Full-time Faculty Members',o:[OFF.REG,OFF.DEPT],p:'Full-time faculty per semester of the last academic year with designation, specialisation, highest degree, experience, joining date and weekly load; and whether the complement is sufficient.'},\n  {id:'7.2',t:'Part-time Faculty Members',o:[OFF.REG,OFF.DEPT],p:'Part-time faculty per semester with the same particulars, plus CVs in the annexure.'},\n  {id:'7.3',t:'Class Size',o:[OFF.COE,OFF.DEPT],p:'Minimum, maximum and average class size per semester for three years, and whether it suits teaching-learning and assessment.'},\n  {id:'7.4',t:'Student-teacher Ratio',o:[OFF.REG,OFF.COE,OFF.DEPT],p:'The ratio per semester for three years, the calculation model with justification, and whether it supports interaction.'},\n  {id:'7.5',t:'Role of Faculty Members in Coordinating and Improving the Courses',o:[OFF.DEPT],p:'Faculty role in setting COs, choosing pedagogy and assessment tools, updating content and deciding quality improvements \\u2014 with meeting minutes.'},\n  {id:'7.6',t:'Professional Development',o:[OFF.RPO,OFF.DEPT,OFF.REG],p:'Faculty engagement in research, development and professional activity, how students benefit, institutional support, and the publications/consultancy/society table.'},\n  {id:'7.7',t:'Training of Faculty Members on Outcome-based Education',o:[OFF.IQAC,OFF.DEPT],p:'OBE training data and why it is adequate for setting COs, teaching, assessing and measuring outcome achievement.'}\n ]},\n {n:8,title:'Governance, Finance and Safety',items:[\n  {id:'8.1',t:'Background Information',o:[OFF.REG,OFF.PND],p:'Background of the institution and the program under evaluation, in no more than 300 words.'},\n  {id:'8.2',t:'Organizational Structure',o:[OFF.REG],p:'An up-to-date organogram of the institution.'},\n  {id:'8.3.1',t:'Appointment of Statutory Positions',o:[OFF.REG,OFF.VC],p:'How each statutory position is appointed, by which authority, for what period, under which clause of the Act/Statute/Rule.'},\n  {id:'8.3.2',t:'Formation and Function of the Statutory Bodies',o:[OFF.REG],p:'For each statutory body: assigned responsibility, membership table, comment on alignment of actual activity, and meeting dates with notices.'},\n  {id:'8.3.3',t:'Formation and Function of the Management Committees',o:[OFF.REG,OFF.VC],p:'The same for non-statutory management committees.'},\n  {id:'8.4.1',t:
